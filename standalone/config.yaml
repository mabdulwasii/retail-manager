# SSL/TLS Certificate Configuration
# ============================================================================
certificates:
  # Auto-generate self-signed certificates
  autoGenerate: true

  # Certificate details
  commonName: "localhost"    # Should match your domain
  organization: "Your Company"
  country: "US"
  state: "California"
  locality: "San Francisco"
  validityDays: 365

  # Automatic installation to system trust store
  autoInstall:
    enabled: true            # Auto-install to OS trust store

    # Platform-specific settings
    platforms:
      macOS:
        keychain: true       # Install to system keychain
        browsers: ["safari", "chrome", "firefox"]

      linux:
        systemStore: true    # Install to /usr/local/share/ca-certificates
        updateCa: true       # Run update-ca-certificates
        browsers: ["chrome", "firefox"]

      windows:
        certStore: true      # Install to Windows certificate store
        scope: "LocalMachine" # LocalMachine or CurrentUser
        browsers: ["chrome", "firefox", "edge"]

# Database Configuration
# ============================================================================
database:
  # PostgreSQL settings
  postgres:
    # Main application database
    app:
      database: "shopdb"
      username: "shop"
      password: "P@ssw0rd!2024#Shop"  # CHANGE IN PRODUCTION!

    # Keycloak database
    keycloak:
      database: "keycloak"
      username: "keycloak"
      password: "KeycloakDB@2024!SecurePassword"  # CHANGE IN PRODUCTION!

    # Admin user (for both databases)
    admin:
      username: "postgres"
      password: "PostgresAdm1n@2024!SecureDB"  # CHANGE IN PRODUCTION!

  # Connection pool settings
  pool:
    minIdle: 10
    maxPoolSize: 20
    connectionTimeout: 30000

# Kafka Configuration
# ============================================================================
kafka:
  enabled: true              # Set to false to disable Kafka
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"  # Base64 UUID for KRaft

  # Retention settings
  retention:
    hours: 168               # 7 days
    bytes: 1073741824        # 1GB

# MinIO Object Storage
# ============================================================================
minio:
  enabled: true              # Set to false to disable MinIO

  # Credentials (CHANGE IN PRODUCTION!)
  rootUser: "shopmanager"
  rootPassword: "Min1o!SecureK3y2024#"

  # Storage buckets
  buckets:
    - "receipts"
    - "reports"
    - "uploads"

# Business Rules & Settings
# ============================================================================
business:
  # Regional settings
  defaultCurrency: "NGN"
  defaultTaxRate: "0.075"    # 7.5%
  timezone: "UTC"
  locale: "en_US"

  # Business policies
  maxReturnDays: 30
  minReorderPoint: 10

  # Inventory management
  inventory:
    lowStockThreshold: 10
    expiryWarningDays: 30
    autoReorderEnabled: false
    stockCheckIntervalHours: 6

# Security Settings
# ============================================================================
security:
  # Multi-tenancy
  tenantIsolation: true

  # Session management
  sessionTimeoutMinutes: 30
  jwtExpirationHours: 24

  # Password policy
  password:
    minLength: 8
    requireUppercase: true
    requireLowercase: true
    requireNumbers: true
    requireSpecialChars: true

  # Account security
  maxLoginAttempts: 5
  accountLockDurationMinutes: 30

  # CORS settings
  cors:
    allowedOrigins: ""       # Auto-generated from domain if empty
    allowedMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
    allowedHeaders: "*"
    allowCredentials: "true"

# Feature Flags
# ============================================================================
features:
  investment: true           # Investment tracking module
  analytics: true            # Analytics dashboard
  fraud: false               # Fraud detection (coming soon)
  multiCurrency: false       # Multi-currency support
  barcodeScanning: true      # Barcode scanning
  loyaltyProgram: false      # Loyalty/rewards program

# Backup Configuration
# ============================================================================
backup:
  enabled: true

  # Backup schedule (cron format)
  schedule: "0 2 * * *"      # Daily at 2 AM

  # Retention policy
  retentionDays: 30

  # Backup location
  path: "./backups"

  # Compression
  compression: true
  compressionLevel: 6        # 1-9 (9 = best compression)

  # Encryption (recommended for production)
  encryption:
    enabled: false
    algorithm: "AES256"
    # Key will be auto-generated if not provided
    key: ""

# Monitoring & Logging
# ============================================================================
monitoring:
  # Health check endpoints
  health:
    enabled: true
    showDetails: "always"    # always, when-authorized, never

  # Prometheus metrics
  metrics:
    enabled: true

  # Logging levels
  logging:
    root: "INFO"
    app: "INFO"
    security: "INFO"
    web: "INFO"
    database: "WARN"

# Performance Tuning
# ============================================================================
performance:
  # Cache settings
  cache:
    defaultTtlMinutes: 60
    analyticsTtlHours: 1

  # Query optimization
  database:
    queryTimeoutSeconds: 30
    bulkBatchSize: 1000

  # Upload limits
  upload:
    maxFileSizeMb: 10
    allowedExtensions: "csv,xlsx,xls,pdf,jpg,jpeg,png"

# Advanced Settings
# ============================================================================
advanced:
  # Maintenance mode
  maintenanceMode: false

  # Debug mode (disable in production)
  debugMode: false

  # API documentation
  swagger:
    enabled: true
    securityEnabled: false   # Set to true in production

  # Scheduler configuration
  scheduler:
    profitDistribution:
      enabled: true
      monthlyDay: 1          # 1st of each month
      monthlyHour: 2         # 2 AM

    cacheCleanup:
      enabled: true
      intervalHours: 6

    auditCleanup:
      enabled: true
      intervalDays: 7
