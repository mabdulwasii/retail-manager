  # Realm configuration
  realm: "shop-manager"      # Keycloak realm name

  # Admin credentials (CHANGE THESE IN PRODUCTION!)
  admin:
    username: "admin"
    password: "Adm1n!SecureP@ss2024"
    email: "admin@shopmanager.local"

  # Session configuration
  session:
    ssoSessionIdleTimeout: 1800      # 30 minutes (in seconds)
    ssoSessionMaxLifespan: 43200     # 12 hours (in seconds)
    accessTokenLifespan: 300         # 5 minutes (in seconds)

  # Frontend client configuration
  client:
    clientId: "shop-manager-frontend"
    redirectUris:
      - "http://localhost:3001/*"
      - "https://localhost:3001/*"

