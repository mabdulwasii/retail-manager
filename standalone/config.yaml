# ============================================================================
# Shop Manager Standalone Configuration
# ============================================================================
#
# This file controls all aspects of your Shop Manager installation.
# It provides the same customization capabilities as the Kubernetes Helm chart
# but in a simpler format for Docker Compose deployments.
#
# For detailed documentation, see: docs/STANDALONE-CONFIG.md
#
# ============================================================================

# Global Application Settings
# ============================================================================
global:
  # Application name - used in URLs and service names
  # Example: "myshop" generates myshop.local, api.myshop.local, auth.myshop.local
  # Default: shop-manager
  appName: "shop-manager"

  # Your business domain (used for SSL certificates and URLs)
  # Examples:
  #   - "localhost" - Standard localhost with ports (http://localhost:3001)
  #   - "shop.local" - Custom domain with auto-generated subdomains (https://shop-manager.shop.local)
  #   - "myshop.local" - App-specific domain (https://myshop.local, https://api.myshop.local)
  # Recommendation: Use .local suffix for automatic mDNS discovery on LAN
  domain: "localhost"

  # Environment: development, staging, or production
  environment: "production"

  # Auto-Configuration Options
  # ============================================================================
  # These options automate URL generation, DNS, and certificate setup
  autoConfig:
    # Auto-generate URLs from appName and domain
    # When enabled:
    #   - localhost: Uses ports (http://localhost:3001, http://localhost:8081)
    #   - Custom domain: Uses subdomains (https://app.domain, https://api.app.domain)
    enabled: true

    # Auto-install SSL certificates to system trust store
    # Generates CA and domain certificates, installs to OS keychain/cert store
    # Requires administrator/sudo privileges
    autoInstallCertificates: true

    # Auto-configure DNS entries in /etc/hosts (or Windows hosts file)
    # Creates entries for frontend, API, and auth subdomains
    # Requires administrator/sudo privileges
    autoConfigureDns: true

    # Use mDNS for .local domains (macOS/Linux with Avahi)
    # Enables automatic discovery on local network
    # Only works with .local domain suffix
    useMdns: true

# Branding & Customization
# ============================================================================
branding:
  # Platform identity - what your users see
  platformName: "Shop Manager"
  companyName: "Your Company"
  platformDescription: "Retail Management Platform"

  # Visual identity
  logos:
    # Path to your logo files (relative to standalone/ directory)
    # Leave empty to use defaults
    primary: ""              # Main logo (SVG/PNG recommended, displayed in header)
    favicon: ""              # Browser favicon (ICO format, 32x32 or 64x64)
    loginLogo: ""            # Login page logo (can be different from primary)

  # Color scheme (hex color codes)
  colors:
    primary: "#1976d2"       # Primary brand color (buttons, links)
    secondary: "#dc004e"     # Secondary accent color
    success: "#388e3c"       # Success states (green)
    warning: "#f57c00"       # Warning states (orange)
    error: "#d32f2f"         # Error states (red)
    background: "#fafafa"    # Page background
    surface: "#ffffff"       # Card/panel background

  # Typography
  fonts:
    family: "Roboto, Arial, sans-serif"
    sizes:
      small: "12px"
      medium: "14px"
      large: "16px"
      title: "20px"

  # UI customization
  ui:
    showCompanyName: true
    showPoweredBy: false     # Hide "Powered by Shop Manager" footer
    customFooterText: ""     # Custom footer text

  # Email branding
  email:
    headerColor: "#1976d2"
    logoUrl: ""              # URL to logo for emails
    companyAddress: ""       # Physical address for email footer

