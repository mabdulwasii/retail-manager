<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Shop Manager Icon - Base SVG for icon generation -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="512" cy="512" r="480" fill="url(#grad1)"/>

  <!-- Shop/Store icon -->
  <g transform="translate(312, 312)">
    <!-- Building base -->
    <rect x="50" y="150" width="300" height="200" fill="white" opacity="0.95" rx="8"/>

    <!-- Roof -->
    <path d="M 30 150 L 200 80 L 370 150 Z" fill="white" opacity="0.95"/>

    <!-- Door -->
    <rect x="150" y="220" width="100" height="130" fill="#4F46E5" rx="4"/>

    <!-- Windows -->
    <rect x="70" y="180" width="60" height="60" fill="#7C3AED" rx="4"/>
    <rect x="270" y="180" width="60" height="60" fill="#7C3AED" rx="4"/>

    <!-- Shopping cart badge -->
    <circle cx="320" cy="120" r="60" fill="#10B981"/>
    <g transform="translate(280, 80)">
      <!-- Cart body -->
      <rect x="10" y="30" width="60" height="40" fill="white" rx="4"/>
      <!-- Cart wheels -->
      <circle cx="25" cy="75" r="8" fill="white"/>
      <circle cx="55" cy="75" r="8" fill="white"/>
      <!-- Cart handle -->
      <path d="M 70 25 L 75 10 L 15 10 L 10 30" stroke="white" stroke-width="4" fill="none"/>
    </g>
  </g>
</svg>
