name: PR Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Tests & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp .github/maven-settings.xml ~/.m2/settings.xml
          echo "✅ Maven settings configured with Google CDN mirror"

      - name: Configure TestContainers
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers/testcontainers.properties
          echo "testcontainers.ryuk.disabled=false" >> ~/.testcontainers/testcontainers.properties

      - name: Run unit tests with coverage
        run: |
          cd backend
          mvn clean test jacoco:report -s ../.github/maven-settings.xml -B -T 2C -Djava.net.preferIPv4Stack=true
          echo "✅ Unit tests completed"

      - name: Run integration tests with coverage
        run: |
          cd backend
          mvn verify -Pintegration-tests jacoco:report -s ../.github/maven-settings.xml -B -T 2C -Djava.net.preferIPv4Stack=true
          echo "✅ Integration tests completed"
          echo "ℹ️  Coverage files: target/jacoco.exec (unit), target/jacoco-it.exec (integration)"

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.BACKEND_SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ secrets.BACKEND_SONAR_ORGANIZATION }}
        run: |
          cd backend
          mvn sonar:sonar -s ../.github/maven-settings.xml \
            -Dsonar.projectKey=pribcely-organization_backend-retail-app \
            -Dsonar.moduleKey=backend \
            -Dsonar.organization=${{ secrets.BACKEND_SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.BACKEND_SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Djava.net.preferIPv4Stack=true
          echo "✅ SonarQube analysis completed"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: |
            backend/target/site/jacoco/
            backend/target/site/jacoco-it/
          retention-days: 30

  frontend-quality:
    name: Frontend Tests & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          echo "✅ Dependencies installed"

      - name: Run linting
        run: |
          cd frontend
          npm run lint || echo "⚠️ Lint warnings present but not blocking build"
          echo "✅ Linting completed"

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage
          echo "✅ Tests completed with coverage"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_FRONTEND_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=princely-org_retail-manager_frontend
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-reports
          path: frontend/coverage/
          retention-days: 30

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    if: false  # Temporarily disabled to save GitHub Actions minutes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
          echo "✅ Frontend dependencies installed"

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          echo "✅ Playwright browsers installed"

      - name: Build backend
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests -B
          echo "✅ Backend built successfully"

      - name: Start backend server
        run: |
          cd backend
          nohup ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "✅ Backend server started"

      - name: Wait for backend to be ready
        run: |
          echo "⏳ Waiting for backend to start..."
          for i in {1..60}; do
            if curl -s http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "❌ Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run E2E tests
        run: |
          cd frontend
          npm run test:e2e
          echo "✅ E2E tests completed"

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload E2E test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 7

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi

  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    needs: [backend-quality]
    if: false  # Temporarily disabled to save GitHub Actions minutes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
          echo "✅ k6 installed"

      - name: Build backend
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests -B
          echo "✅ Backend built successfully"

      - name: Start backend server
        run: |
          cd backend
          nohup ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "✅ Backend server started"

      - name: Wait for backend to be ready
        run: |
          echo "⏳ Waiting for backend to start..."
          for i in {1..60}; do
            if curl -s http://localhost:8081/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              exit 0
            fi
            echo "Waiting... ($i/60)"
            sleep 2
          done
          echo "❌ Backend failed to start"
          cat /tmp/backend.log
          exit 1

      - name: Run k6 load tests
        run: |
          cd k6-tests
          k6 run --vus 10 --duration 1m cloud-api-load-test.js
          echo "✅ Load tests completed"

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6-tests/*.json
          retention-days: 30

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi
