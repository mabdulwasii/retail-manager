name: PR Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-quality:
    name: Backend Tests & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configure TestContainers
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers/testcontainers.properties
          echo "testcontainers.ryuk.disabled=false" >> ~/.testcontainers/testcontainers.properties

      - name: Run unit tests with coverage
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean test jacoco:report -B
          echo "✅ Unit tests completed"

      - name: Run integration tests with coverage
        run: |
          cd backend
          ./mvnw verify -Pintegration-tests jacoco:report -B
          echo "✅ Integration tests completed"
          echo "ℹ️  Coverage files: target/jacoco.exec (unit), target/jacoco-it.exec (integration)"

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ secrets.BACKEND_SONAR_ORGANIZATION }}
        run: |
          cd backend
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=pribcely-organization_backend-retail-app \
            -Dsonar.moduleKey=backend \
            -Dsonar.organization=${{ secrets.BACKEND_SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
          echo "✅ SonarQube analysis completed"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-reports
          path: |
            backend/target/site/jacoco/
            backend/target/site/jacoco-it/
          retention-days: 30

  frontend-quality:
    name: Frontend Tests & SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          echo "✅ Dependencies installed"

      - name: Run linting
        run: |
          cd frontend
          npm run lint || echo "⚠️ Lint warnings present but not blocking build"
          echo "✅ Linting completed"

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:coverage
          echo "✅ Tests completed with coverage"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_FRONTEND_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=princely-org_retail-manager_frontend
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-reports
          path: frontend/coverage/
          retention-days: 30
