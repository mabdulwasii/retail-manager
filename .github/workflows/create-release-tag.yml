name: Create Release Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write  # Required to create and push tags

jobs:
  create-tag:
    name: Calculate Version and Create Tag
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:major'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true  # Keep credentials for push

      - name: Calculate next version
        id: version
        run: |
          # Get latest project-wide tag (v*.*.*) excluding module-specific tags
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v 'vbackend-v' | grep -v 'vfrontend-v' | head -1 || echo "v0.1.0")
          VERSION=${LATEST_TAG#v}

          echo "📌 Latest tag: $LATEST_TAG"
          echo "📌 Current version: $VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          echo "📊 Parsed - MAJOR: $MAJOR, MINOR: $MINOR, PATCH: $PATCH"

          # Bump version based on PR label
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"

          if [[ "$LABELS" == *"release:major"* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMP_TYPE="major"
          elif [[ "$LABELS" == *"release:minor"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP_TYPE="minor"
          else
            PATCH=$((PATCH + 1))
            BUMP_TYPE="patch"
          fi

          # Explicitly construct new version to preserve leading zeros
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "📈 Bump type: $BUMP_TYPE"
          echo "✅ New version: $NEW_VERSION"

          # Set outputs
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "⚠️  Tag $TAG already exists"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Tag $TAG does not exist, will create"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create annotated tag
          git tag -a "$TAG" -m "Release $TAG

          Triggered by PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}
          Bump type: ${{ steps.version.outputs.bump_type }}

          Merged by: @${{ github.event.pull_request.merged_by.login }}"

          # Push tag
          git push origin "$TAG"

          echo "✅ Created and pushed tag: $TAG"
          echo "🚀 This will trigger the standalone release workflow"

      - name: Tag already exists
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "❌ Tag ${{ steps.version.outputs.tag }} already exists"
          echo "❌ Cannot create duplicate release"
          echo "💡 If you need to recreate this release, delete the existing tag first:"
          echo "   git push origin :${{ steps.version.outputs.tag }}"
          exit 1
