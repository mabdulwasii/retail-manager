name: Auto-Release Standalone on PR Merge

# Automatically create standalone releases when PRs with release labels are merged
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  auto-release-standalone:
    name: Auto Release Standalone
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      # ================================================================
      # Step 1: Checkout Code
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version tracking
          token: ${{ secrets.GITHUB_TOKEN }}

      # ================================================================
      # Step 2: Detect Release Type from Labels
      # ================================================================
      - name: Detect standalone release label
        id: release-type
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          echo "Labels: $LABELS"

          # Initialize flags
          RELEASE_STANDALONE=false
          BUMP_TYPE=""

          # Check for standalone release labels
          if echo "$LABELS" | grep -q "release:standalone-patch"; then
            RELEASE_STANDALONE=true
            BUMP_TYPE="patch"
          elif echo "$LABELS" | grep -q "release:standalone-minor"; then
            RELEASE_STANDALONE=true
            BUMP_TYPE="minor"
          elif echo "$LABELS" | grep -q "release:standalone-major"; then
            RELEASE_STANDALONE=true
            BUMP_TYPE="major"
          fi

          echo "RELEASE_STANDALONE=$RELEASE_STANDALONE" >> $GITHUB_OUTPUT
          echo "BUMP_TYPE=$BUMP_TYPE" >> $GITHUB_OUTPUT

          echo "🔍 Standalone Release Detection:"
          echo "  Release: $RELEASE_STANDALONE"
          echo "  Bump Type: $BUMP_TYPE"

      # ================================================================
      # Step 3: Bump Version and Create Release
      # ================================================================
      - name: Bump version and create release
        if: steps.release-type.outputs.RELEASE_STANDALONE == 'true'
        id: standalone-release
        run: |
          # Read current version
          CURRENT_VERSION=$(cat standalone/VERSION)
          echo "Current standalone version: $CURRENT_VERSION"

          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump version based on type
          case "${{ steps.release-type.outputs.BUMP_TYPE }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New standalone version: $NEW_VERSION"

          # Update VERSION file
          echo "$NEW_VERSION" > standalone/VERSION

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Commit VERSION file
          git add standalone/VERSION
          git commit -m "chore(standalone): bump version to $NEW_VERSION"

          # Create tag (v prefix for standalone releases)
          TAG_NAME="v$NEW_VERSION"

          # Create multi-line tag message
          TAG_MESSAGE="Standalone v$NEW_VERSION

Auto-released via PR #${{ github.event.pull_request.number }}
PR Title: ${{ github.event.pull_request.title }}
Merged by: @${{ github.event.pull_request.merged_by.login }}

This release includes:
- Docker Compose packages (lightweight and full offline)
- Electron desktop apps for Windows, macOS, and Linux
- Auto-updater support for all platforms

See release notes for details."

          git tag -a "$TAG_NAME" -m "$TAG_MESSAGE"

          # Push changes and tag
          git push origin main
          git push origin "$TAG_NAME"

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT

          echo "✅ Version bumped to $NEW_VERSION"
          echo "✅ Tag $TAG_NAME created and pushed"
          echo "🚀 Build workflow will trigger automatically"

      # ================================================================
      # Step 4: Wait for Build Workflow to Trigger
      # ================================================================
      - name: Wait for build workflow
        if: steps.release-type.outputs.RELEASE_STANDALONE == 'true'
        run: |
          echo "⏳ Waiting 10 seconds for build workflow to start..."
          sleep 10

          echo "📋 Build workflow 'Build Standalone Release' should now be running"
          echo "Monitor progress: https://github.com/${{ github.repository }}/actions"

      # ================================================================
      # Step 5: Job Summary
      # ================================================================
      - name: Release summary
        if: steps.release-type.outputs.RELEASE_STANDALONE == 'true'
        run: |
          echo "## 🚀 Standalone Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**Merged by**: @${{ github.event.pull_request.merged_by.login }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.standalone-release.outputs.NEW_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.standalone-release.outputs.TAG_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ steps.release-type.outputs.BUMP_TYPE }} release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### What's Building" >> $GITHUB_STEP_SUMMARY
          echo "The following packages are being built automatically:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker Compose Package (lightweight ~50MB)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker Compose Package (full with images ~2GB)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows Installer (.exe)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows Portable (.exe)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS Installer (.dmg)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS Auto-update Package (.zip)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux AppImage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux Debian Package (.deb)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux RPM Package (.rpm)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. 🔄 Monitor build: [Actions](https://github.com/${{ github.repository }}/actions/workflows/build-standalone-release.yml)" >> $GITHUB_STEP_SUMMARY
          echo "2. 📦 Download packages: [Releases](https://github.com/${{ github.repository }}/releases/tag/${{ steps.standalone-release.outputs.TAG_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "3. 📝 Update release notes with changelog" >> $GITHUB_STEP_SUMMARY
          echo "4. 🔔 Notify users about the new release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: The release is created as a draft. Edit it to add release notes before publishing." >> $GITHUB_STEP_SUMMARY

  # Notify if no standalone release labels found
  no-standalone-release:
    name: No Standalone Release Needed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check for standalone release labels
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'

          if ! echo "$LABELS" | grep -q "release:standalone"; then
            echo "ℹ️ No standalone release labels found on this PR."
            echo ""
            echo "If you intended to create a standalone release, add one of these labels:"
            echo "  - release:standalone-patch  (Bug fixes, v1.0.0 → v1.0.1)"
            echo "  - release:standalone-minor  (New features, v1.0.0 → v1.1.0)"
            echo "  - release:standalone-major  (Breaking changes, v1.0.0 → v2.0.0)"
            echo ""
            echo "For backend/frontend releases, use:"
            echo "  - release:backend-[patch|minor|major]"
            echo "  - release:frontend-[patch|minor|major]"
            echo "  - release:both-[patch|minor|major]"
          fi
