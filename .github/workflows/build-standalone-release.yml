name: Build Standalone Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Shop Manager v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          body: |
            # Shop Manager v${{ steps.get_version.outputs.version }}

            ## 📦 Downloads

            Choose the package that best fits your needs:

            ### For Non-Technical Users (Recommended)
            - **Windows**: `Shop-Manager-Setup-${{ steps.get_version.outputs.version }}.exe`
            - **macOS**: `Shop-Manager-${{ steps.get_version.outputs.version }}.dmg`
            - **Linux**: `Shop-Manager-${{ steps.get_version.outputs.version }}.AppImage`

            ### For Technical Users / Developers
            - **Docker Compose (Online)**: `shop-manager-standalone-v${{ steps.get_version.outputs.version }}.zip`
            - **Docker Compose (Offline)**: `shop-manager-standalone-v${{ steps.get_version.outputs.version }}-full.zip`

            ## 🚀 Quick Start

            See [Installation Guide](https://github.com/${{ github.repository }}/blob/main/standalone/README.md)

            ## ✨ What's New

            - [Changelog will be added here]

            ## 📋 System Requirements

            - **OS**: Windows 10+, macOS 11+, Ubuntu 20.04+
            - **RAM**: 8 GB minimum
            - **Disk**: 20 GB free space
            - **Docker**: Required (Desktop or Engine)

            ## 📞 Support

            - [Documentation](https://github.com/${{ github.repository }}/tree/main/standalone/docs)
            - [Issues](https://github.com/${{ github.repository }}/issues)

  build-docker-compose-package:
    name: Build Docker Compose Package
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd standalone
          pip install -r requirements.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose build

      - name: Create lightweight package
        run: |
          cd standalone/scripts
          ./create-distribution.sh --version ${{ needs.create-release.outputs.version }} --skip-electron

      - name: Create full package (with images)
        run: |
          cd standalone/scripts
          ./create-distribution.sh --version ${{ needs.create-release.outputs.version }} --include-images --skip-electron

      - name: Upload Docker Compose packages
        run: |
          cd standalone/scripts/dist

          # Upload all ZIP packages
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Uploading $zip"
              gh release upload v${{ needs.create-release.outputs.version }} "$zip" --clobber
            fi
          done

          # Upload checksums
          for checksum in *.sha256 *.md5; do
            if [ -f "$checksum" ]; then
              echo "Uploading $checksum"
              gh release upload v${{ needs.create-release.outputs.version }} "$checksum" --clobber
            fi
          done

          # Upload release notes
          for notes in RELEASE_NOTES_*.md; do
            if [ -f "$notes" ]; then
              echo "Uploading $notes"
              gh release upload v${{ needs.create-release.outputs.version }} "$notes" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: standalone/electron-app/package-lock.json

      - name: Install dependencies
        run: |
          cd standalone/electron-app
          npm ci

      - name: Update version
        run: |
          cd standalone/electron-app
          npm version ${{ needs.create-release.outputs.version }} --no-git-tag-version

      - name: Build Windows installer
        run: |
          cd standalone/electron-app
          npm run build:win

      - name: List build artifacts
        run: |
          echo "Contents of dist directory:"
          dir standalone\electron-app\dist\

      - name: Upload Windows artifacts
        shell: bash
        run: |
          cd standalone/electron-app/dist

          # Upload all EXE files
          for exe in *.exe; do
            if [ -f "$exe" ]; then
              echo "Uploading $exe"
              gh release upload v${{ needs.create-release.outputs.version }} "$exe" --clobber
            fi
          done

          # Upload blockmap files
          for blockmap in *.blockmap; do
            if [ -f "$blockmap" ]; then
              echo "Uploading $blockmap"
              gh release upload v${{ needs.create-release.outputs.version }} "$blockmap" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd standalone/electron-app
          rm -rf node_modules package-lock.json
          npm install

      - name: Update version
        run: |
          cd standalone/electron-app
          npm version ${{ needs.create-release.outputs.version }} --no-git-tag-version

      - name: Build macOS installer
        run: |
          cd standalone/electron-app
          npm run build:mac
        env:
          DEBUG: electron-builder,electron-builder:*

      - name: List build artifacts
        run: |
          echo "Contents of dist directory:"
          ls -lh standalone/electron-app/dist/

      - name: Upload macOS artifacts
        run: |
          cd standalone/electron-app/dist

          # Upload all DMG files
          for dmg in *.dmg; do
            if [ -f "$dmg" ]; then
              echo "Uploading $dmg"
              gh release upload v${{ needs.create-release.outputs.version }} "$dmg" --clobber
            fi
          done

          # Upload all ZIP files
          for zip in *.zip; do
            if [ -f "$zip" ]; then
              echo "Uploading $zip"
              gh release upload v${{ needs.create-release.outputs.version }} "$zip" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-20.04
    needs: create-release
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: standalone/electron-app/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            file \
            rpm \
            libarchive-tools

      - name: Install dependencies
        run: |
          cd standalone/electron-app
          npm ci

      - name: Update app-builder to latest version
        run: |
          cd standalone/electron-app
          npm install app-builder-bin@latest --save-dev

      - name: Fix app-builder permissions and check
        run: |
          chmod +x standalone/electron-app/node_modules/app-builder-bin/linux/x64/app-builder || true
          echo "Checking app-builder binary:"
          file standalone/electron-app/node_modules/app-builder-bin/linux/x64/app-builder || true
          ldd standalone/electron-app/node_modules/app-builder-bin/linux/x64/app-builder || true

      - name: Update version
        run: |
          cd standalone/electron-app
          npm version ${{ needs.create-release.outputs.version }} --no-git-tag-version

      - name: Build Linux packages
        run: |
          cd standalone/electron-app
          npm run build:linux
        env:
          DEBUG: electron-builder

      - name: List build artifacts
        run: |
          echo "Contents of dist directory:"
          ls -lh standalone/electron-app/dist/

      - name: Upload Linux artifacts
        run: |
          cd standalone/electron-app/dist

          # Upload AppImage files
          for appimage in *.AppImage; do
            if [ -f "$appimage" ]; then
              echo "Uploading $appimage"
              gh release upload v${{ needs.create-release.outputs.version }} "$appimage" --clobber
            fi
          done

          # Upload DEB packages
          for deb in *.deb; do
            if [ -f "$deb" ]; then
              echo "Uploading $deb"
              gh release upload v${{ needs.create-release.outputs.version }} "$deb" --clobber
            fi
          done

          # Upload RPM packages
          for rpm in *.rpm; do
            if [ -f "$rpm" ]; then
              echo "Uploading $rpm"
              gh release upload v${{ needs.create-release.outputs.version }} "$rpm" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-docker-compose-package, build-windows, build-macos, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish release
        run: |
          gh release edit v${{ needs.create-release.outputs.version }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify success
        run: |
          echo "✅ Release v${{ needs.create-release.outputs.version }} published successfully!"
          echo "Download URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }}"
