name: Build Standalone Release

on:
  push:
    tags:
      - 'v*.*.*'  # Project-wide releases only (e.g., v0.1.27)
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write  # Required for creating releases and tags

jobs:
  # Step 1: Calculate version and create tag (only for PR merges)
  calculate-version:
    name: Calculate Version from PR
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
       contains(github.event.pull_request.labels.*.name, 'release:minor') ||
       contains(github.event.pull_request.labels.*.name, 'release:major'))

    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_create }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v 'vbackend-v' | grep -v 'vfrontend-v' | head -1 || echo "v0.1.0")
          VERSION=${LATEST_TAG#v}

          echo "📌 Latest tag: $LATEST_TAG"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          if [[ "$LABELS" == *"release:major"* ]]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [[ "$LABELS" == *"release:minor"* ]]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "✅ New version: $NEW_VERSION"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "⚠️  Tag $TAG already exists, skipping release"
            echo "should_create=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Tag $TAG does not exist, will create release"
            echo "should_create=true" >> $GITHUB_OUTPUT
          fi

  # Step 2: Build embedded JAR
  build-embedded-jar:
    name: Build Embedded JAR
    runs-on: ubuntu-latest
    needs: [calculate-version]
    if: |
      always() &&
      (needs.calculate-version.result == 'success' ||
       needs.calculate-version.result == 'skipped') &&
      (needs.calculate-version.outputs.should_release != 'false')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp .github/maven-settings.xml ~/.m2/settings.xml
          echo "✅ Maven settings configured with Google CDN mirror"

      - name: Get version
        id: get_version
        run: |
          # Version comes from: calculate-version job, tag, or manual input
          if [ "${{ needs.calculate-version.outputs.version }}" != "" ]; then
            VERSION="${{ needs.calculate-version.outputs.version }}"
            echo "📋 PR trigger - Version: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "📋 Manual trigger - Version: $VERSION"
          else
            # Extract version from tag (refs/tags/v1.2.3 → 1.2.3)
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "🏷️  Tag trigger - Version: $VERSION"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build embedded JAR
        run: |
          cd backend
          # Retry logic for Maven Central intermittent 403 errors
          for i in {1..3}; do
            echo "Build attempt $i of 3..."
            if mvn clean package -s ../.github/maven-settings.xml -Pembedded -DskipTests -Drevision=${{ steps.get_version.outputs.version }} -Djava.net.preferIPv4Stack=true; then
              echo "✅ Embedded JAR built successfully"
              # Verify JAR exists with correct name
              JAR_FILE="target/shop-manager-${{ steps.get_version.outputs.version }}-embedded.jar"
              if [ -f "$JAR_FILE" ]; then
                echo "✅ Verified JAR: $JAR_FILE"
                ls -lh "$JAR_FILE"
              else
                echo "❌ Expected JAR not found: $JAR_FILE"
                echo "Files in target:"
                ls -lh target/*.jar || echo "No JAR files found"
                exit 1
              fi
              break
            else
              if [ $i -lt 3 ]; then
                echo "Build failed, retrying in 30 seconds..."
                sleep 30
              else
                echo "❌ Build failed after 3 attempts"
                exit 1
              fi
            fi
          done

      - name: List JAR files before upload
        run: |
          echo "JAR files to upload:"
          ls -lh backend/target/*.jar

      - name: Upload embedded JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/shop-manager-*-embedded.jar
          retention-days: 7

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            # Get latest project-wide tag (v*.*.*) excluding module-specific tags (vbackend-v*, vfrontend-v*)
            LATEST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -v 'vbackend-v' | grep -v 'vfrontend-v' | head -1 || echo "v0.1.0")
            VERSION=${LATEST_TAG#v}

            echo "Latest tag: $LATEST_TAG"
            echo "Version string: $VERSION"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            echo "Parsed - MAJOR: $MAJOR, MINOR: $MINOR, PATCH: $PATCH"

            if [[ "${{ github.event.pull_request.labels.*.name }}" == *"release:major"* ]]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [[ "${{ github.event.pull_request.labels.*.name }}" == *"release:minor"* ]]; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            echo "After bump - MAJOR: $MAJOR, MINOR: $MINOR, PATCH: $PATCH"
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "New version: $NEW_VERSION"

            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Shop Manager v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          body: |
            # Shop Manager v${{ steps.get_version.outputs.version }}

            ## 📦 Downloads

            **Windows (64-bit)**:
            - `Shop Manager-Setup-${{ steps.get_version.outputs.version }}-Windows-x64.exe`

            **macOS (Intel & Apple Silicon)**:
            - `Shop Manager-${{ steps.get_version.outputs.version }}-macOS-x64.dmg` - Intel
            - `Shop Manager-${{ steps.get_version.outputs.version }}-macOS-arm64.dmg` - Apple Silicon

            **Docker Compose Lite (All Platforms)**:
            - `shop-manager-docker-lite-YYYYMMDD.tar.gz` - Lightweight Docker images with compose file

            **Embedded JAR**:
            - `shop-manager-${{ steps.get_version.outputs.version }}-embedded.jar` - Standalone JAR with embedded PostgreSQL

  # Build Docker Compose Lite Package
  build-docker-compose-lite:
    name: Build Docker Compose Lite
    runs-on: ubuntu-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend lite image
        run: |
          cd backend
          docker build -f Dockerfile.lite -t shop-manager-backend-lite:${{ needs.create-release.outputs.version }} .
          docker tag shop-manager-backend-lite:${{ needs.create-release.outputs.version }} shop-manager-backend-lite:latest

      - name: Build frontend lite image
        run: |
          cd frontend
          docker build -f Dockerfile.lite -t shop-manager-frontend-lite:${{ needs.create-release.outputs.version }} .
          docker tag shop-manager-frontend-lite:${{ needs.create-release.outputs.version }} shop-manager-frontend-lite:latest

      - name: Save Docker images
        run: |
          mkdir -p build/installers/docker-lite
          docker save shop-manager-backend-lite:${{ needs.create-release.outputs.version }} | gzip > build/installers/docker-lite/shop-manager-backend-lite-${{ needs.create-release.outputs.version }}.tar.gz
          docker save shop-manager-frontend-lite:${{ needs.create-release.outputs.version }} | gzip > build/installers/docker-lite/shop-manager-frontend-lite-${{ needs.create-release.outputs.version }}.tar.gz

      - name: Create Docker Lite package
        run: |
          cd build/installers/docker-lite
          cp ../../../docker-compose-lite.yml .
          cp ../../../.env.lite.template .
          cp ../../../lite-init.sh .
          cp -r ../../../docs .
          tar -czf shop-manager-docker-lite-${{ needs.create-release.outputs.version }}.tar.gz *

      - name: Upload Docker Lite package
        run: |
          cd build/installers/docker-lite
          for file in *.tar.gz; do
            if [ -f "$file" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$file" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Windows Native Installer (Inno Setup)
  build-windows-installer:
    name: Build Windows Native Installer (Inno Setup)
    runs-on: windows-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/

      - name: Verify JAR exists
        shell: bash
        run: |
          echo "Checking for JAR file..."
          ls -lh backend/target/
          JAR_FILE=$(find backend/target -name "shop-manager-*-embedded.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ ERROR: Embedded JAR not found in backend/target/"
            exit 1
          fi
          echo "✅ Found JAR: $JAR_FILE"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="${{ needs.create-release.outputs.version }}" /DJarVersion="${{ needs.create-release.outputs.version }}" installers\windows\shop-manager.iss

      - name: Upload Windows installer artifact
        shell: bash
        run: |
          cd build/installers/windows
          for exe in *.exe; do
            if [ -f "$exe" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$exe" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build macOS Native Installer (DMG)
  build-macos-installer:
    name: Build macOS Native Installer (DMG)
    runs-on: macos-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/

      - name: Verify JAR exists
        run: |
          echo "Checking for JAR file..."
          ls -lh backend/target/
          JAR_FILE=$(find backend/target -name "shop-manager-*-embedded.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ ERROR: Embedded JAR not found in backend/target/"
            exit 1
          fi
          echo "✅ Found JAR: $JAR_FILE"

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Build macOS DMG
        run: |
          cd installers/macos
          chmod +x build-dmg.sh
          ./build-dmg.sh
        env:
          TERM: xterm
          APP_VERSION: ${{ needs.create-release.outputs.version }}
          JAR_VERSION: ${{ needs.create-release.outputs.version }}

      - name: Upload macOS DMG artifact
        run: |
          cd build/installers/macos
          for dmg in *.dmg; do
            if [ -f "$dmg" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$dmg" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Linux Packages (.deb, .rpm, AppImage)
  build-linux-packages-native:
    name: Build Linux Packages (Native)
    runs-on: ubuntu-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/

      - name: Verify JAR exists
        run: |
          echo "Checking for JAR file..."
          ls -lh backend/target/
          JAR_FILE=$(find backend/target -name "shop-manager-*-embedded.jar" | head -1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ ERROR: Embedded JAR not found in backend/target/"
            exit 1
          fi
          echo "✅ Found JAR: $JAR_FILE"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg rpm

      - name: Build Linux packages
        run: |
          cd installers/linux
          chmod +x build-packages.sh
          ./build-packages.sh
        env:
          TERM: xterm
          APP_VERSION: ${{ needs.create-release.outputs.version }}
          JAR_VERSION: ${{ needs.create-release.outputs.version }}

      - name: Upload Linux packages
        run: |
          cd build/installers/linux
          for pkg in *.deb *.rpm *.tar.gz; do
            if [ -f "$pkg" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$pkg" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upload Embedded JAR
  upload-embedded-jar:
    name: Upload Embedded JAR to Release
    runs-on: ubuntu-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: ./artifacts

      - name: Upload embedded JAR to release
        run: |
          cd artifacts
          for jar in *.jar; do
            if [ -f "$jar" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$jar" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish Release
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-docker-compose-lite, build-windows-installer, build-macos-installer, build-linux-packages-native, upload-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish release
        run: gh release edit v${{ needs.create-release.outputs.version }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
