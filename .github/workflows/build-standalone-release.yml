name: Build Standalone Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  # Build embedded JAR (no quality checks to save GitHub Actions minutes)
  build-embedded-jar:
    name: Build Embedded JAR
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build embedded JAR
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean package -Pembedded -DskipTests
          echo "✅ Embedded JAR built successfully"

      - name: Upload embedded JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/shop-manager-*-embedded.jar
          retention-days: 7

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            if [[ "${{ github.event.pull_request.labels.*.name }}" == *"release:major"* ]]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [[ "${{ github.event.pull_request.labels.*.name }}" == *"release:minor"* ]]; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            echo "version=${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          release_name: Shop Manager v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          body: |
            # Shop Manager v${{ steps.get_version.outputs.version }}

            ## 📦 Downloads

            **Windows (64-bit)**:
            - `Shop Manager-Setup-${{ steps.get_version.outputs.version }}-Windows-x64.exe`

            **macOS (Intel & Apple Silicon)**:
            - `Shop Manager-${{ steps.get_version.outputs.version }}-macOS-x64.dmg` - Intel
            - `Shop Manager-${{ steps.get_version.outputs.version }}-macOS-arm64.dmg` - Apple Silicon

            **Docker Compose Lite (All Platforms)**:
            - `shop-manager-docker-lite-YYYYMMDD.tar.gz` - Lightweight Docker images with compose file

            **Embedded JAR**:
            - `shop-manager-${{ steps.get_version.outputs.version }}-embedded.jar` - Standalone JAR with H2 database

  # Build Docker Compose Lite Package
  build-docker-compose-lite:
    name: Build Docker Compose Lite
    runs-on: ubuntu-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend lite image
        run: |
          cd backend
          docker build -f Dockerfile.lite -t shop-manager-backend-lite:latest .

      - name: Build frontend lite image
        run: |
          cd frontend
          docker build -f Dockerfile.lite -t shop-manager-frontend-lite:latest .

      - name: Save Docker images
        run: |
          mkdir -p build/installers/docker-lite
          docker save shop-manager-backend-lite:latest | gzip > build/installers/docker-lite/shop-manager-backend-lite.tar.gz
          docker save shop-manager-frontend-lite:latest | gzip > build/installers/docker-lite/shop-manager-frontend-lite.tar.gz

      - name: Create Docker Lite package
        run: |
          cd build/installers/docker-lite
          cp ../../../docker-compose-lite.yml .
          cp ../../../.env.lite.template .
          cp ../../../lite-init.sh .
          cp -r ../../../docs .
          tar -czf shop-manager-docker-lite-$(date +%Y%m%d).tar.gz *

      - name: Upload Docker Lite package
        run: |
          cd build/installers/docker-lite
          for file in *.tar.gz; do
            if [ -f "$file" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$file" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Windows Native Installer (Inno Setup)
  build-windows-installer:
    name: Build Windows Native Installer (Inno Setup)
    runs-on: windows-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\windows\shop-manager.iss

      - name: Upload Windows installer artifact
        run: |
          cd build/installers/windows
          for exe in *.exe; do
            if [ -f "$exe" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$exe" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build macOS Native Installer (DMG)
  build-macos-installer:
    name: Build macOS Native Installer (DMG)
    runs-on: macos-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: backend/target/

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Build macOS DMG
        run: |
          cd installers/macos
          chmod +x build-dmg.sh
          ./build-dmg.sh
        env:
          TERM: xterm

      - name: Upload macOS DMG artifact
        run: |
          cd build/installers/macos
          for dmg in *.dmg; do
            if [ -f "$dmg" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$dmg" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Upload Embedded JAR
  upload-embedded-jar:
    name: Upload Embedded JAR to Release
    runs-on: ubuntu-latest
    needs: [create-release, build-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download embedded JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: embedded-jar
          path: ./artifacts

      - name: Upload embedded JAR to release
        run: |
          cd artifacts
          for jar in *.jar; do
            if [ -f "$jar" ]; then
              gh release upload v${{ needs.create-release.outputs.version }} "$jar" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish Release
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-docker-compose-lite, build-windows-installer, build-macos-installer, upload-embedded-jar]
    permissions:
      contents: write
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Publish release
        run: gh release edit v${{ needs.create-release.outputs.version }} --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
