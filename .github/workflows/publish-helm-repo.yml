name: Publish Helm Repository

# Publish Helm chart to GitHub Pages as a Helm repository
# This allows: helm repo add shopmanager https://yourorg.github.io/shop-manager

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Chart version to publish (e.g., 0.0.1)'
        required: true
        type: string

env:
  CHART_PATH: ./helm-chart/shop-manager

jobs:
  publish-helm-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to push to gh-pages branch
      pages: write
      id-token: write

    steps:
      # ================================================================
      # Step 1: Checkout Code
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for gh-pages

      # ================================================================
      # Step 2: Extract Version
      # ================================================================
      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.chart_version }}" >> $GITHUB_OUTPUT
          else
            # Remove 'v' prefix from tag (v0.0.1 -> 0.0.1)
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          fi
          echo "Publishing chart version: $VERSION"

      # ================================================================
      # Step 3: Configure Git
      # ================================================================
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ================================================================
      # Step 4: Update Chart.yaml Version
      # ================================================================
      - name: Update Chart.yaml version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Update chart version
          sed -i "s/^version:.*/version: $VERSION/" $CHART_PATH/Chart.yaml

          # Update app version
          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" $CHART_PATH/Chart.yaml

          echo "Updated Chart.yaml:"
          cat $CHART_PATH/Chart.yaml | grep -E "^version:|^appVersion:"

      # ================================================================
      # Step 5: Install Helm
      # ================================================================
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      # ================================================================
      # Step 6: Lint Helm Chart
      # ================================================================
      - name: Lint Helm chart
        run: |
          helm lint $CHART_PATH

      # ================================================================
      # Step 7: Package Helm Chart
      # ================================================================
      - name: Package Helm chart
        run: |
          mkdir -p .helm-repo
          helm package $CHART_PATH -d .helm-repo

          # List packaged chart
          ls -lh .helm-repo/

      # ================================================================
      # Step 8: Checkout gh-pages Branch
      # ================================================================
      - name: Checkout gh-pages branch
        run: |
          # Check if gh-pages branch exists
          if git ls-remote --heads origin gh-pages | grep gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            # Create orphan gh-pages branch
            git checkout --orphan gh-pages
            git rm -rf .
            echo "# Shop Manager Helm Repository" > README.md
            git add README.md
            git commit -m "Initial gh-pages commit"
          fi

      # ================================================================
      # Step 9: Copy Chart Package
      # ================================================================
      - name: Copy chart package to gh-pages
        run: |
          # Copy packaged chart from main branch
          git checkout main -- .helm-repo/
          mv .helm-repo/*.tgz .

          # List files
          ls -lh *.tgz

      # ================================================================
      # Step 10: Update Helm Repository Index
      # ================================================================
      - name: Update Helm repository index
        run: |
          # Generate or update index.yaml
          helm repo index . --url https://${{ github.repository_owner }}.github.io/shop-manager

          echo "Generated index.yaml:"
          cat index.yaml

      # ================================================================
      # Step 11: Commit and Push to gh-pages
      # ================================================================
      - name: Commit and push to gh-pages
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          git add *.tgz index.yaml
          git commit -m "Publish Helm chart version $VERSION" || echo "No changes to commit"
          git push origin gh-pages

      # ================================================================
      # Step 12: Create GitHub Release
      # ================================================================
      - name: Checkout main branch
        run: |
          git checkout main

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          files: .helm-repo/shop-manager-${{ steps.version.outputs.VERSION }}.tgz
          generate_release_notes: true
          body: |
            ## Helm Chart v${{ steps.version.outputs.VERSION }}

            ### Installation via Helm Repository

            ```bash
            # Add repository
            helm repo add shopmanager https://${{ github.repository_owner }}.github.io/shop-manager
            helm repo update

            # Install
            helm install retail shopmanager/shop-manager \
              --version ${{ steps.version.outputs.VERSION }} \
              -n gomco \
              --create-namespace \
              -f my-values.yaml
            ```

            ### Installation via OCI Registry (Docker Hub)

            ```bash
            helm install retail oci://registry-1.docker.io/princely/shop-manager \
              --version ${{ steps.version.outputs.VERSION }} \
              -n gomco \
              --create-namespace \
              -f my-values.yaml
            ```

            ### What's Included

            - Backend: `princely/shop-manager:backend-v${{ steps.version.outputs.VERSION }}`
            - Frontend: `princely/shop-manager:frontend-v0.0.9`
            - PostgreSQL: `postgres:16-alpine`
            - Keycloak: `quay.io/keycloak/keycloak:24.0.1`

            ### Documentation

            - [Customer Installation Guide](https://github.com/${{ github.repository }}/blob/main/CUSTOMER_INSTALL.md)
            - [Deployment Guide](https://github.com/${{ github.repository }}/blob/main/DEPLOYMENT_GUIDE.md)

            ### Support

            - Report issues: https://github.com/${{ github.repository }}/issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ================================================================
      # Step 13: Summary
      # ================================================================
      - name: Summary
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          echo "## 🎉 Helm Repository Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Chart Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Repository URL:** https://${{ github.repository_owner }}.github.io/shop-manager" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Add Repository" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm repo add shopmanager https://${{ github.repository_owner }}.github.io/shop-manager" >> $GITHUB_STEP_SUMMARY
          echo "helm repo update" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install Chart" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install retail shopmanager/shop-manager \\" >> $GITHUB_STEP_SUMMARY
          echo "  --version $VERSION \\" >> $GITHUB_STEP_SUMMARY
          echo "  -n gomco \\" >> $GITHUB_STEP_SUMMARY
          echo "  --create-namespace \\" >> $GITHUB_STEP_SUMMARY
          echo "  -f my-values.yaml" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY