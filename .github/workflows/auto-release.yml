name: Auto-Release on PR Merge

# Consolidated auto-release workflow for backend, frontend, standalone, and Helm
# Triggered by unified release labels: release:patch, release:minor, release:major
on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  auto-release:
    name: Auto Release All Components
    # Only run if PR is merged AND has unified release labels
    if: |
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      # ================================================================
      # Step 1: Checkout Code
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog
          token: ${{ secrets.PAT_WORKFLOW_TRIGGER }}

      # ================================================================
      # Step 2: Detect Release Type from Labels
      # ================================================================
      - name: Detect release type
        id: release-type
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          echo "Labels: $LABELS"

          # Detect bump type
          BUMP_TYPE=""

          if echo "$LABELS" | grep -q "release:patch"; then
            BUMP_TYPE="patch"
          elif echo "$LABELS" | grep -q "release:minor"; then
            BUMP_TYPE="minor"
          elif echo "$LABELS" | grep -q "release:major"; then
            BUMP_TYPE="major"
          fi

          echo "BUMP_TYPE=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "🔍 Release Type: $BUMP_TYPE"

      # ================================================================
      # Step 3: Bump Backend Version
      # ================================================================
      - name: Bump backend version
        id: backend-release
        run: |
          # Read current version
          CURRENT_VERSION=$(cat backend/VERSION)
          echo "Current backend version: $CURRENT_VERSION"

          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump version based on type
          case "${{ steps.release-type.outputs.BUMP_TYPE }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New backend version: $NEW_VERSION"

          # Update VERSION file
          echo "$NEW_VERSION" > backend/VERSION

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ================================================================
      # Step 4: Bump Frontend Version
      # ================================================================
      - name: Bump frontend version
        id: frontend-release
        run: |
          # Read current version
          CURRENT_VERSION=$(cat frontend/VERSION)
          echo "Current frontend version: $CURRENT_VERSION"

          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump version based on type
          case "${{ steps.release-type.outputs.BUMP_TYPE }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New frontend version: $NEW_VERSION"

          # Update VERSION file
          echo "$NEW_VERSION" > frontend/VERSION

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ================================================================
      # Step 5: Bump Standalone Version
      # ================================================================
      - name: Bump standalone version
        id: standalone-release
        run: |
          # Read current version
          CURRENT_VERSION=$(cat standalone/VERSION)
          echo "Current standalone version: $CURRENT_VERSION"

          # Parse version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump version based on type
          case "${{ steps.release-type.outputs.BUMP_TYPE }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New standalone version: $NEW_VERSION"

          # Update VERSION file
          echo "$NEW_VERSION" > standalone/VERSION

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      # ================================================================
      # Step 6: Commit Version Bumps
      # ================================================================
      - name: Commit version bumps
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add all VERSION files
          git add backend/VERSION frontend/VERSION standalone/VERSION

          # Create commit
          git commit -m "chore: bump versions to ${{ steps.backend-release.outputs.NEW_VERSION }} (${{ steps.release-type.outputs.BUMP_TYPE }})"

          # Push changes
          git push origin main

      # ================================================================
      # Step 7: Create Tags for All Components
      # ================================================================
      - name: Create release tags
        id: create-tags
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BACKEND_VERSION="${{ steps.backend-release.outputs.NEW_VERSION }}"
          FRONTEND_VERSION="${{ steps.frontend-release.outputs.NEW_VERSION }}"
          STANDALONE_VERSION="${{ steps.standalone-release.outputs.NEW_VERSION }}"

          # Create backend tag
          git tag -a "backend-v$BACKEND_VERSION" -m "Backend v$BACKEND_VERSION - Auto-released via PR #${{ github.event.pull_request.number }}"

          # Create frontend tag
          git tag -a "frontend-v$FRONTEND_VERSION" -m "Frontend v$FRONTEND_VERSION - Auto-released via PR #${{ github.event.pull_request.number }}"

          # Create standalone/helm tag (v prefix without component name)
          git tag -a "v$STANDALONE_VERSION" -m "Release v$STANDALONE_VERSION - Auto-released via PR #${{ github.event.pull_request.number }}"

          # Push all tags
          git push origin "backend-v$BACKEND_VERSION"
          git push origin "frontend-v$FRONTEND_VERSION"
          git push origin "v$STANDALONE_VERSION"

          echo "BACKEND_TAG=backend-v$BACKEND_VERSION" >> $GITHUB_OUTPUT
          echo "FRONTEND_TAG=frontend-v$FRONTEND_VERSION" >> $GITHUB_OUTPUT
          echo "STANDALONE_TAG=v$STANDALONE_VERSION" >> $GITHUB_OUTPUT

      # ================================================================
      # Step 8: Trigger Backend Build Workflow
      # ================================================================
      - name: Trigger backend build
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW_TRIGGER }}
        run: |
          echo "Triggering backend build workflow for version ${{ steps.backend-release.outputs.NEW_VERSION }}"
          gh workflow run build-backend.yml \
            --repo ${{ github.repository }} \
            --ref main \
            --field version="${{ steps.backend-release.outputs.NEW_VERSION }}" \
            --field push_latest=true

      # ================================================================
      # Step 9: Trigger Frontend Build Workflow
      # ================================================================
      - name: Trigger frontend build
        env:
          GH_TOKEN: ${{ secrets.PAT_WORKFLOW_TRIGGER }}
        run: |
          echo "Triggering frontend build workflow for version ${{ steps.frontend-release.outputs.NEW_VERSION }}"
          gh workflow run build-frontend.yml \
            --repo ${{ github.repository }} \
            --ref main \
            --field version="${{ steps.frontend-release.outputs.NEW_VERSION }}" \
            --field push_latest=true

      # ================================================================
      # Step 10: Job Summary
      # ================================================================
      - name: Job Summary
        run: |
          echo "## 🚀 Unified Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR**: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}" >> $GITHUB_STEP_SUMMARY
          echo "**Merged by**: @${{ github.event.pull_request.merged_by.login }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Type**: ${{ steps.release-type.outputs.BUMP_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Component Versions" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: ${{ steps.backend-release.outputs.NEW_VERSION }} (\`${{ steps.create-tags.outputs.BACKEND_TAG }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: ${{ steps.frontend-release.outputs.NEW_VERSION }} (\`${{ steps.create-tags.outputs.FRONTEND_TAG }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Standalone**: ${{ steps.standalone-release.outputs.NEW_VERSION }} (\`${{ steps.create-tags.outputs.STANDALONE_TAG }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Triggered Workflows" >> $GITHUB_STEP_SUMMARY
          echo "The following workflows have been automatically triggered:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Backend Build**: Builds and pushes Docker image to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Frontend Build**: Builds and pushes Docker image to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Helm Chart Publish**: Publishes Helm chart to Docker Hub OCI and GitHub Pages (triggered by \`${{ steps.create-tags.outputs.STANDALONE_TAG }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Standalone Build**: Builds all installers and creates GitHub Release (triggered by \`${{ steps.create-tags.outputs.STANDALONE_TAG }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Artifacts to be Published" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Images** (Docker Hub):" >> $GITHUB_STEP_SUMMARY
          echo "- \`princely/shop-manager:backend-v${{ steps.backend-release.outputs.NEW_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`princely/shop-manager:backend-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`princely/shop-manager:frontend-v${{ steps.frontend-release.outputs.NEW_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`princely/shop-manager:frontend-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Helm Chart** (Docker Hub OCI):" >> $GITHUB_STEP_SUMMARY
          echo "- \`oci://registry-1.docker.io/princely/shop-manager:${{ steps.standalone-release.outputs.NEW_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Standalone Installers** (GitHub Release):" >> $GITHUB_STEP_SUMMARY
          echo "- Windows Installer (.exe), Portable (.exe)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS Installer (.dmg), Auto-update (.zip)" >> $GITHUB_STEP_SUMMARY
          echo "- Linux AppImage, Debian (.deb), RPM (.rpm)" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Compose packages (lightweight, full)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. 🔄 [Monitor Workflows](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY
          echo "2. 🐳 [Verify Docker Images](https://hub.docker.com/r/princely/shop-manager/tags)" >> $GITHUB_STEP_SUMMARY
          echo "3. 📦 [Check GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${{ steps.create-tags.outputs.STANDALONE_TAG }})" >> $GITHUB_STEP_SUMMARY
          echo "4. 📝 Update release notes with changelog" >> $GITHUB_STEP_SUMMARY
          echo "5. 🔔 Notify users about the new release" >> $GITHUB_STEP_SUMMARY

  # Notify if no release labels found
  no-release:
    name: No Release Needed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check for release labels
        run: |
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'

          if ! echo "$LABELS" | grep -q "release:"; then
            echo "ℹ️ No release labels found on this PR."
            echo ""
            echo "If you intended to release, add a release label and re-run the workflow manually."
            echo ""
            echo "**Available Labels:**"
            echo "  - \`release:patch\`  (Bug fixes, v1.0.0 → v1.0.1)"
            echo "  - \`release:minor\`  (New features, v1.0.0 → v1.1.0)"
            echo "  - \`release:major\`  (Breaking changes, v1.0.0 → v2.0.0)"
            echo ""
            echo "This will release ALL components (backend, frontend, standalone, Helm) with the same version bump."
          fi
