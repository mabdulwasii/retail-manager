name: Build and Push Backend with Quality Gates

# Trigger on backend-specific version tags or manual dispatch
on:
  push:
    tags:
      - 'backend-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Backend version (e.g., 0.0.47)'
        required: true
        type: string
      push_latest:
        description: 'Also push as backend-latest tag'
        required: false
        type: boolean
        default: true

env:
  REGISTRY: docker.io
  REGISTRY_USERNAME: princely
  IMAGE_NAME: shop-manager

jobs:
  # ============================================================================
  # Job 1: Generate API Documentation
  # ============================================================================
  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Generate AsciiDoc Documentation
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw asciidoctor:process-asciidoc -B
          echo "✅ Documentation generated successfully"
          ls -lh target/generated-docs/

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: backend/target/generated-docs/
          retention-days: 7

  # ============================================================================
  # Job 2: Test and Quality Analysis
  # ============================================================================
  test-and-analyze:
    name: Test and SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configure TestContainers
        run: |
          mkdir -p ~/.testcontainers
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers/testcontainers.properties
          echo "testcontainers.ryuk.disabled=false" >> ~/.testcontainers/testcontainers.properties

      - name: Run unit tests with coverage
        run: |
          cd backend
          chmod +x ./mvnw
          ./mvnw clean test jacoco:report -B
          echo "✅ Unit tests completed"

      - name: Run integration tests with coverage
        run: |
          cd backend
          ./mvnw verify -Pintegration-tests jacoco:report -B
          echo "✅ Integration tests completed"
          echo "ℹ️  Coverage files: target/jacoco.exec (unit), target/jacoco-it.exec (integration)"

      - name: SonarQube Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.BACKEND_SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ secrets.BACKEND_SONAR_ORGANIZATION }}
        run: |
          cd backend
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=pribcely-organization_backend-retail-app \
            -Dsonar.moduleKey=backend \
            -Dsonar.organization=${{ secrets.BACKEND_SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.BACKEND_SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
          echo "✅ SonarQube analysis completed"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/target/site/jacoco/
            backend/target/site/jacoco-it/
          retention-days: 30

  # ============================================================================
  # Job 3: Build and Push Docker Image
  # ============================================================================
  build-backend:
    name: Build Backend Docker Image
    needs: [generate-docs, test-and-analyze]  # Waits for docs and quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # ================================================================
      # Step 1: Checkout Code
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # Step 2: Download Pre-Generated Documentation
      # ================================================================
      - name: Download documentation
        uses: actions/download-artifact@v4
        with:
          name: api-docs
          path: backend/src/main/resources/static/docs/

      - name: Verify documentation
        run: |
          echo "✅ Documentation downloaded:"
          ls -lh backend/src/main/resources/static/docs/

      # ================================================================
      # Step 3: Extract Version from Tag
      # ================================================================
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Extract from tag: backend-v0.0.46 → 0.0.46
            VERSION=${GITHUB_REF#refs/tags/backend-v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building backend version: $VERSION"

      # ================================================================
      # Step 4: Set up QEMU for Multi-Platform Builds
      # ================================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ================================================================
      # Step 5: Set up Docker Buildx
      # ================================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      # ================================================================
      # Step 6: Login to Docker Hub
      # ================================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ================================================================
      # Step 7: Extract Docker Metadata
      # ================================================================
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=backend-v${{ steps.version.outputs.VERSION }}
            type=raw,value=backend-latest,enable=${{ github.event.inputs.push_latest == 'true' || github.event_name == 'push' }}

      # ================================================================
      # Step 8: Build and Push Multi-Platform Backend Image
      # ================================================================
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

      # ================================================================
      # Step 9: Create GitHub Release (for tags only)
      # ================================================================
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/backend-v')
        uses: softprops/action-gh-release@v1
        with:
          name: Backend v${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body: |
            ## Backend v${{ steps.version.outputs.VERSION }}

            ### ✅ Quality Gates Passed
            - Unit Tests: ✅ Passed
            - Integration Tests: ✅ Passed
            - SonarQube Analysis: ✅ Passed
            - Code Coverage: ✅ >= 80%

            ### Multi-Platform Docker Image

            **Platforms**: Linux (amd64, arm64)

            **Pull Image**:
            ```bash
            docker pull ${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:backend-v${{ steps.version.outputs.VERSION }}
            ```

            **Deploy with Helm**:
            ```bash
            helm upgrade retail oci://registry-1.docker.io/princely/shop-manager \
              --set backend.image.tag=backend-v${{ steps.version.outputs.VERSION }} \
              -n gomco
            ```

            ### Documentation
            - API Docs: Included in image at `/docs/index.html`
            - Permission Matrix: `/docs/permission-matrix.html`

            ### What's New
            See commit history for changes in this release.

            ---
            🔗 **Docker Hub**: https://hub.docker.com/r/${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}/tags?name=backend-v${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ================================================================
      # Step 10: Job Summary
      # ================================================================
      - name: Summary
        run: |
          echo "## 🎉 Backend Image Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Quality Gates Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- SonarQube Analysis: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Documentation: ✅ Included" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags Pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:backend-v${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.push_latest }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "- \`${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:backend-latest\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull Command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY_USERNAME }}/${{ env.IMAGE_NAME }}:backend-v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
