# ============================================================================
# Shop Manager Frontend - SonarQube Configuration
# ============================================================================

# Project identification
sonar.projectKey=mabdulwasii_retail-manager
sonar.projectName=Retail Manager
sonar.projectVersion=0.0.10
# Organization will be provided via GitHub Actions secrets
# sonar.organization=${SONAR_ORGANIZATION}

# Source and test directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript/JavaScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results/sonar-report.xml

# Exclusions - Node modules, build outputs, config files
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/vite.config.ts,\
  **/vitest.config.ts,\
  **/*.d.ts,\
  **/vite-env.d.ts

# Test exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**

# Coverage exclusions - Config and type definition files
sonar.coverage.exclusions=\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.d.ts,\
  **/vite-env.d.ts,\
  **/main.tsx,\
  **/*.stories.tsx

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Analysis parameters
sonar.sourceEncoding=UTF-8

# TypeScript compiler settings
sonar.typescript.tsconfigPath=tsconfig.json

# Disable SCM provider (git) for faster analysis
sonar.scm.disabled=false
sonar.scm.provider=git

# Verbose logging for debugging (can be removed in production)
sonar.verbose=false
