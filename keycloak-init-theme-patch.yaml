spec:
  template:
    spec:
      initContainers:
      - name: theme-copier
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          mkdir -p /themes/shop-manager/login/resources/css
          cp /theme-source/theme.properties /themes/shop-manager/login/
          cp /theme-source/login.ftl /themes/shop-manager/login/
          cp /theme-source/shop-manager.css /themes/shop-manager/login/resources/css/
          ls -la /themes/shop-manager/login/
        volumeMounts:
        - name: theme-source
          mountPath: /theme-source
        - name: theme-target
          mountPath: /themes
      volumes:
      - name: theme-source
        configMap:
          name: shop-manager-keycloak-theme
      - name: theme-target
        emptyDir: {}
      containers:
      - name: keycloak
        volumeMounts:
        - name: theme-target
          mountPath: /opt/bitnami/keycloak/themes