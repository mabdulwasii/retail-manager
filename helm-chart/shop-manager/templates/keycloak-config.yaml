{{/*
Keycloak dynamic configuration override
This template ensures Keycloak references use dynamic naming
*/}}
{{- if .Values.keycloak.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop-manager.appName" . }}-keycloak-dynamic-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-config
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
data:
  # Dynamic database host for Keycloak
  keycloak-db-host: {{ include "shop-manager.keycloak.postgresql.host" . }}
  # Dynamic hostnames
  keycloak-hostname: {{ include "shop-manager.keycloak.hostname" . }}
  backend-hostname: {{ include "shop-manager.backend.hostname" . }}
  frontend-hostname: {{ include "shop-manager.frontend.hostname" . }}
{{- end }}