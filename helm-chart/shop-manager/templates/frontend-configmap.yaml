{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop-manager.fullname" . }}-frontend-config
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  config.js: |
    window.RUNTIME_CONFIG = {
      API_BASE_URL: "{{ include "shop-manager.frontend.apiBaseUrl" . }}",
      KEYCLOAK_URL: "{{ include "shop-manager.frontend.keycloakUrl" . }}",
      KEYCLOAK_REALM: "{{ include "shop-manager.keycloak.realmName" . }}",
      KEYCLOAK_CLIENT_ID: "{{ .Values.frontend.config.keycloakClientId | default (include "shop-manager.keycloak.frontendClientId" .) }}",
      APP_VERSION: "{{ .Chart.AppVersion | default "1.0.0" }}",
      APP_ENV: "{{ .Values.frontend.config.environment | default "production" }}"
    };
{{- end }}