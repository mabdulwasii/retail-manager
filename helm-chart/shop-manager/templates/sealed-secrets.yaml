# Sealed Secrets - Encrypted secrets that can be safely stored in Git
# Requires sealed-secrets controller: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# To create sealed secrets:
# 1. Create regular secret YAML
# 2. Use kubeseal to encrypt: echo -n mypassword | kubectl create secret generic mysecret --dry-run=client --from-file=password=/dev/stdin -o yaml | kubeseal -o yaml
# 3. Apply the sealed secret

{{- if .Values.sealedSecrets.enabled }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "shop-manager.fullname" . }}-sealed-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: sealed-secrets
spec:
  # Encrypted secrets - replace with actual sealed secret values
  # These are example placeholders - in production, use kubeseal to generate
  encryptedData:
    # Database passwords (sealed)
    postgres-admin-password: {{ .Values.sealedSecrets.database.postgresPassword | default "AgAExample..." | quote }}
    postgres-shop-password: {{ .Values.sealedSecrets.database.shopPassword | default "AgAExample..." | quote }}
    postgres-keycloak-password: {{ .Values.sealedSecrets.database.keycloakPassword | default "AgAExample..." | quote }}

    # Keycloak admin credentials (sealed)
    keycloak-admin-password: {{ .Values.sealedSecrets.keycloak.adminPassword | default "AgAExample..." | quote }}
    keycloak-frontend-secret: {{ .Values.sealedSecrets.keycloak.frontendClientSecret | default "AgAExample..." | quote }}
    keycloak-backend-secret: {{ .Values.sealedSecrets.keycloak.backendClientSecret | default "AgAExample..." | quote }}

    # MinIO credentials (sealed)
    minio-root-password: {{ .Values.sealedSecrets.minio.rootPassword | default "AgAExample..." | quote }}

    # Application security keys (sealed)
    jwt-secret: {{ .Values.sealedSecrets.security.jwtSecret | default "AgAExample..." | quote }}
    encryption-key: {{ .Values.sealedSecrets.security.encryptionKey | default "AgAExample..." | quote }}
    swagger-password: {{ .Values.sealedSecrets.security.swaggerPassword | default "AgAExample..." | quote }}

  template:
    metadata:
      name: {{ include "shop-manager.fullname" . }}-sealed-secrets
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "shop-manager.labels" . | nindent 8 }}
        app.kubernetes.io/component: sealed-secrets
    type: Opaque
{{- end }}

---
# Instructions for creating sealed secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop-manager.fullname" . }}-sealed-secrets-instructions
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: sealed-secrets-instructions
data:
  README.md: |
    # Sealed Secrets Setup Instructions

    ## Prerequisites
    Install the Sealed Secrets controller:
    ```bash
    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
    ```

    ## Creating Sealed Secrets

    ### 1. Install kubeseal CLI
    ```bash
    # macOS
    brew install kubeseal

    # Linux
    wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/kubeseal-0.24.0-linux-amd64.tar.gz
    tar -xvzf kubeseal-0.24.0-linux-amd64.tar.gz
    sudo install -m 755 kubeseal /usr/local/bin/kubeseal
    ```

    ### 2. Generate sealed secrets for production
    ```bash
    # Database passwords
    echo -n "your-secure-postgres-password" | kubectl create secret generic temp-secret --dry-run=client --from-file=postgres-admin-password=/dev/stdin -o yaml | kubeseal -o yaml > postgres-sealed.yaml

    # Keycloak passwords
    echo -n "your-secure-keycloak-password" | kubectl create secret generic temp-secret --dry-run=client --from-file=keycloak-admin-password=/dev/stdin -o yaml | kubeseal -o yaml > keycloak-sealed.yaml

    # Application secrets
    echo -n "your-jwt-secret-key" | kubectl create secret generic temp-secret --dry-run=client --from-file=jwt-secret=/dev/stdin -o yaml | kubeseal -o yaml > app-sealed.yaml
    ```

    ### 3. Update values.yaml
    Enable sealed secrets and provide the encrypted values:
    ```yaml
    sealedSecrets:
      enabled: true
      database:
        postgresPassword: "AgA..." # Copy from kubeseal output
        shopPassword: "AgA..."
        keycloakPassword: "AgA..."
      keycloak:
        adminPassword: "AgA..."
        frontendClientSecret: "AgA..."
        backendClientSecret: "AgA..."
      minio:
        rootPassword: "AgA..."
      security:
        jwtSecret: "AgA..."
        encryptionKey: "AgA..."
        swaggerPassword: "AgA..."
    ```

    ## Benefits of Sealed Secrets

    - **Git Safe**: Sealed secrets can be safely stored in Git repositories
    - **Asymmetric Encryption**: Only the cluster can decrypt the secrets
    - **Namespace Scoped**: Secrets are scoped to specific namespaces
    - **Automated Decryption**: Controller automatically decrypts and creates regular secrets
    - **Backup Friendly**: Sealed secrets can be backed up and restored

    ## Security Best Practices

    1. **Rotate Secrets Regularly**: Generate new sealed secrets quarterly
    2. **Use Strong Passwords**: Minimum 16 characters with mixed case, numbers, symbols
    3. **Separate by Environment**: Different sealed secrets for dev/staging/production
    4. **Monitor Access**: Track who has access to seal/unseal operations
    5. **Backup Master Key**: Securely backup the sealed-secrets master key

    ## Production Deployment

    For production, always use sealed secrets instead of regular secrets:
    ```bash
    helm install shop-manager ./helm-chart/shop-manager \
      --set sealedSecrets.enabled=true \
      --set secrets.enabled=false \
      -n production
    ```