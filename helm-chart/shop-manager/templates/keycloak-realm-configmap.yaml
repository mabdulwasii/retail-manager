  setup-realm.sh: |
    #!/bin/bash
    set -e

    echo "Starting Keycloak realm configuration..."

    # Wait for Keycloak to be ready
    until curl -f -s http://{{ include "shop-manager.fullname" . }}-keycloak:80/health/ready; do
        echo "Waiting for Keycloak to be ready..."
        sleep 10
    done

    echo "Keycloak is ready. Configuring realm..."

    # Get admin access token
    ADMIN_TOKEN=$(curl -s -X POST "http://{{ include "shop-manager.fullname" . }}-keycloak:80/realms/master/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=admin" \
        -d "password=${KEYCLOAK_ADMIN_PASSWORD}" \
        -d "grant_type=password" \
        -d "client_id=admin-cli" | jq -r '.access_token')

    if [ "$ADMIN_TOKEN" == "null" ] || [ -z "$ADMIN_TOKEN" ]; then
        echo "Failed to get admin token"
        exit 1
    fi

    echo "Got admin token successfully"

    # Check if {{ include "shop-manager.keycloak.realmName" . }} realm already exists
    REALM_EXISTS=$(curl -s -H "Authorization: Bearer $ADMIN_TOKEN" \
        "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/{{ include "shop-manager.keycloak.realmName" . }}" \
        -w "%{http_code}" -o /dev/null)

    if [ "$REALM_EXISTS" = "200" ]; then
        echo "Realm 'shop-manager' already exists, skipping creation"
    else
        echo "Creating {{ include "shop-manager.keycloak.realmName" . }} realm..."

        # Create the realm from JSON
        curl -s -X POST "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/config/shop-manager-realm.json

        if [ $? -eq 0 ]; then
            echo "✓ Shop Manager realm created successfully"
        else
            echo "✗ Failed to create realm"
            exit 1
        fi
    fi

    # Set custom theme for the realm (uses appName dynamically)
    echo "Configuring custom theme for realm..."
    THEME_NAME="{{ include "shop-manager.appName" . }}"

    curl -s -X PUT "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/{{ include "shop-manager.keycloak.realmName" . }}" \
        -H "Authorization: Bearer $ADMIN_TOKEN" \
        -H "Content-Type: application/json" \
        -d "{\"loginTheme\": \"$THEME_NAME\", \"accountTheme\": \"$THEME_NAME\", \"emailTheme\": \"$THEME_NAME\"}"

    if [ $? -eq 0 ]; then
        echo "✓ Custom theme '$THEME_NAME' applied to realm"
    else
        echo "⚠ Warning: Failed to apply custom theme (may not exist yet)"
    fi

    # Create Superadmin user (ALWAYS - required for system management)
    echo "Creating superadmin user..."
    SUPERADMIN_EXISTS=$(curl -s -H "Authorization: Bearer $ADMIN_TOKEN" \
        "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/{{ include "shop-manager.keycloak.realmName" . }}/users?username=superadmin&exact=true" \
        | jq -r 'length')

    if [ "$SUPERADMIN_EXISTS" = "0" ]; then
        SUPERADMIN_PAYLOAD=$(cat <<'EOF'
    {
      "username": "superadmin",
      "email": "superadmin@shopmanager.local",
      "firstName": "Super",
      "lastName": "Admin",
      "enabled": true,
      "emailVerified": true,
      "credentials": [{"type": "password", "value": "changeme", "temporary": false}],
      "realmRoles": ["SYSTEM_ADMIN"],
      "attributes": {"role": ["SYSTEM_ADMIN"]}
    }
    EOF
        )

        curl -s -X POST "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/{{ include "shop-manager.keycloak.realmName" . }}/users" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$SUPERADMIN_PAYLOAD"

        if [ $? -eq 0 ]; then
            echo "✓ Superadmin user created: superadmin / changeme"
        else
            echo "✗ Failed to create superadmin user"
        fi
    else
        echo "✓ Superadmin user already exists"
    fi

    # Create test users from JSON (CONDITIONAL - only if TEST_USERS_ENABLED=true)
    if [ "$TEST_USERS_ENABLED" = "true" ]; then
        echo "Creating test users from keycloak-users.json..."

        # Read users from JSON and create them
        USERS_COUNT=$(jq 'length' /config/keycloak-users.json)
        echo "Found $USERS_COUNT test users to create"

        for i in $(seq 0 $(($USERS_COUNT - 1))); do
            USERNAME=$(jq -r ".[$i].username" /config/keycloak-users.json)
            EMAIL=$(jq -r ".[$i].email" /config/keycloak-users.json)

            # Check if user already exists
            USER_EXISTS=$(curl -s -H "Authorization: Bearer $ADMIN_TOKEN" \
                "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/{{ include "shop-manager.keycloak.realmName" . }}/users?username=$USERNAME&exact=true" \
                | jq -r 'length')

            if [ "$USER_EXISTS" = "0" ]; then
                # Get user payload from JSON
                USER_PAYLOAD=$(jq ".[$i]" /config/keycloak-users.json)

                # Create user
                curl -s -X POST "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/{{ include "shop-manager.keycloak.realmName" . }}/users" \
                    -H "Authorization: Bearer $ADMIN_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "$USER_PAYLOAD"

                if [ $? -eq 0 ]; then
                    PASSWORD=$(jq -r ".[$i].credentials[0].value" /config/keycloak-users.json)
                    ROLE=$(jq -r ".[$i].realmRoles[0]" /config/keycloak-users.json)
                    echo "✓ Created user: $EMAIL / $PASSWORD ($ROLE)"
                else
                    echo "✗ Failed to create user: $EMAIL"
                fi
            else
                echo "✓ User $USERNAME already exists"
            fi
        done

        echo "✓ Test users creation completed"
    else
        echo "⚠ Test users are DISABLED (testUsers.enabled=false)"
        echo "  You need to create users manually in Keycloak"
    fi

    # Verify realm is accessible
    REALM_CHECK=$(curl -s "http://{{ include "shop-manager.fullname" . }}-keycloak:80/realms/{{ include "shop-manager.keycloak.realmName" . }}/.well-known/openid-configuration" | jq -r '.issuer')

    if [[ "$REALM_CHECK" == *"shop-manager"* ]]; then
        echo "✓ Realm configuration completed successfully"
    else
        echo "✗ Realm verification failed"
        exit 1
    fi

    echo "Keycloak realm configuration completed!"
{{- end }}