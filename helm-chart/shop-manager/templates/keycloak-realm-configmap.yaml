  setup-realm.sh: |
    #!/bin/bash
    set -e

    echo "Starting Keycloak realm configuration..."

    # Wait for Keycloak to be ready
    until curl -f -s http://shop-manager-keycloak:8080/health/ready; do
        echo "Waiting for Keycloak to be ready..."
        sleep 10
    done

    echo "Keycloak is ready. Configuring realm..."

    # Get admin access token
    ADMIN_TOKEN=$(curl -s -X POST "http://shop-manager-keycloak:8080/realms/master/protocol/openid-connect/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        -d "username=admin" \
        -d "password=${KEYCLOAK_ADMIN_PASSWORD}" \
        -d "grant_type=password" \
        -d "client_id=admin-cli" | jq -r '.access_token')

    if [ "$ADMIN_TOKEN" == "null" ] || [ -z "$ADMIN_TOKEN" ]; then
        echo "Failed to get admin token"
        exit 1
    fi

    echo "Got admin token successfully"

    # Check if shop-manager realm already exists
    REALM_EXISTS=$(curl -s -H "Authorization: Bearer $ADMIN_TOKEN" \
        "http://shop-manager-keycloak:8080/admin/realms/shop-manager" \
        -w "%{http_code}" -o /dev/null)

    if [ "$REALM_EXISTS" = "200" ]; then
        echo "Realm 'shop-manager' already exists, skipping creation"
    else
        echo "Creating shop-manager realm..."

        # Create the realm from JSON
        curl -s -X POST "http://shop-manager-keycloak:8080/admin/realms" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d @/config/shop-manager-realm.json

        if [ $? -eq 0 ]; then
            echo "✓ Shop Manager realm created successfully"
        else
            echo "✗ Failed to create realm"
            exit 1
        fi
    fi

    # Verify realm is accessible
    REALM_CHECK=$(curl -s "http://shop-manager-keycloak:8080/realms/shop-manager/.well-known/openid-configuration" | jq -r '.issuer')

    if [[ "$REALM_CHECK" == *"shop-manager"* ]]; then
        echo "✓ Realm configuration completed successfully"
        echo "✓ Test users created with credentials:"
        echo "  - admin@shopmanager.com / DevAdmin@2024!Test (TENANT_ADMIN)"
        echo "  - manager@shopmanager.com / DevManager@2024!Test (SHOP_MANAGER)"
        echo "  - employee@shopmanager.com / DevEmployee@2024!Test (SHOP_EMPLOYEE)"
        echo "  - investor@shopmanager.com / DevInvestor@2024!Test (INVESTOR)"
        echo "  - customer@shopmanager.com / DevCustomer@2024!Test (CUSTOMER)"
        echo "  - cashier@shopmanager.com / DevCashier@2024!Test (CASHIER)"
        echo "  - accountant@shopmanager.com / DevAccountant@2024!Test (ACCOUNTANT)"
        echo "  - auditor@shopmanager.com / DevAuditor@2024!Test (AUDITOR)"
    else
        echo "✗ Realm verification failed"
        exit 1
    fi

    echo "Keycloak realm configuration completed!"
