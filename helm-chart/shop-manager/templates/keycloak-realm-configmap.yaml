{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop-manager.fullname" . }}-keycloak-realm-config
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-config
data:
  shop-manager-realm.json: |
    {
      "realm": "{{ include "shop-manager.keycloak.realmName" . }}",
      "enabled": true,
      "displayName": "Shop Manager",
      "displayNameHtml": "<div class=\"kc-logo-text\"><span>Shop Manager</span></div>",
      "registrationAllowed": false,
      "registrationEmailAsUsername": false,
      "rememberMe": true,
      "verifyEmail": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "permanentLockout": false,
      "maxFailureWaitSeconds": 900,
      "minimumQuickLoginWaitSeconds": 60,
      "waitIncrementSeconds": 60,
      "quickLoginCheckMilliSeconds": 1000,
      "maxDeltaTimeSeconds": 43200,
      "failureFactor": 30,
      "defaultRoles": ["offline_access", "uma_authorization"],
      "requiredCredentials": ["password"],
      "passwordPolicy": "length(8) and digits(1) and lowerCase(1) and upperCase(1) and specialChars(1) and notUsername",
      "otpPolicyType": "totp",
      "otpPolicyAlgorithm": "HmacSHA1",
      "otpPolicyInitialCounter": 0,
      "otpPolicyDigits": 6,
      "otpPolicyLookAheadWindow": 1,
      "otpPolicyPeriod": 30,
      "accessTokenLifespan": 300,
      "accessTokenLifespanForImplicitFlow": 300,
      "ssoSessionIdleTimeout": 1800,
      "ssoSessionMaxLifespan": 43200,
      "loginTheme": "retail",
      "accountTheme": "retail",
      "emailTheme": "retail",
      "ssoSessionIdleTimeoutRememberMe": 0,
      "ssoSessionMaxLifespanRememberMe": 0,
      "offlineSessionIdleTimeout": 2592000,
      "offlineSessionMaxLifespanEnabled": false,
      "offlineSessionMaxLifespan": 5184000,
      "accessCodeLifespan": 60,
      "accessCodeLifespanUserAction": 300,
      "accessCodeLifespanLogin": 1800,
      "actionTokenGeneratedByAdminLifespan": 43200,
      "actionTokenGeneratedByUserLifespan": 300,
      "enabled": true,
      "sslRequired": "external",
      "clients": [
        {
          "clientId": "{{ include "shop-manager.keycloak.frontendClientId" . }}",
          "name": "Shop Manager Frontend",
          "description": "Shop Manager React Frontend Application",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "{{ include "shop-manager.keycloak.frontendClientSecret" . }}",
          "redirectUris": [
            "https://{{ include "shop-manager.frontend.hostname" . }}/*",
            "http://localhost:3000/*",
            "http://localhost:3001/*",
            "http://localhost:3002/*"
          ],
          "webOrigins": [
            "https://{{ include "shop-manager.frontend.hostname" . }}",
            "http://localhost:3000",
            "http://localhost:3001",
            "http://localhost:3002"
          ],
          "publicClient": true,
          "protocol": "openid-connect",
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": true,
          "nodeReRegistrationTimeout": -1,
          "defaultClientScopes": [
            "web-origins",
            "role_list",
            "profile",
            "roles",
            "email"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access",
            "microprofile-jwt"
          ],
          "protocolMappers": [
            {
              "name": "sub-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "id.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "tenant-id-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "tenantId",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "tenant_id",
                "jsonType.label": "String",
                "multivalued": "false"
              }
            },
            {
              "name": "shop-id-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "shopId",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "shop_id",
                "jsonType.label": "String",
                "multivalued": "false"
              }
            }
          ]
        },
        {
          "clientId": "{{ include "shop-manager.keycloak.backendClientId" . }}",
          "name": "Shop Manager Backend",
          "description": "Shop Manager Spring Boot Backend Application",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "{{ include "shop-manager.keycloak.backendClientSecret" . }}",
          "publicClient": false,
          "protocol": "openid-connect",
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "authorizationServicesEnabled": false,
          "fullScopeAllowed": true,
          "bearerOnly": true
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "SYSTEM_ADMIN",
            "description": "System administrator with full access to all tenants",
            "composite": false
          },
          {
            "name": "TENANT_ADMIN",
            "description": "Full administrative access to tenant",
