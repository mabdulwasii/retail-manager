{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-manager.fullname" . }}-frontend
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "shop-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "shop-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default "latest" }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: {{ .Values.frontend.service.targetPort | default 3000 }}
          protocol: TCP
        env:
        - name: VITE_API_BASE_URL
          value: {{ include "shop-manager.frontend.apiBaseUrl" . | quote }}
        - name: VITE_KEYCLOAK_URL
          value: {{ include "shop-manager.frontend.keycloakUrl" . | quote }}
        - name: VITE_KEYCLOAK_REALM
          value: {{ include "shop-manager.keycloak.realmName" . | quote }}
        - name: VITE_KEYCLOAK_CLIENT_ID
          value: {{ .Values.frontend.config.keycloakClientId | default (include "shop-manager.keycloak.frontendClientId" .) | quote }}
        - name: VITE_APP_VERSION
          value: {{ .Chart.AppVersion | quote }}
        - name: VITE_APP_ENV
          value: {{ .Values.frontend.config.environment | default "production" | quote }}
        # Vite/React Debug Logging Configuration
        - name: VITE_LOG_LEVEL
          value: {{ .Values.frontend.config.logging.level | default "info" | quote }}
        - name: DEBUG
          value: {{ if .Values.frontend.config.logging.debugMode }}"vite:*,shop-manager:*"{{ else }}""{{ end }}
        - name: NODE_ENV
          value: {{ if .Values.frontend.config.logging.debugMode }}"development"{{ else }}"production"{{ end }}
        {{- if .Values.frontend.extraEnvVars }}
        {{- toYaml .Values.frontend.extraEnvVars | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
        volumeMounts:
        - name: frontend-config
          mountPath: /usr/share/nginx/html/config.js
          subPath: config.js
      volumes:
      - name: frontend-config
        configMap:
          name: {{ include "shop-manager.fullname" . }}-frontend-config
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}