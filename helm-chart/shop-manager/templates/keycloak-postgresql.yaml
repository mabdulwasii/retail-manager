{{- if .Values.keycloakPostgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-postgresql-secret
type: Opaque
data:
  postgres-password: {{ .Values.keycloakPostgresql.auth.postgresPassword | b64enc | quote }}
  password: {{ .Values.keycloakPostgresql.auth.password | b64enc | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-postgresql
spec:
  replicas: 1
  serviceName: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}-hl
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
    spec:
      containers:
      - name: postgresql
        image: docker.io/bitnami/postgresql:15.4.0-debian-11-r45
        ports:
        - containerPort: 5432
          name: tcp-postgresql
        env:
        - name: BITNAMI_DEBUG
          value: "false"
        - name: POSTGRESQL_PORT_NUMBER
          value: "5432"
        - name: POSTGRESQL_VOLUME_DIR
          value: "/bitnami/postgresql"
        - name: PGDATA
          value: "/bitnami/postgresql/data"
        - name: POSTGRES_USER
          value: {{ .Values.keycloakPostgresql.auth.username | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
              key: password
        - name: POSTGRES_POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
              key: postgres-password
        - name: POSTGRES_DATABASE
          value: {{ .Values.keycloakPostgresql.auth.database | quote }}
        volumeMounts:
        - name: data
          mountPath: /bitnami/postgresql
        resources:
          {{- toYaml .Values.keycloakPostgresql.primary.resources | nindent 10 }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.keycloakPostgresql.primary.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-postgresql
spec:
  type: ClusterIP
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}-hl
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-postgresql-headless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: tcp-postgresql
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Values.keycloakPostgresql.fullnameOverride | default (printf "%s-keycloak-postgresql" (include "shop-manager.fullname" .)) }}
{{- end }}