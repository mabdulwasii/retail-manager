{{- if and .Values.keycloak.enabled .Values.keycloak.customTheme.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shop-manager.fullname" . }}-keycloak-theme-init
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-theme-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "shop-manager.fullname" . }}-keycloak-theme-init
      labels:
        {{- include "shop-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-theme-init
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-keycloak
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          echo "Waiting for Keycloak to be ready..."
          until wget -q --spider http://{{ include "shop-manager.fullname" . }}-keycloak:8080/realms/master; do
            echo "Keycloak not ready, waiting..."
            sleep 10
          done
          echo "Keycloak is ready!"
      containers:
      - name: theme-installer
        image: bitnami/kubectl:latest
        command:
        - sh
        - -c
        - |
          set -e
          echo "🎨 Installing Shop Manager Custom Keycloak Theme"

          # Apply the StatefulSet patch to include theme volumes
          echo "📝 Patching Keycloak StatefulSet for theme support..."

          kubectl patch statefulset {{ include "shop-manager.fullname" . }}-keycloak \
            --type='strategic' --patch='
          spec:
            template:
              spec:
                initContainers:
                - name: theme-installer
                  image: busybox:1.35
                  command:
                  - sh
                  - -c
                  - |
                    echo "Installing Shop Manager theme files..."
                    mkdir -p /themes/{{ .Values.keycloak.customTheme.name }}/login/resources/css
                    cp /theme-config/theme.properties /themes/{{ .Values.keycloak.customTheme.name }}/login/ || true
                    cp /theme-config/template.ftl /themes/{{ .Values.keycloak.customTheme.name }}/login/ || true
                    cp /theme-config/login.ftl /themes/{{ .Values.keycloak.customTheme.name }}/login/ || true
                    cp /theme-config/shop-manager.css /themes/{{ .Values.keycloak.customTheme.name }}/login/resources/css/ || true
                    chmod -R 755 /themes
                    echo "Theme files installed successfully"
                    ls -la /themes/{{ .Values.keycloak.customTheme.name }}/login/
                  volumeMounts:
                  - name: theme-config
                    mountPath: /theme-config
                  - name: themes
                    mountPath: /themes
                containers:
                - name: keycloak
                  volumeMounts:
                  - name: themes
                    mountPath: /opt/bitnami/keycloak/themes
                volumes:
                - name: theme-config
                  configMap:
                    name: {{ include "shop-manager.fullname" . }}-keycloak-theme
                - name: themes
                  emptyDir: {}
          '

          echo "✅ StatefulSet patched successfully"

          # Wait for the rollout to complete
          echo "⏳ Waiting for Keycloak rollout to complete..."
          kubectl rollout restart statefulset/{{ include "shop-manager.fullname" . }}-keycloak
          kubectl rollout status statefulset/{{ include "shop-manager.fullname" . }}-keycloak --timeout=300s

          # Wait for Keycloak to be ready
          echo "⏳ Waiting for Keycloak to be ready after restart..."
          sleep 30

          {{- if .Values.keycloak.customTheme.applyToRealm }}
          # Apply theme to shop-manager realm
          echo "🔐 Configuring theme for shop-manager realm..."

          # Get the Keycloak pod name
          POD_NAME=$(kubectl get pods -l app.kubernetes.io/name=keycloak,app.kubernetes.io/instance={{ .Release.Name }} -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD_NAME" ]; then
            echo "❌ Could not find Keycloak pod"
            exit 1
          fi

          echo "Found Keycloak pod: $POD_NAME"

          # Configure the theme in the realm
          kubectl exec $POD_NAME -- /opt/bitnami/keycloak/bin/kcadm.sh update realms/shop-manager \
            -s loginTheme={{ .Values.keycloak.customTheme.name }} \
            --server http://localhost:8080 \
            --realm master \
            --user {{ .Values.keycloak.auth.adminUser }} \
            --password '{{ .Values.keycloak.auth.adminPassword }}' || echo "Theme configuration update failed (may already be set)"
          {{- end }}

          echo ""
          echo "✅ Shop Manager theme installation complete!"
          echo ""
          echo "🌐 Access the custom login page at:"
          echo "   https://{{ .Values.keycloak.ingress.hostname }}/realms/shop-manager/account"
          echo ""
          echo "🎨 Theme features:"
          echo "   - Custom Shop Manager branding"
          echo "   - Password visibility toggle"
          echo "   - Enhanced remember me checkbox"
          echo "   - Development credential auto-fill"
          echo "   - Animated backgrounds and effects"
          echo ""
      serviceAccountName: {{ include "shop-manager.fullname" . }}-keycloak-theme-sa
{{- end }}