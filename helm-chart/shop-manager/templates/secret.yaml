apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-manager.fullname" . }}-secret
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database Credentials
  SPRING_DATASOURCE_URL: {{ .Values.secrets.database.url | default (printf "jdbc:postgresql://%s-postgresql:5432/%s" (include "shop-manager.fullname" .) .Values.postgresql.auth.database) | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.secrets.database.username | default .Values.postgresql.auth.username | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.database.password | default .Values.postgresql.auth.password | quote }}

  # Keycloak Credentials
  {{- if .Values.keycloak.enabled }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloak.clientSecret | default "shop-manager-backend-secret" | quote }}
  KEYCLOAK_ADMIN_USERNAME: {{ .Values.secrets.keycloak.adminUsername | default .Values.keycloak.auth.adminUser | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloak.adminPassword | default .Values.keycloak.auth.adminPassword | quote }}
  {{- end }}

  # MinIO/S3 Credentials for Backup
  {{- if .Values.secrets.minio.enabled }}
  MINIO_ENDPOINT: {{ .Values.secrets.minio.endpoint | default "http://localhost:9000" | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minio.accessKey | default "minioadmin" | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minio.secretKey | default "minioadmin" | quote }}
  MINIO_BUCKET: {{ .Values.secrets.minio.bucket | default "shop-manager-backups" | quote }}
  {{- end }}

  # Email Configuration
  {{- if .Values.secrets.email.enabled }}
  SPRING_MAIL_HOST: {{ .Values.secrets.email.host | quote }}
  SPRING_MAIL_PORT: {{ .Values.secrets.email.port | default "587" | quote }}
  SPRING_MAIL_USERNAME: {{ .Values.secrets.email.username | quote }}
  SPRING_MAIL_PASSWORD: {{ .Values.secrets.email.password | quote }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: {{ .Values.secrets.email.smtpAuth | default "true" | quote }}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: {{ .Values.secrets.email.starttlsEnable | default "true" | quote }}
  {{- end }}

  # SMS Configuration
  {{- if .Values.secrets.sms.enabled }}
  SMS_PROVIDER_API_KEY: {{ .Values.secrets.sms.apiKey | quote }}
  SMS_PROVIDER_API_SECRET: {{ .Values.secrets.sms.apiSecret | quote }}
  SMS_PROVIDER_FROM_NUMBER: {{ .Values.secrets.sms.fromNumber | quote }}
  {{- end }}

  # Backup Encryption Key
  BACKUP_ENCRYPTION_KEY: {{ .Values.secrets.backup.encryptionKey | default (randAlphaNum 32) | quote }}
  BACKUP_ENCRYPTION_SALT: {{ .Values.secrets.backup.encryptionSalt | default (randAlphaNum 16) | quote }}

  # JWT Secret
  JWT_SECRET: {{ .Values.secrets.jwt.secret | default (randAlphaNum 64) | b64enc | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwt.refreshSecret | default (randAlphaNum 64) | b64enc | quote }}

  # API Keys for External Services
  {{- if .Values.secrets.apiKeys }}
  {{- range $key, $value := .Values.secrets.apiKeys }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

  # Fraud Detection Service
  {{- if .Values.secrets.fraudDetection.enabled }}
  FRAUD_DETECTION_API_KEY: {{ .Values.secrets.fraudDetection.apiKey | quote }}
  FRAUD_DETECTION_API_URL: {{ .Values.secrets.fraudDetection.apiUrl | quote }}
  {{- end }}

  # Payment Gateway
  {{- if .Values.secrets.paymentGateway.enabled }}
  PAYMENT_GATEWAY_API_KEY: {{ .Values.secrets.paymentGateway.apiKey | quote }}
  PAYMENT_GATEWAY_SECRET_KEY: {{ .Values.secrets.paymentGateway.secretKey | quote }}
  PAYMENT_GATEWAY_MERCHANT_ID: {{ .Values.secrets.paymentGateway.merchantId | quote }}
  {{- end }}

  # Monitoring and Analytics
  {{- if .Values.secrets.monitoring.enabled }}
  DATADOG_API_KEY: {{ .Values.secrets.monitoring.datadogApiKey | quote }}
  NEW_RELIC_LICENSE_KEY: {{ .Values.secrets.monitoring.newRelicLicenseKey | quote }}
  SENTRY_DSN: {{ .Values.secrets.monitoring.sentryDsn | quote }}
  {{- end }}

  # Redis Configuration (if used for caching)
  {{- if .Values.secrets.redis.enabled }}
  SPRING_REDIS_HOST: {{ .Values.secrets.redis.host | default "redis" | quote }}
  SPRING_REDIS_PORT: {{ .Values.secrets.redis.port | default "6379" | quote }}
  SPRING_REDIS_PASSWORD: {{ .Values.secrets.redis.password | default "" | quote }}
  {{- end }}