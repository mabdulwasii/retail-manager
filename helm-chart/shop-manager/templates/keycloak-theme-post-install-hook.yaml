{{- if and .Values.keycloak.enabled .Values.keycloak.customTheme.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "shop-manager.fullname" . }}-keycloak-theme-post-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-theme-post-install
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "shop-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-theme-post-install
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-keycloak
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "⏳ Waiting for Keycloak to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://{{ include "shop-manager.fullname" . }}-keycloak:80/realms/shop-manager > /dev/null 2>&1; then
              echo "✅ Keycloak is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Keycloak not ready, waiting 10 seconds..."
            sleep 10
          done
          echo "❌ Timeout waiting for Keycloak"
          exit 1
      containers:
      - name: theme-configurator
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "🎨 Configuring Shop Manager theme for realm..."

          # Get admin access token
          echo "🔑 Authenticating with Keycloak admin..."
          TOKEN_RESPONSE=$(curl -s -X POST "http://{{ include "shop-manager.fullname" . }}-keycloak:80/realms/master/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username={{ .Values.keycloak.auth.adminUser }}" \
            -d "password={{ .Values.keycloak.auth.adminPassword }}" \
            -d "grant_type=password" \
            -d "client_id=admin-cli")

          TOKEN=$(echo "$TOKEN_RESPONSE" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')

          if [ -z "$TOKEN" ]; then
            echo "❌ Failed to get access token"
            echo "Response: $TOKEN_RESPONSE"
            exit 1
          fi

          echo "✅ Successfully authenticated with Keycloak"

          {{- if .Values.keycloak.customTheme.applyToRealm }}
          # Configure the theme in the shop-manager realm
          echo "🎨 Setting login theme to '{{ .Values.keycloak.customTheme.name }}'..."

          THEME_RESPONSE=$(curl -s -w "%{http_code}" -X PUT "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/shop-manager" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"loginTheme": "{{ .Values.keycloak.customTheme.name }}"}')

          HTTP_CODE=$(echo "$THEME_RESPONSE" | tail -c 4)

          if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Theme configured successfully for shop-manager realm!"
          else
            echo "❌ Failed to configure theme (HTTP $HTTP_CODE)"
            echo "Response: $THEME_RESPONSE"
            exit 1
          fi

          # Verify the theme is set
          echo "🔍 Verifying theme configuration..."
          VERIFY_RESPONSE=$(curl -s -X GET "http://{{ include "shop-manager.fullname" . }}-keycloak:80/admin/realms/shop-manager" \
            -H "Authorization: Bearer $TOKEN")

          CURRENT_THEME=$(echo "$VERIFY_RESPONSE" | sed -n 's/.*"loginTheme":"\([^"]*\)".*/\1/p')

          if [ "$CURRENT_THEME" = "{{ .Values.keycloak.customTheme.name }}" ]; then
            echo "✅ Verification successful! Current login theme: $CURRENT_THEME"
          else
            echo "⚠️  Theme verification failed. Current theme: $CURRENT_THEME"
            echo "Expected: {{ .Values.keycloak.customTheme.name }}"
          fi
          {{- else }}
          echo "ℹ️  Theme application to realm is disabled in configuration"
          {{- end }}

          echo "🎨 Theme configuration completed!"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
{{- end }}