{{- if .Values.keycloak.enabled }}
{{- $branding := .Values.branding -}}
{{- $themeName := include "shop-manager.keycloak.themeName" . -}}
{{- $cssFileName := include "shop-manager.keycloak.themeCssName" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop-manager.themeConfigMapName" . }}
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-theme
data:
  theme.properties: |
    parent=keycloak
    import=common/keycloak
    locales=en
    styles=css/login.css css/{{ $cssFileName }}

  template.ftl: |
    <#macro registrationLayout displayInfo=false displayMessage=true displayRequiredFields=false displayWide=false showAnotherWayIfPresent=true>
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="robots" content="noindex, nofollow">
        <title>{{ $branding.platformName | default "Shop Manager" }}</title>
        <link rel="icon" href="data:image/x-icon;base64,{{ $branding.logo.favicon | default "AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAA" }}">
        <#if properties.stylesCommon?has_content>
            <#list properties.stylesCommon?split(' ') as style>
                <link href="${url.resourcesCommonPath}/${style}" rel="stylesheet" />
            </#list>
        </#if>
        <#if properties.styles?has_content>
            <#list properties.styles?split(' ') as style>
                <link href="${url.resourcesPath}/${style}" rel="stylesheet" />
            </#list>
        </#if>
    </head>
    <body>
        <div class="login-pf-page">
            <div class="container">
                <div class="row">
                    <div class="col-sm-6 col-md-6 col-lg-8 col-sm-offset-1 col-md-offset-1 col-lg-offset-2">
                        <div class="card-pf">
                            <header class="login-pf-header">
                                <div class="login-pf-brand">
                                    {{- if $branding.logo.primary }}
                                    <img src="{{ $branding.logo.primary }}" alt="{{ $branding.platformName | default "Shop Manager" }}" class="login-logo">
                                    {{- else }}
                                    <h1>{{ $branding.platformName | default "Shop Manager" }}</h1>
                                    {{- end }}
                                </div>
                            </header>
                            <div class="row">
                                <div class="col-md-10 col-md-offset-1">
                                    <#if displayMessage && message?has_content && (message.type != 'warning' || !isAppInitiatedAction??)>
                                        <div class="alert alert-${message.type}">
                                            <#if message.type = 'success'><span class="pficon pficon-ok"></span></#if>
                                            <#if message.type = 'warning'><span class="pficon pficon-warning-triangle-o"></span></#if>
                                            <#if message.type = 'error'><span class="pficon pficon-error-circle-o"></span></#if>
                                            <#if message.type = 'info'><span class="pficon pficon-info"></span></#if>
                                            <span class="kc-feedback-text">${kcSanitize(message.summary)?no_esc}</span>
                                        </div>
                                    </#if>
                                    <div id="kc-content">
                                        <div id="kc-content-wrapper">
                                            <#nested "form">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="login-pf-footer">
                            <p class="login-pf-footer-text">{{ $branding.companyName | default "Your Company" }}</p>
                        </footer>
                    </div>
                </div>
            </div>
        </div>
    </body>
    </html>
    </#macro>

  login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayInfo=social.displayInfo displayWide=(realm.password && social.providers??); section>
        <#if section = "header">
            Sign in to {{ $branding.platformName | default "Shop Manager" }}
        <#elseif section = "form">
            <div id="kc-form" <#if realm.password && social.providers??>class="${properties.kcContentWrapperClass!}"</#if>>
                <div id="kc-form-wrapper" <#if realm.password && social.providers??>class="${properties.kcFormSocialAccountContentClass!} ${properties.kcFormSocialAccountClass!}"</#if>>
                    <#if realm.password>
                        <form id="kc-form-login" onsubmit="login.disabled = true; return true;" action="${url.loginAction}" method="post">
                            <div class="${properties.kcFormGroupClass!}">
                                <label for="username" class="${properties.kcLabelClass!}"><#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if></label>
                                <#if usernameEditDisabled??>
                                    <input tabindex="1" id="username" class="${properties.kcInputClass!}" name="username" value="${(login.username!'')}" type="text" disabled />
                                <#else>
                                    <input tabindex="1" id="username" class="${properties.kcInputClass!}" name="username" value="${(login.username!'')}"  type="text" autofocus autocomplete="off" />
                                </#if>
                            </div>

                            <div class="${properties.kcFormGroupClass!}">
                                <label for="password" class="${properties.kcLabelClass!}">${msg("password")}</label>
                                <input tabindex="2" id="password" class="${properties.kcInputClass!}" name="password" type="password" autocomplete="off" />
                            </div>

                            <div class="${properties.kcFormGroupClass!} ${properties.kcFormSettingClass!}">
                                <div id="kc-form-options">
                                    <#if realm.rememberMe && !usernameEditDisabled??>
                                        <div class="checkbox">
                                            <label>
                                                <#if login.rememberMe??>
                                                    <input tabindex="3" id="rememberMe" name="rememberMe" type="checkbox" checked> ${msg("rememberMe")}
                                                <#else>
                                                    <input tabindex="3" id="rememberMe" name="rememberMe" type="checkbox"> ${msg("rememberMe")}
                                                </#if>
                                            </label>
                                        </div>
                                    </#if>
                                </div>
                                <div class="${properties.kcFormOptionsWrapperClass!}">
                                    <#if realm.resetPasswordAllowed>
                                        <span><a tabindex="5" href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a></span>
                                    </#if>
                                </div>
                            </div>

                            <div id="kc-form-buttons" class="${properties.kcFormGroupClass!}">
                                <input type="hidden" id="id-hidden-input" name="credentialId" <#if auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>/>
                                <input tabindex="4" class="${properties.kcButtonClass!} ${properties.kcButtonPrimaryClass!} ${properties.kcButtonBlockClass!} ${properties.kcButtonLargeClass!}" name="login" id="kc-login" type="submit" value="${msg("doLogIn")}"/>
                            </div>
                        </form>
                    </#if>
                </div>
            </div>
        </#if>
    </@layout.registrationLayout>

  {{ $cssFileName }}: |
    /* {{ $branding.platformName | default "Shop Manager" }} Custom Theme */

    :root {
      --primary-color: {{ $branding.colors.primary | default "#1976d2" }};
      --secondary-color: {{ $branding.colors.secondary | default "#dc004e" }};
      --success-color: {{ $branding.colors.success | default "#388e3c" }};
      --warning-color: {{ $branding.colors.warning | default "#f57c00" }};
      --error-color: {{ $branding.colors.error | default "#d32f2f" }};
      --background-color: {{ $branding.loginTheme.backgroundColor | default "#f5f5f5" }};
      --card-background: {{ $branding.loginTheme.cardBackgroundColor | default "#ffffff" }};
      --border-radius: {{ $branding.loginTheme.borderRadius | default "8px" }};
      --font-family: {{ $branding.fonts.family | default "Roboto, Arial, sans-serif" }};
      --card-shadow: {{ $branding.loginTheme.cardShadow | default "0 4px 6px rgba(0, 0, 0, 0.1)" }};
    }

    body {
      font-family: var(--font-family);
      background-color: var(--background-color);
      background-image: linear-gradient(135deg, var(--background-color) 0%, rgba(var(--primary-color), 0.1) 100%);
    }

    .login-pf-page {
      background-color: transparent;
    }

    .card-pf {
      background-color: var(--card-background);
      border-radius: var(--border-radius);
      box-shadow: var(--card-shadow);
      border: none;
      overflow: hidden;
    }

    .login-pf-header {
      background-color: var(--primary-color);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .login-pf-brand h1 {
      color: white;
      font-size: 28px;
      font-weight: bold;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }

    .login-logo {
      max-height: 60px;
      max-width: 200px;
      filter: brightness(0) invert(1);
    }

    .btn-primary,
    input[type="submit"].btn-primary,
    .kcButtonClass.kcButtonPrimaryClass {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
      border-radius: calc(var(--border-radius) / 2);
      padding: 12px 24px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-primary:hover,
    input[type="submit"].btn-primary:hover,
    .kcButtonClass.kcButtonPrimaryClass:hover {
      background-color: var(--secondary-color);
      border-color: var(--secondary-color);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .form-control,
    .kcInputClass {
      border-radius: calc(var(--border-radius) / 2);
      border: 2px solid #e0e0e0;
      padding: 12px 16px;
      font-size: 14px;
      transition: border-color 0.3s ease;
    }

    .form-control:focus,
    .kcInputClass:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(var(--primary-color), 0.1);
    }

    .login-pf-footer {
      text-align: center;
      margin-top: 20px;
      color: #666;
      font-size: 12px;
    }

    .alert-error {
      background-color: var(--error-color);
      color: white;
      border-radius: calc(var(--border-radius) / 2);
      border: none;
      padding: 12px 16px;
    }

    .alert-success {
      background-color: var(--success-color);
      color: white;
      border-radius: calc(var(--border-radius) / 2);
      border: none;
      padding: 12px 16px;
    }

    .checkbox label {
      font-weight: normal;
      color: #666;
    }

    a {
      color: var(--primary-color);
      text-decoration: none;
    }

    a:hover {
      color: var(--secondary-color);
      text-decoration: underline;
    }
{{- end }}