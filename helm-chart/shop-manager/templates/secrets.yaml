apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-manager.fullname" . }}-secrets
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Database passwords (base64 encoded)
  postgres-admin-password: {{ .Values.secrets.database.postgresPassword | b64enc | quote }}
  postgres-shop-password: {{ .Values.secrets.database.shopPassword | b64enc | quote }}
  postgres-keycloak-password: {{ .Values.secrets.database.keycloakPassword | b64enc | quote }}

  # Keycloak admin credentials
  keycloak-admin-user: {{ .Values.secrets.keycloak.adminUser | b64enc | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloak.adminPassword | b64enc | quote }}
  keycloak-frontend-secret: {{ .Values.secrets.keycloak.frontendClientSecret | b64enc | quote }}
  keycloak-backend-secret: {{ .Values.secrets.keycloak.backendClientSecret | b64enc | quote }}

  # MinIO credentials
  minio-root-user: {{ .Values.secrets.minio.rootUser | b64enc | quote }}
  minio-root-password: {{ .Values.secrets.minio.rootPassword | b64enc | quote }}

  # Application security keys
  jwt-secret: {{ .Values.secrets.security.jwtSecret | b64enc | quote }}
  encryption-key: {{ .Values.secrets.security.encryptionKey | b64enc | quote }}

  # Email configuration (if enabled)
  {{- if .Values.secrets.email.enabled }}
  smtp-username: {{ .Values.secrets.email.username | b64enc | quote }}
  smtp-password: {{ .Values.secrets.email.password | b64enc | quote }}
  {{- end }}

  # Swagger API documentation password
  swagger-password: {{ .Values.secrets.security.swaggerPassword | b64enc | quote }}
---
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-manager.fullname" . }}-postgresql
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql-secret
type: Opaque
data:
  postgres-password: {{ .Values.secrets.database.postgresPassword | b64enc | quote }}
  password: {{ .Values.secrets.database.shopPassword | b64enc | quote }}
{{- end }}
---
{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-manager.fullname" . }}-keycloak
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-secret
type: Opaque
data:
  admin-password: {{ .Values.secrets.keycloak.adminPassword | b64enc | quote }}
  postgres-password: {{ .Values.secrets.database.keycloakPassword | b64enc | quote }}
{{- end }}
---
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shop-manager.fullname" . }}-minio
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio-secret
type: Opaque
data:
  root-user: {{ .Values.secrets.minio.rootUser | b64enc | quote }}
  root-password: {{ .Values.secrets.minio.rootPassword | b64enc | quote }}
{{- end }}