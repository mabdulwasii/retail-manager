{{- if .Values.certificates.enabled }}
---
# Self-signed issuer for creating local CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Local CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca-certificate
  namespace: cert-manager
spec:
  isCA: true
  commonName: "Shop Manager Local CA"
  secretName: local-ca-key-pair
  privateKey:
    algorithm: RSA
    size: 4096
  duration: {{ .Values.certificates.duration | default "87600h" }}  # 10 years
  renewBefore: {{ .Values.certificates.renewBefore | default "720h" }}
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Local CA Issuer - uses the CA certificate created above
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-ca-issuer
spec:
  ca:
    secretName: local-ca-key-pair
---
{{- if eq .Values.tls.issuer "letsencrypt-prod" }}
# Let's Encrypt Production Issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.tls.email | default "admin@example.com" }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: {{ .Values.ingress.className | default "nginx" }}
{{- end }}
---
{{- if eq .Values.tls.issuer "letsencrypt-staging" }}
# Let's Encrypt Staging Issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ .Values.tls.email | default "admin@example.com" }}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: {{ .Values.ingress.className | default "nginx" }}
{{- end }}
{{- end }}