apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop-manager.fullname" . }}-backend
  labels:
    {{- include "shop-manager.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "shop-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "shop-manager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: postgres:14
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h {{ include "shop-manager.fullname" . }}-postgresql -p 5432; do
                echo "PostgreSQL is not ready yet..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
        {{- if .Values.keycloak.enabled }}
        - name: wait-for-keycloak
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak to be ready..."
              until wget -q --spider http://{{ include "shop-manager.fullname" . }}-keycloak:80/realms/master; do
                echo "Keycloak is not ready yet..."
                sleep 5
              done
              echo "Keycloak is ready!"
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 180 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 5 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 120 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 5 }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.SPRING_PROFILES_ACTIVE | default "prod" | quote }}
            - name: SERVER_PORT
              value: {{ .Values.service.targetPort | default "8081" | quote }}
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: {{ .Values.config.monitoring.exposedEndpoints | default "health,info,metrics,prometheus" | quote }}
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION
              value: "true"
            {{- if .Values.postgresql.enabled }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "shop-manager.fullname" . }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shop-manager.fullname" . }}-postgresql
                  key: password
            - name: SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT
              value: "30000"
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE
              value: "10"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUMIDLE
              value: "5"
            - name: SPRING_DATASOURCE_HIKARI_IDLETIMEOUT
              value: "600000"
            - name: SPRING_DATASOURCE_HIKARI_MAXLIFETIME
              value: "1800000"
            - name: SPRING_DATASOURCE_HIKARI_VALIDATIONTIMEOUT
              value: "3000"
            {{- end }}
            {{- if .Values.kafka.enabled }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ include "shop-manager.fullname" . }}-kafka:9092"
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            - name: KEYCLOAK_ISSUER_URI
              value: "http://{{ include "shop-manager.fullname" . }}-keycloak:80/realms/shop-manager"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://{{ include "shop-manager.fullname" . }}-keycloak:80/realms/shop-manager/protocol/openid-connect/certs"
            - name: KEYCLOAK_AUTH_SERVER_URL
              value: "http://{{ include "shop-manager.fullname" . }}-keycloak:80"
            {{- end }}
            # Feature flags
            - name: FEATURE_INVESTMENT_ENABLED
              value: {{ .Values.features.investment.enabled | default "true" | quote }}
            - name: FEATURE_ANALYTICS_ENABLED
              value: {{ .Values.features.analytics.enabled | default "true" | quote }}
            - name: FEATURE_FRAUD_ENABLED
              value: {{ .Values.features.fraud.enabled | default "false" | quote }}
            # Security settings
            - name: SECURITY_TENANT_ISOLATION
              value: {{ .Values.config.security.tenantIsolation | default "true" | quote }}
            # Storage settings
            - name: STORAGE_BACKUP_PATH
              value: {{ .Values.config.backup.path | default "/var/shop-manager/backups" | quote }}
            # Audit settings
            - name: AUDIT_ENABLED
              value: {{ .Values.config.audit.enabled | default "true" | quote }}
            - name: AUDIT_RETENTION_DAYS
              value: {{ .Values.config.audit.retentionDays | default "90" | quote }}
            # Security secrets from Kubernetes secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "shop-manager.fullname" . }}-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shop-manager.fullname" . }}-secrets
                  key: encryption-key
            - name: APP_SWAGGER_SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shop-manager.fullname" . }}-secrets
                  key: swagger-password
            {{- if .Values.secrets.email.enabled }}
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "shop-manager.fullname" . }}-secrets
                  key: smtp-username
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "shop-manager.fullname" . }}-secrets
                  key: smtp-password
            {{- end }}
          {{- with .Values.configMap.data }}
          envFrom:
            - configMapRef:
                name: {{ include "shop-manager.fullname" . }}-config
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: backup-storage
              mountPath: {{ .Values.config.backup.path | default "/var/shop-manager/backups" }}
      volumes:
        - name: backup-storage
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}