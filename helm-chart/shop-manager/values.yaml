replicaCount: 1

image:
  repository: shop-manager-backend
  tag: fixed-v3
  pullPolicy: IfNotPresent

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: shop-manager-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    targetPort: 80
    nodePort: 30080
  config:
    environment: production
    keycloakRealm: shop-manager
    keycloakClientId: shop-manager-frontend
    apiBaseUrl: "http://shop-manager:8081/api"
    keycloakUrl: "http://shop-manager-keycloak:8080"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: []
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: shop-manager-frontend.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

nameOverride: ""
fullnameOverride: ""
service:
  type: NodePort
  port: 8081
  targetPort: 8081
  nodePort: 30081

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: shop-manager.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Environment variables
env:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus

# ConfigMap configuration
configMap:
  data: {}

# Database configuration
# SECURITY WARNING: Change these passwords in production!
# Override using Helm values or environment variables:
# --set postgresql.auth.postgresPassword="your-secure-password"
# --set postgresql.auth.password="your-secure-password"
postgresql:
  enabled: true
  # Automated database initialization
  initdb:
    enabled: true
    # Creates all required databases and users automatically
    scripts:
      keycloak-init.sql: |
        -- Create keycloak user and database
        CREATE USER IF NOT EXISTS keycloak WITH PASSWORD 'KeycloakDB@2024!SecurePassword';
        CREATE DATABASE IF NOT EXISTS keycloak OWNER keycloak;
        GRANT ALL PRIVILEGES ON DATABASE keycloak TO keycloak;
  auth:
    # CHANGE IN PRODUCTION: Use secure randomly generated passwords
    postgresPassword: "PostgresAdm1n@2024!SecureDB"  # Override in production
    username: shop
    password: "KeycloakDB@2024!SecurePassword"  # Override in production - shared with keycloak
    database: shopdb
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  metrics:
    enabled: true

# Kafka configuration
kafka:
  enabled: true

# Keycloak configuration
# SECURITY WARNING: Change these passwords in production!
# Override using Helm values or environment variables:
# --set keycloak.auth.adminPassword="your-secure-admin-password"
# --set keycloak.postgresql.auth.postgresPassword="your-secure-postgres-password"
# --set keycloak.postgresql.auth.password="your-secure-keycloak-password"
keycloak:
  enabled: true
  auth:
    adminUser: admin
    # CHANGE IN PRODUCTION: Use secure randomly generated password
    adminPassword: "KeycloakAdm1n@2024!SecureAuth"  # Override in production
  postgresql:
    enabled: true
    auth:
      # CHANGE IN PRODUCTION: Use secure randomly generated passwords
      postgresPassword: "KeycloakPostgres@2024!SecureDB"  # Override in production
      username: keycloak
      password: "KeycloakDB@2024!SecurePassword"  # Override in production
      database: keycloak
  ingress:
    enabled: true
    hostname: keycloak.local
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  extraEnvVars:
    - name: KC_HOSTNAME_PORT
      value: "8080"
    - name: KC_HTTP_PORT
      value: "8080"

# Application-specific comprehensive configuration
config:
  # Database settings
  database:
    showSql: false
    formatSql: true
    poolSize: 20
    minIdle: 10
    connectionTimeout: 30000

  # Timezone and locale
  timezone: "UTC"
  locale: "en_US"

  # Business rules
  business:
    defaultCurrency: "USD"
    defaultTaxRate: "0.075"
    maxReturnDays: 30
    minReorderPoint: 10

  # Inventory management
  inventory:
    lowStockThreshold: 10
    expiryWarningDays: 30
    autoReorderEnabled: false
    stockCheckIntervalHours: 6

  # Security settings
  security:
    tenantIsolation: true
    permissionCaching: true
    sessionTimeoutMinutes: 30
    maxLoginAttempts: 5
    accountLockDurationMinutes: 30
    passwordMinLength: 8
    jwtExpirationHours: 24

  # Audit configuration
  audit:
    enabled: true
    retentionDays: 90
    logEntityChanges: true
    logSecurityEvents: true
    logApiRequests: false

  # Backup configuration
  backup:
    path: "/var/shop-manager/backups"
    retentionDays: 30
    maxFileSizeMb: 500
    compressionEnabled: true
    encryptionAlgorithm: "AES256"
    scheduleCron: "0 0 2 * * SUN"

  # Cache settings
  cache:
    defaultTtlMinutes: 60
    analyticsTtlHours: 1

  # Notification settings
  notification:
    emailEnabled: true
    smsEnabled: false
    lowStockAlertEnabled: true

  # Upload configuration
  upload:
    maxFileSizeMb: 10
    allowedExtensions: "csv,xlsx,xls,pdf,jpg,jpeg,png"
    tempDirectory: "/tmp/shop-manager/uploads"

  # Performance tuning
  performance:
    connectionPoolSize: 10
    queryTimeoutSeconds: 30
    bulkBatchSize: 1000

  # Report generation
  reports:
    defaultFormat: "PDF"
    generationTimeoutMinutes: 5

  # Integration settings
  integration:
    retryAttempts: 3
    retryDelayMs: 1000
    timeoutSeconds: 30

  # Monitoring
  monitoring:
    exposedEndpoints: "health,info,metrics,prometheus"
    showHealthDetails: "always"
    prometheusEnabled: true

  # Scheduler configuration
  scheduler:
    profitDistribution:
      enabled: true
      monthlyDay: 1
      monthlyHour: 2
    cacheCleanup:
      enabled: true
      intervalHours: 6
    auditCleanup:
      enabled: true
      intervalDays: 7

  # Logging configuration
  logging:
    rootLevel: "INFO"
    appLevel: "INFO"
    securityLevel: "WARN"
    webLevel: "WARN"
    pattern: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

  # Keycloak settings
  keycloak:
    realm: "shop-manager"
    clientId: "shop-manager-backend"
    authServerUrl: "http://shop-manager-keycloak:8080"
    issuerUri: "http://shop-manager-keycloak:8080/realms/shop-manager"
    jwkSetUri: "http://shop-manager-keycloak:8080/realms/shop-manager/protocol/openid-connect/certs"

  # System flags
  maintenanceMode: false
  debugMode: false

# Feature flags
features:
  investment:
    enabled: true
  analytics:
    enabled: true
  fraud:
    enabled: false
  multiCurrency: false
  barcodeScanning: true
  loyaltyProgram: false

