replicaCount: 1

image:
  repository: shop-manager-backend
  tag: latest
  pullPolicy: IfNotPresent

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: shop-manager-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    targetPort: 80
    nodePort: 30080
  config:
    environment: production
    keycloakRealm: shop-manager
    keycloakClientId: shop-manager-frontend
    apiBaseUrl: "https://api.shop-manager.local/api"
    keycloakUrl: "https://auth.shop-manager.local"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: []
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    hosts:
      - host: shop-manager.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: shop-manager-frontend-tls
        hosts:
          - shop-manager.local

nameOverride: ""
fullnameOverride: ""
service:
  type: NodePort
  port: 8081
  targetPort: 8081
  nodePort: 30081

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: api.shop-manager.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: shop-manager-backend-tls
      hosts:
        - api.shop-manager.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# TLS Certificate configuration
tls:
  enabled: true
  issuer: letsencrypt-prod  # Options: letsencrypt-prod, letsencrypt-staging, selfsigned-issuer
  email: admin@shop-manager.local

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 90
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

# Environment variables
env:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  SPRING_JPA_HIBERNATE_DDL_AUTO: none

# ConfigMap configuration
configMap:
  data:
    # Super Admin Bootstrap Configuration (Spring Boot property format)
    APP_BOOTSTRAP_SUPERADMIN_ENABLED: "true"
    APP_BOOTSTRAP_SUPERADMIN_USERNAME: "superadmin"
    APP_BOOTSTRAP_SUPERADMIN_EMAIL: "superadmin@shopmanager.local"
    APP_BOOTSTRAP_SUPERADMIN_FIRSTNAME: "Super"
    APP_BOOTSTRAP_SUPERADMIN_LASTNAME: "Admin"
    APP_BOOTSTRAP_SUPERADMIN_PHONENUMBER: "+1-555-000-0001"
    APP_BOOTSTRAP_SUPERADMIN_PASSWORD: "SuperAdmin@2024!"

# Database configuration for shop-manager backend
# SECURITY WARNING: Change these passwords in production!
postgresql:
  enabled: true
  fullnameOverride: "shop-manager-postgresql"
  auth:
    postgresPassword: "PostgresAdm1n@2024!SecureDB#CompliantPassword"
    username: "shop"
    password: "ShopDB@2024!SecurePassword#CompliantStrong"
    database: "shopdb"
    existingSecret: "shop-manager-postgresql"
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  metrics:
    enabled: true

# Separate PostgreSQL for Keycloak
keycloakPostgresql:
  enabled: true
  fullnameOverride: "shop-manager-keycloak-postgresql"
  auth:
    postgresPassword: "PostgresAdm1n@2024!SecureDB#CompliantPassword"
    username: "keycloak"
    password: "KeycloakDB@2024!SecurePassword#Compliant"
    database: "keycloak"
  primary:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# Kafka configuration
kafka:
  enabled: false

# Keycloak configuration
# SECURITY WARNING: Change these passwords in production!
# Override using Helm values or environment variables:
# --set keycloak.auth.adminPassword="your-secure-admin-password"
# --set keycloak.postgresql.auth.postgresPassword="your-secure-postgres-password"
# --set keycloak.postgresql.auth.password="your-secure-keycloak-password"
keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: "KeycloakAdm1n@2024!SecureAuth#CompliantPassword"
  postgresql:
    enabled: false  # Disable built-in PostgreSQL, use our separate one
  externalDatabase:
    host: "shop-manager-keycloak-postgresql"
    port: 5432
    user: "keycloak"
    database: "keycloak"
    password: "KeycloakDB@2024!SecurePassword#Compliant"
  ingress:
    enabled: true
    hostname: auth.shop-manager.local
    tls: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  extraEnvVars:
    # Proper hostname configuration for HTTPS ingress
    - name: KC_HOSTNAME
      value: "auth.shop-manager.local"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: KC_HOSTNAME_STRICT_BACKCHANNEL
      value: "false"
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HTTP_PORT
      value: "8080"
    # Proxy settings for ingress SSL termination
    - name: KC_PROXY
      value: "edge"
    - name: KC_PROXY_ADDRESS_FORWARDING
      value: "true"
    # Disable HTTPS redirect since ingress handles SSL
    - name: KC_HOSTNAME_ADMIN_URL
      value: "https://auth.shop-manager.local"
    - name: KC_FRONTEND_URL
      value: "https://auth.shop-manager.local"
    # Fix iframe timeout issues
    - name: KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_SUPPRESS_LOGOUT_CONFIRMATION_SCREEN
      value: "true"
    - name: KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_DISABLE_TRUST_MANAGER
      value: "true"
    # Development mode settings to bypass iframe checks
    - name: KEYCLOAK_PRODUCTION
      value: "false"
    - name: KC_LOG_LEVEL
      value: "INFO"

  # Custom theme configuration
  customTheme:
    enabled: true
    name: "shop-manager"
    applyToRealm: true

# Application-specific comprehensive configuration
config:
  # Database settings
  database:
    showSql: false
    formatSql: true
    poolSize: 20
    minIdle: 10
    connectionTimeout: 30000

  # Timezone and locale
  timezone: "UTC"
  locale: "en_US"

  # Business rules
  business:
    defaultCurrency: "NGN"
    defaultTaxRate: "0.075"
    maxReturnDays: 30
    minReorderPoint: 10

  # Inventory management
  inventory:
    lowStockThreshold: 10
    expiryWarningDays: 30
    autoReorderEnabled: false
    stockCheckIntervalHours: 6

  # Security settings
  security:
    tenantIsolation: true
    permissionCaching: true
    sessionTimeoutMinutes: 30
    maxLoginAttempts: 5
    accountLockDurationMinutes: 30
    passwordMinLength: 8
    jwtExpirationHours: 24

  # Audit configuration
  audit:
    enabled: true
    retentionDays: 90
    logEntityChanges: true
    logSecurityEvents: true
    logApiRequests: false

  # Backup configuration
  backup:
    path: "/var/shop-manager/backups"
    retentionDays: 30
    maxFileSizeMb: 500
    compressionEnabled: true
    encryptionAlgorithm: "AES256"
    scheduleCron: "0 0 2 * * SUN"

  # Cache settings
  cache:
    defaultTtlMinutes: 60
    analyticsTtlHours: 1

  # Notification settings
  notification:
    emailEnabled: true
    smsEnabled: false
    lowStockAlertEnabled: true

  # Upload configuration
  upload:
    maxFileSizeMb: 10
    allowedExtensions: "csv,xlsx,xls,pdf,jpg,jpeg,png"
    tempDirectory: "/tmp/shop-manager/uploads"

  # Performance tuning
  performance:
    connectionPoolSize: 10
    queryTimeoutSeconds: 30
    bulkBatchSize: 1000

  # Report generation
  reports:
    defaultFormat: "PDF"
    generationTimeoutMinutes: 5

  # Integration settings
  integration:
    retryAttempts: 3
    retryDelayMs: 1000
    timeoutSeconds: 30

  # Monitoring
  monitoring:
    exposedEndpoints: "health,info,metrics,prometheus"
    showHealthDetails: "always"
    prometheusEnabled: true

  # Scheduler configuration
  scheduler:
    profitDistribution:
      enabled: true
      monthlyDay: 1
      monthlyHour: 2
    cacheCleanup:
      enabled: true
      intervalHours: 6
    auditCleanup:
      enabled: true
      intervalDays: 7

  # Logging configuration
  logging:
    rootLevel: "INFO"
    appLevel: "INFO"
    securityLevel: "WARN"
    webLevel: "WARN"
    pattern: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

  # Keycloak settings
  keycloak:
    realm: "shop-manager"
    clientId: "shop-manager-backend"
    authServerUrl: "http://shop-manager-keycloak:8080"
    issuerUri: "http://shop-manager-keycloak:8080/realms/shop-manager"
    jwkSetUri: "http://shop-manager-keycloak:8080/realms/shop-manager/protocol/openid-connect/certs"

  # System flags
  maintenanceMode: false
  debugMode: false

# Feature flags
features:
  investment:
    enabled: true
  analytics:
    enabled: true
  fraud:
    enabled: false
  multiCurrency: false
  barcodeScanning: true
  loyaltyProgram: false

