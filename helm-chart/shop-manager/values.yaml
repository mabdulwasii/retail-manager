    APP_BOOTSTRAP_SUPERADMIN_ENABLED: "true"
    APP_BOOTSTRAP_SUPERADMIN_USERNAME: "superadmin"
    APP_BOOTSTRAP_SUPERADMIN_EMAIL: "superadmin@shopmanager.local"
    APP_BOOTSTRAP_SUPERADMIN_FIRSTNAME: "Super"
    APP_BOOTSTRAP_SUPERADMIN_LASTNAME: "Admin"
    APP_BOOTSTRAP_SUPERADMIN_PHONENUMBER: "+1-555-000-0001"
    APP_BOOTSTRAP_SUPERADMIN_PASSWORD: "SuperAdmin@2024!"

# PostgreSQL configuration (Official postgres:15-alpine image)
# SECURITY WARNING: Change these passwords in production!
postgresql:
  enabled: true
  auth:
    postgresPassword: "PostgresAdm1n@2024!SecureDB#CompliantPassword"
    username: "shop"
    password: "ShopDB@2024!SecurePassword#CompliantStrong"
    database: "shopdb"
  persistence:
    size: 2Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Separate PostgreSQL for Keycloak (Official postgres:15-alpine image)
# Note: Using same password for admin and app simplifies configuration
keycloakPostgresql:
  enabled: true
  auth:
    postgresPassword: "KeycloakDB@2024!SecurePassword#Compliant"  # Not used - we use password field for both
    username: "keycloak"
    password: "KeycloakDB@2024!SecurePassword#Compliant"  # Used for both POSTGRES_PASSWORD and app
    database: "keycloak"
  persistence:
    size: 1Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Kafka configuration
kafka:
  enabled: true
  fullnameOverride: ""  # Will be set dynamically in templates

# Keycloak configuration (using official Keycloak image)
# SECURITY WARNING: Change these passwords in production!
keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: "KeycloakAdm1n@2024!SecureAuth#CompliantPassword"
  externalDatabase:
    host: ""  # Dynamically set by template helper
    port: 5432
    user: "keycloak"
    database: "keycloak"
    password: "KeycloakDB@2024!SecurePassword#Compliant"
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    hostname: auth.shop-manager.local
    ingressClassName: nginx
    tls: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      cert-manager.io/cluster-issuer: "local-ca-issuer"
  logLevel: "INFO"
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Application-specific comprehensive configuration
config:
  # Database settings
  database:
    showSql: false
    formatSql: true
    poolSize: 20
    minIdle: 10
    connectionTimeout: 30000

  # Timezone and locale
  timezone: "UTC"
  locale: "en_US"

  # Business rules
  business:
    defaultCurrency: "NGN"
    defaultTaxRate: "0.075"
    maxReturnDays: 30
    minReorderPoint: 10

  # Inventory management
  inventory:
    lowStockThreshold: 10
    expiryWarningDays: 30
    autoReorderEnabled: false
    stockCheckIntervalHours: 6

  # Security settings
  security:
    tenantIsolation: true
    permissionCaching: true
    sessionTimeoutMinutes: 30
    maxLoginAttempts: 5
    accountLockDurationMinutes: 30
    passwordMinLength: 8
    jwtExpirationHours: 24

  # Audit configuration
  audit:
    enabled: true
    retentionDays: 90
    logEntityChanges: true
    logSecurityEvents: true
    logApiRequests: false

  # Backup configuration
  backup:
    path: "/var/shop-manager/backups"
    retentionDays: 30
    maxFileSizeMb: 500
    compressionEnabled: true
    encryptionAlgorithm: "AES256"
    scheduleCron: "0 0 2 * * SUN"

  # Cache settings
  cache:
    defaultTtlMinutes: 60
    analyticsTtlHours: 1

  # Notification settings
  notification:
    emailEnabled: true
    smsEnabled: false
    lowStockAlertEnabled: true

  # Upload configuration
  upload:
    maxFileSizeMb: 10
    allowedExtensions: "csv,xlsx,xls,pdf,jpg,jpeg,png"
    tempDirectory: "/tmp/shop-manager/uploads"

  # Performance tuning
  performance:
    connectionPoolSize: 10
    queryTimeoutSeconds: 30
    bulkBatchSize: 1000

  # Report generation
  reports:
    defaultFormat: "PDF"
    generationTimeoutMinutes: 5

  # Integration settings
  integration:
    retryAttempts: 3
    retryDelayMs: 1000
    timeoutSeconds: 30

  # Monitoring
  monitoring:
    exposedEndpoints: "health,info,metrics,prometheus"
    showHealthDetails: "always"
    prometheusEnabled: true

  # Scheduler configuration
  scheduler:
    profitDistribution:
      enabled: true
      monthlyDay: 1
      monthlyHour: 2
    cacheCleanup:
      enabled: true
      intervalHours: 6
    auditCleanup:
      enabled: true
      intervalDays: 7

  # Logging configuration
  logging:
    rootLevel: "DEBUG"
    appLevel: "DEBUG"
    securityLevel: "INFO"
    webLevel: "INFO"
    oauth2Level: "DEBUG"
    pattern: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

  # Keycloak settings
  keycloak:
    realm: "shop-manager"
    clientId: "shop-manager-frontend"
    authServerUrl: "https://auth.shop-manager.local"
    issuerUri: "https://auth.shop-manager.local/realms/shop-manager"
    jwkSetUri: "http://shop-manager-keycloak:80/realms/shop-manager/protocol/openid-connect/certs"

  # System flags
  maintenanceMode: false
  debugMode: false

# Feature flags
