# Global configuration - applies to all components
global:
  # Release name customization - affects all resource names and DNS
  # When not specified, uses the Helm release name
  appName: ""  # Leave empty to use release name, or customize (e.g., "my-retail-app")

  # Domain configuration
  domain: "shop-manager.local"  # Base domain ozxsr all services

  # Environment settings
  environment: "production"  # Options: development, staging, production

  # Image registry settings
  imageRegistry: ""  # Leave empty for default registry

  # Common labels applied to all resources
  commonLabels: {}

  # Common annotations applied to all resources
  commonAnnotations: {}

# Platform branding and customization
branding:
  # Platform identity - what users see
  platformName: "Shop Manager"  # Main title shown in UI and login
  companyName: "Your Company"   # Company name in footer and documents
  platformDescription: "Retail Management Platform"

  # Visual identity
  logo:
    # Base64 encoded logo image or URL - used in login page and UI header
    primary: ""  # Main logo (SVG/PNG recommended)
    favicon: ""  # Favicon (ICO format recommended)
    loginLogo: ""  # Optional different logo for login page

  # Color scheme
  colors:
    primary: "#1976d2"      # Primary brand color
    secondary: "#dc004e"    # Secondary brand color
    success: "#388e3c"      # Success/positive actions
    warning: "#f57c00"      # Warning/caution
    error: "#d32f2f"        # Error/danger
    background: "#fafafa"   # Page background
    surface: "#ffffff"      # Card/panel background

  # Typography
  fonts:
    family: "Roboto, Arial, sans-serif"  # Font family
    size:
      small: "12px"
      medium: "14px"
      large: "16px"
      title: "20px"

  # Theme customization for Keycloak login
  loginTheme:
    backgroundColor: "#f5f5f5"
    cardBackgroundColor: "#ffffff"
    cardShadow: "0 4px 6px rgba(0, 0, 0, 0.1)"
    borderRadius: "8px"

  # UI customization
  ui:
    showCompanyName: true
    showPoweredBy: false  # Hide "Powered by Shop Manager"
    customFooterText: ""  # Custom footer text

  # Email templates branding
  email:
    headerColor: "#1976d2"
    logoUrl: ""  # URL to logo for emails
    companyAddress: ""

  # PDF reports branding
  reports:
    headerLogo: ""  # Logo for PDF headers
    watermark: ""   # Company watermark

# Backend service configuration
backend:
  replicaCount: 1

  image:
    repository: shop-manager-backend
    tag: clean-roles
    pullPolicy: IfNotPresent

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: shop-manager-frontend
    tag: localStorage-token-fix
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    targetPort: 80
    nodePort: 30080
  config:
    environment: production
    keycloakRealm: shop-manager
    keycloakClientId: shop-manager-frontend
    # These will be dynamically generated based on global.domain and global.appName
    apiBaseUrl: ""  # Will become https://api.{appName}.{domain}/api
    keycloakUrl: ""  # Will become https://auth.{appName}.{domain}
    logging:
      level: "debug"
      debugMode: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: []
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: "local-ca-issuer"
    hosts:
      - host: shop-manager.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: shop-manager-frontend-tls
        hosts:
          - shop-manager.local

nameOverride: ""
fullnameOverride: ""
service:
  type: NodePort
  port: 8081
  targetPort: 8081
  nodePort: 30081

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "local-ca-issuer"
  hosts:
    - host: api.shop-manager.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: shop-manager-backend-tls
      hosts:
        - api.shop-manager.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# TLS Certificate configuration
tls:
  enabled: true
  issuer: local-ca-issuer  # Options: letsencrypt-prod, letsencrypt-staging, selfsigned-issuer, local-ca-issuer
  email: admin@shop-manager.local
  # Automated local certificate installation for on-premise deployments
  localCertInstallation:
    enabled: true  # Enable automatic local certificate installation
    platforms:     # Platforms to install certificates on
      - macOS
      - linux
      - windows
    installMethods:
      macOS:
        keychain: true          # Install to system keychain
        trust: trustRoot        # Trust level: trustRoot, trustAsRoot
        browsers: [safari, chrome, firefox]  # Update browser certificate stores
      linux:
        systemStore: true       # Install to system certificate store
        updateCa: true         # Run update-ca-certificates
        browsers: [chrome, firefox]
      windows:
        certStore: true        # Install to Windows certificate store
        scope: LocalMachine    # LocalMachine or CurrentUser
        browsers: [chrome, firefox, edge]
    postInstall:
      showInstructions: true   # Show manual installation instructions
      verifyInstallation: true # Verify certificates are trusted
      restartServices: false   # Restart browser/services after installation

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 90
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 5

# Environment variables
env:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  SPRING_JPA_HIBERNATE_DDL_AUTO: none

# ConfigMap configuration
