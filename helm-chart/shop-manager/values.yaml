    adminUsername: ""  # Override in secrets
    adminPassword: ""  # Override in secrets

  minio:
    enabled: true
    endpoint: "http://shop-manager-minio:9000"
    accessKey: "shopmanager"
    secretKey: "Min1o!SecureK3y2024#"
    bucket: "shop-manager-backups"

  email:
