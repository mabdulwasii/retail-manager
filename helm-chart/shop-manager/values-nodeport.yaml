replicaCount: 1

image:
  repository: shop-manager
  tag: latest
  pullPolicy: IfNotPresent

frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: shop-manager-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3000
    targetPort: 80
    nodePort: 30001
  config:
    environment: development
    keycloakRealm: shop-manager
    keycloakClientId: shop-manager-frontend
    apiBaseUrl: "http://localhost:30081/api"
    keycloakUrl: "http://localhost:30080"
  ingress:
    enabled: false

nameOverride: ""
fullnameOverride: ""

service:
  type: NodePort
  port: 8081
  targetPort: 8081
  nodePort: 30081

# Backend API Ingress - disabled
ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

env:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus

configMap:
  data: {}

secrets:
  data: {}

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: postgres
    username: shop
    password: shop
    database: shopdb
  primary:
    persistence:
      enabled: true
      size: 2Gi
    service:
      type: NodePort
      nodePorts:
        postgresql: 30432

# Kafka configuration
kafka:
  enabled: true
  auth:
    clientProtocol: PLAINTEXT
  listeners:
    client:
      protocol: PLAINTEXT
  service:
    type: NodePort
    nodePorts:
      client: 30092

# Keycloak configuration
keycloak:
  enabled: true
  auth:
    adminUser: admin
    adminPassword: admin
  postgresql:
    enabled: true
    auth:
      postgresPassword: postgres
      username: keycloak
      password: keycloak
      database: keycloak
  service:
    type: NodePort
    port: 8080
    targetPort: 8080
    nodePort: 30080
  extraEnvVars:
    - name: KC_HOSTNAME_PORT
      value: "30080"
    - name: KC_HTTP_PORT
      value: "8080"
    - name: KC_HOSTNAME
      value: "localhost"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HTTP_RELATIVE_PATH
      value: "/"
    - name: KC_PROXY
      value: "edge"

# Configuration
config:
  backup:
    path: "/var/shop-manager/backups"
  monitoring:
    exposedEndpoints: "health,info,metrics,prometheus"
  audit:
    enabled: true
    retentionDays: 90
  security:
    tenantIsolation: true
  keycloak:
    realm: "shop-manager"
    clientId: "shop-manager-backend"
    authServerUrl: "http://localhost:30080"
    issuerUri: "http://localhost:30080/realms/shop-manager"
    jwkSetUri: "http://localhost:30080/realms/shop-manager/protocol/openid-connect/certs"

features:
  investment:
    enabled: true
  analytics:
    enabled: true
  fraud:
    enabled: false