apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme-shop-manager
  namespace: shop-manager
data:
  theme.properties: |
    parent=keycloak
    import=common/keycloak
    styles=css/shop-manager.css
    kcHtmlClass=login-pf
    locales=en
  template.ftl: |
    <#macro registrationLayout bodyClass="" displayInfo=false displayMessage=true displayRequiredFields=false showAnotherWayIfPresent=true>
    <!DOCTYPE html>
    <html class="${properties.kcHtmlClass!}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="robots" content="noindex, nofollow">
        <title>${msg("loginTitle",(realm.displayName!''))}</title>
        <link rel="icon" href="${url.resourcesPath}/img/favicon.ico" />
        <#if properties.styles?has_content>
            <#list properties.styles?split(' ') as style>
                <link href="${url.resourcesPath}/${style}" rel="stylesheet" />
            </#list>
        </#if>
    </head>
    <body class="${properties.kcBodyClass!}">
    <div class="${properties.kcLoginClass!}">
        <div class="${properties.kcFormCardClass!} card-pf">
            <header class="${properties.kcFormHeaderClass!} card-pf-title">
                <#nested "header">
            </header>
            <div class="${properties.kcFormCardBodyClass!} card-pf-body">
                <#if displayMessage && message?has_content>
                    <div class="alert alert-${message.type}">
                        <span>${kcSanitize(message.summary)?no_esc}</span>
                    </div>
                </#if>
                <#nested "form">
                <#if displayInfo>
                    <div class="${properties.kcFormOptionsWrapperClass!}">
                        <#nested "info">
                    </div>
                </#if>
            </div>
            <div class="card-pf-footer">
                <#nested "footer">
            </div>
        </div>
    </div>
    </body>
    </html>
    </#macro>