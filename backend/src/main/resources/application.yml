spring:
  application:
    name: ${SPRING_APPLICATION_NAME:shop-manager}


  jackson:
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    time-zone: Africa/Lagos
    date-format: yyyy-MM-dd'T'HH:mm:ss

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopdb}
    username: ${SPRING_DATASOURCE_USERNAME:shop}
    # SECURITY: Use secure password - override in production environments
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        jdbc:
          time_zone: ${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE:Africa/Lagos}
          batch_size: 0
        order_inserts: false
        order_updates: false
    show-sql: ${SPRING_JPA_SHOW_SQL:false}

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/shop-manager}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/shop-manager/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: ${SPRING_KAFKA_PRODUCER_KEY_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      value-serializer: ${SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER:org.springframework.kafka.support.serializer.JsonSerializer}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:shop-manager}
      key-deserializer: ${SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      value-deserializer: ${SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER:org.springframework.kafka.support.serializer.JsonDeserializer}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      properties:
        spring.json.trusted.packages: ${SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED_PACKAGES:com.princely.shopmanager.*}

  modulith:
    events:
      jdbc:
        enabled: ${SPRING_MODULITH_EVENTS_JDBC_ENABLED:true}
    republish-outstanding-events-on-restart: ${SPRING_MODULITH_REPUBLISH_OUTSTANDING_EVENTS:true}

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:always}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}
  shutdown: ${SERVER_SHUTDOWN:graceful}
  tomcat:
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:20000}
    max-threads: ${SERVER_TOMCAT_MAX_THREADS:200}
    min-spare-threads: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus,modulith}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
  metrics:
    export:
      prometheus:
        enabled: ${MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:true}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.princely.shopmanager: ${LOGGING_LEVEL_COM_PRINCELY_SHOPMANAGER:DEBUG}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    # Suppress harmless Tomcat EOFException from health checks and connection closures
    org.apache.coyote.http11.Http11Processor: ${LOGGING_LEVEL_TOMCAT_HTTP:INFO}
    org.apache.tomcat.util.net.NioEndpoint: ${LOGGING_LEVEL_TOMCAT_NIO:INFO}
  pattern:
    console: ${LOGGING_PATTERN_CONSOLE:%d{yyyy-MM-dd HH:mm:ss} - %msg%n}

app:
  keycloak:
    realm: ${KEYCLOAK_REALM:shop-manager}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
    client-id: ${KEYCLOAK_CLIENT_ID:shop-manager-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

  features:
    investment:
      enabled: ${FEATURE_INVESTMENT_ENABLED:true}
      profit-calculation:
        default-margin: ${INVESTMENT_DEFAULT_MARGIN:0.30}
        distribution-frequency: ${INVESTMENT_DISTRIBUTION_FREQUENCY:MONTHLY}
    analytics:
      enabled: ${FEATURE_ANALYTICS_ENABLED:true}
      cache-duration-hours: ${ANALYTICS_CACHE_DURATION:1}
      enable-real-time: ${ANALYTICS_REAL_TIME:false}
    fraud:
      enabled: ${FEATURE_FRAUD_ENABLED:false}
      auto-block-critical: ${FRAUD_AUTO_BLOCK_CRITICAL:true}
      review-timeout-hours: ${FRAUD_REVIEW_TIMEOUT:24}
    receipts:
      auto-generate: ${RECEIPTS_AUTO_GENERATE:true}
      template-engine: ${RECEIPTS_TEMPLATE_ENGINE:TEXT}
      print-format: ${RECEIPTS_PRINT_FORMAT:48_CHAR}

  storage:
    backup-path: ${STORAGE_BACKUP_PATH:/var/shop-manager/backups}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      # SECURITY: Use secure credentials - override in production environments
      access-key: ${MINIO_ACCESS_KEY:shopmanager}
      secret-key: ${MINIO_SECRET_KEY:Min1o!SecureK3y2024#}
      bucket: ${MINIO_BUCKET:shop-manager}

  audit:
    enabled: ${AUDIT_ENABLED:true}
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    log-entity-changes: ${AUDIT_LOG_ENTITY_CHANGES:true}
    log-security-events: ${AUDIT_LOG_SECURITY_EVENTS:true}
    backup-to-filesystem: ${AUDIT_BACKUP_FILESYSTEM:true}

  security:
    tenant-isolation: ${SECURITY_TENANT_ISOLATION:true}
    permission-caching: ${SECURITY_PERMISSION_CACHING:true}
    session-timeout-minutes: ${SECURITY_SESSION_TIMEOUT:30}

  scheduler:
    profit-distribution:
      enabled: ${SCHEDULER_PROFIT_DISTRIBUTION:true}
      monthly-day: ${SCHEDULER_MONTHLY_DAY:1}
      monthly-hour: ${SCHEDULER_MONTHLY_HOUR:2}
    cache-cleanup:
      enabled: ${SCHEDULER_CACHE_CLEANUP:true}
      interval-hours: ${SCHEDULER_CACHE_CLEANUP_INTERVAL:6}
    audit-cleanup:
      enabled: ${SCHEDULER_AUDIT_CLEANUP:true}
      interval-days: ${SCHEDULER_AUDIT_CLEANUP_INTERVAL:7}

  swagger:
    title: ${SWAGGER_TITLE:Shop Manager API}
    description: ${SWAGGER_DESCRIPTION:Comprehensive API for Shop Manager - A multi-tenant retail management platform with investment tracking, fraud detection, and analytics}
    version: ${SWAGGER_VERSION:1.0.0}
    contact:
      name: ${SWAGGER_CONTACT_NAME:Shop Manager Development Team}
      email: ${SWAGGER_CONTACT_EMAIL:dev@shopmanager.com}
      url: ${SWAGGER_CONTACT_URL:https://shopmanager.com}
    security:
      enabled: ${SWAGGER_SECURITY_ENABLED:false}
      username: ${SWAGGER_SECURITY_USERNAME:swagger-admin}
      # SECURITY: Use secure password - override in production environments
      password: ${SWAGGER_SECURITY_PASSWORD:Sw@gg3r!SecureP@ss2024#}

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
  show-actuator: false
  packages-to-scan: com.princely.shopmanager
  paths-to-match: /api/**
