spring:
  application:
    name: shop-manager

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopdb}
    username: ${SPRING_DATASOURCE_USERNAME:shop}
    password: ${SPRING_DATASOURCE_PASSWORD:shop}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/shop-manager}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/shop-manager/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: shop-manager
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.princely.shopmanager.*"

  modulith:
    events:
      jdbc:
        enabled: true
    republish-outstanding-events-on-restart: true

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.princely.shopmanager: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'

app:
  keycloak:
    realm: ${KEYCLOAK_REALM:shop-manager}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
    client-id: ${KEYCLOAK_CLIENT_ID:shop-manager-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

  features:
    investment:
      enabled: ${FEATURE_INVESTMENT_ENABLED:true}
      profit-calculation:
        default-margin: ${INVESTMENT_DEFAULT_MARGIN:0.30}
        distribution-frequency: ${INVESTMENT_DISTRIBUTION_FREQUENCY:MONTHLY}
    analytics:
      enabled: ${FEATURE_ANALYTICS_ENABLED:true}
      cache-duration-hours: ${ANALYTICS_CACHE_DURATION:1}
      enable-real-time: ${ANALYTICS_REAL_TIME:false}
    fraud:
      enabled: ${FEATURE_FRAUD_ENABLED:false}
      auto-block-critical: ${FRAUD_AUTO_BLOCK_CRITICAL:true}
      review-timeout-hours: ${FRAUD_REVIEW_TIMEOUT:24}
    receipts:
      auto-generate: ${RECEIPTS_AUTO_GENERATE:true}
      template-engine: ${RECEIPTS_TEMPLATE_ENGINE:TEXT}
      print-format: ${RECEIPTS_PRINT_FORMAT:48_CHAR}

  storage:
    backup-path: ${STORAGE_BACKUP_PATH:/var/shop-manager/backups}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:shop-manager}

  audit:
    enabled: ${AUDIT_ENABLED:true}
    retention-days: ${AUDIT_RETENTION_DAYS:90}
    log-entity-changes: ${AUDIT_LOG_ENTITY_CHANGES:true}
    log-security-events: ${AUDIT_LOG_SECURITY_EVENTS:true}
    backup-to-filesystem: ${AUDIT_BACKUP_FILESYSTEM:true}

  security:
    tenant-isolation: ${SECURITY_TENANT_ISOLATION:true}
    permission-caching: ${SECURITY_PERMISSION_CACHING:true}
    session-timeout-minutes: ${SECURITY_SESSION_TIMEOUT:30}

  scheduler:
    profit-distribution:
      enabled: ${SCHEDULER_PROFIT_DISTRIBUTION:true}
      monthly-day: ${SCHEDULER_MONTHLY_DAY:1}
      monthly-hour: ${SCHEDULER_MONTHLY_HOUR:2}
    cache-cleanup:
      enabled: ${SCHEDULER_CACHE_CLEANUP:true}
      interval-hours: ${SCHEDULER_CACHE_CLEANUP_INTERVAL:6}
    audit-cleanup:
      enabled: ${SCHEDULER_AUDIT_CLEANUP:true}
      interval-days: ${SCHEDULER_AUDIT_CLEANUP_INTERVAL:7}

  swagger:
    title: ${SWAGGER_TITLE:Shop Manager API}
    description: ${SWAGGER_DESCRIPTION:Comprehensive API for Shop Manager - A multi-tenant retail management platform with investment tracking, fraud detection, and analytics}
    version: ${SWAGGER_VERSION:1.0.0}
    contact:
      name: ${SWAGGER_CONTACT_NAME:Shop Manager Development Team}
      email: ${SWAGGER_CONTACT_EMAIL:dev@shopmanager.com}
      url: ${SWAGGER_CONTACT_URL:https://shopmanager.com}
    security:
      enabled: ${SWAGGER_SECURITY_ENABLED:true}
      username: ${SWAGGER_SECURITY_USERNAME:swagger-admin}
      password: ${SWAGGER_SECURITY_PASSWORD:swagger-secure-2024}

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    groups-order: ASC
    operations-sorter: method
    disable-swagger-default-url: true
  show-actuator: true
  group-configs:
    - group: 'shop-management'
      display-name: 'Shop Management APIs'
      paths-to-match: '/api/shops/**'
    - group: 'product-management'
      display-name: 'Product Management APIs'
      paths-to-match: '/api/products/**'
    - group: 'sales-management'
      display-name: 'Sales Management APIs'
      paths-to-match:
        - '/api/sales/**'
        - '/api/receipts/**'
    - group: 'investment-management'
      display-name: 'Investment Management APIs'
      paths-to-match: '/api/investments/**'
    - group: 'analytics'
      display-name: 'Analytics & Reporting APIs'
      paths-to-match: '/api/analytics/**'
    - group: 'user-management'
      display-name: 'User Management APIs'
      paths-to-match:
        - '/api/users/**'
        - '/api/roles/**'
    - group: 'admin'
      display-name: 'Administration APIs'
      paths-to-match:
        - '/api/admin/**'
        - '/api/feature-flags/**'
        - '/api/audit/**'