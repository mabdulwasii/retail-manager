spring:
  # Embedded PostgreSQL Configuration
  # DataSource is auto-configured by EmbeddedPostgreSQLConfig

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Configuration - ENABLED for embedded mode (PostgreSQL migrations work as-is)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # Security Configuration (Local JWT)
  security:
    oauth2:
      resourceserver:
        jwt:
          enabled: false

  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Kafka Disabled (Using Spring Events)
  kafka:
    enabled: false

  # Spring Modulith - JDBC events enabled (PostgreSQL supports it)
  modulith:
    events:
      jdbc:
        enabled: true
    republish-outstanding-events-on-restart: true

# Embedded PostgreSQL Configuration
embedded:
  postgres:
    port: 5433
    data-dir: ./data/postgres
    database: shopmanager

# App Configuration
app:
  keycloak:
    enabled: false

  # Local JWT Configuration
  jwt:
    secret: ${JWT_SECRET:changeThisToASecureRandomGeneratedSecretKeyForProductionUseAtLeast256BitsLong}

# Application Configuration
application:
  mode: embedded

  # Disable Keycloak for embedded mode (uses local JWT auth instead)
  keycloak:
    enabled: false

  # Embedded JWT Configuration
  jwt:
    secret: ${JWT_SECRET:changeThisToASecureRandomGeneratedSecretKeyForProductionUseAtLeast256BitsLong}
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days
    issuer: retailhq-embedded

  # Local Storage Configuration
  storage:
    type: filesystem
    location: ${STORAGE_PATH:./data/uploads}
    max-file-size: 10485760  # 10 MB
    allowed-extensions: jpg,jpeg,png,pdf,csv,xlsx

  # Cloud Sync & Registration Configuration
  cloud:
    # Cloud aggregator registration URL
    registration-url: ${CLOUD_REGISTRATION_URL:https://api.retailhq.app}

    # Enforce cloud sync before transactions (recommended: true for production)
    sync-required: ${CLOUD_SYNC_REQUIRED:false}

    # Allow offline mode (transactions without cloud sync)
    # Set to true for testing, false for production
    allow-offline-mode: ${CLOUD_ALLOW_OFFLINE:true}

    # Scheduled sync cron expression (default: hourly at minute 0)
    sync-cron: ${CLOUD_SYNC_CRON:0 0 * * * ?}

    # Batch size for syncing transactions (prevents overwhelming cloud API)
    # After weeks offline, this limits each sync batch to max 1000 transactions
    sync-batch-size: ${CLOUD_SYNC_BATCH_SIZE:1000}

  # API Key Encryption
  encryption:
    secret: ${ENCRYPTION_SECRET:changeme-encryption-secret-key}
    salt: ${ENCRYPTION_SALT:deadbeef}

  # mDNS Configuration (Local Network Discovery)
  mdns:
    # Enable mDNS service publishing for .local domain resolution
    enabled: ${MDNS_ENABLED:true}

    # Hostname for mDNS (must end with .local for mDNS to work)
    # Examples: shopmanager.local, myshop.local, downtown-store.local
    hostname: ${SHOP_HOSTNAME:shopmanager.local}

    # Service name displayed in network discovery
    service-name: ${SHOP_NAME:Shop Manager}

  # Frontend Configuration
  frontend:
    # Frontend port (used by mDNS publisher)
    port: ${FRONTEND_PORT:3001}

  # Update Notification Configuration
  update-check:
    # Enable automatic update checking
    enabled: ${UPDATE_CHECK_ENABLED:true}

    # Cron expression for scheduled update checks (default: every 24 hours at midnight)
    cron: ${UPDATE_CHECK_CRON:0 0 */24 * * ?}

  # Cloud API URL for version checking and sync
  cloud-api-url: ${CLOUD_API_URL:https://api.retailhq.app}

  # Application Version (should match pom.xml version)
  version: ${APP_VERSION:1.0.0}

  # GitHub Releases URL for download links
  github-releases-url: ${GITHUB_RELEASES_URL:https://github.com/mabdulwasii/retail-manager/releases}

  # Bootstrap Configuration
  bootstrap:
    # Tenant Bootstrap
    tenant:
      enabled: ${BOOTSTRAP_TENANT_ENABLED:true}
      name: ${DEFAULT_TENANT_NAME:Default Organization}
      email: ${DEFAULT_TENANT_EMAIL:contact@retailhq.local}
      address: ${DEFAULT_TENANT_ADDRESS:123 Main Street}
      city: ${DEFAULT_TENANT_CITY:Springfield}
      country: ${DEFAULT_TENANT_COUNTRY:USA}

    # Shop Bootstrap
    shop:
      enabled: ${BOOTSTRAP_SHOP_ENABLED:true}
      name: ${DEFAULT_SHOP_NAME:Main Shop}
      address: ${DEFAULT_SHOP_ADDRESS:123 Main Street}
      city: ${DEFAULT_SHOP_CITY:Springfield}
      country: ${DEFAULT_SHOP_COUNTRY:USA}
      phone: ${DEFAULT_SHOP_PHONE:1-800-000-0000}
      email: ${DEFAULT_SHOP_EMAIL:shop@retailhq.local}

    # Super Admin Bootstrap
    superadmin:
      enabled: ${BOOTSTRAP_SUPERADMIN_ENABLED:true}
      username: ${SUPERADMIN_USERNAME:superadmin}
      email: ${SUPERADMIN_EMAIL:superadmin@retailhq.local}
      firstname: ${SUPERADMIN_FIRSTNAME:Super}
      lastname: ${SUPERADMIN_LASTNAME:Admin}
      phonenumber: ${SUPERADMIN_PHONE:1-000-000-0000}
      password: ${SUPERADMIN_PASSWORD:changeme}

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  address: 0.0.0.0
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json

# Logging Configuration
logging:
  level:
    root: INFO
    com.princely.shopmanager: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  file:
    name: ./logs/shop-manager.log
    max-size: 10MB
    max-history: 7
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Actuator Info
info:
  app:
    name: RetailHQ Desktop
    version: ${APP_VERSION:1.0.0}
    environment: ${APP_ENVIRONMENT:embedded}
    description: RetailHQ - Your Retail Headquarters
    vendor: RetailHQ.app
    domain: retailhq.app
    cloud-api: https://api.retailhq.app
