# Development Profile Configuration
# This file contains settings specific to development environment

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/shopdb}
    username: ${SPRING_DATASOURCE_USERNAME:shop}
    password: ${SPRING_DATASOURCE_PASSWORD:P@ssw0rd!2024#Shop}

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/shop-manager}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8090/realms/shop-manager/protocol/openid-connect/certs}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}

  # Dev tools configuration
  devtools:
    restart:
      enabled: ${DEVTOOLS_RESTART_ENABLED:true}
    livereload:
      enabled: ${DEVTOOLS_LIVERELOAD_ENABLED:true}
keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8090}
  realm: ${KEYCLOAK_REALM:shop-manager}
  admin:
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:Adm1n!SecureP@ss2024}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:DEBUG}
    com.princely.shopmanager: ${LOGGING_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:DEBUG}
    org.springframework.web: ${LOGGING_LEVEL_WEB:DEBUG}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOGGING_LEVEL_SQL_PARAMS:TRACE}

app:
  system:
    debug-mode: ${APP_SYSTEM_DEBUG_MODE:true}

  features:
    swagger-ui-enabled: ${SWAGGER_UI_ENABLED:true}

  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

  keycloak:
    enabled: false
    realm: ${KEYCLOAK_REALM:shop-manager}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8090}
    client-id: ${KEYCLOAK_CLIENT_ID:shop-manager-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}

# Dev tools configuration
