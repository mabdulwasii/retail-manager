# General Error Messages
errors.internal=An internal server error occurred. Please try again later.
errors.validation=The request contains invalid data. Please check your input and try again.
errors.unauthorized=You are not authorized to access this resource. Please log in.
errors.access.denied=You don't have permission to access this resource.
errors.not.found=The requested resource was not found.

