# Test configuration to enable all features for comprehensive testing
app.features.analytics.enabled=true
app.features.investment.enabled=true
app.features.fraud.enabled=true

# Test database configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway migrations in tests - use JPA entity structure instead
spring.flyway.enabled=false

# Security configuration for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/shopmanager

# Logging configuration for tests
logging.level.com.princely.shopmanager=INFO
logging.level.org.springframework.security=DEBUG