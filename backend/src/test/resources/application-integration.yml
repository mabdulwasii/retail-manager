spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///testdb?TC_TMPFS=/testtmpfs:rw
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  main:
    allow-bean-definition-overriding: true

  modulith:
    events:
      enabled: false
    detection:
      enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/test
          jwk-set-uri: http://localhost:8080/realms/test/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: localhost:9999

# Explicitly disable all optional features for integration tests
app:
  features:
    analytics:
      enabled: false
    investment:
      enabled: false
    fraud:
      enabled: false
  security:
    tenant-isolation: false
  scheduler:
    profit-distribution:
      enabled: false
    cache-cleanup:
      enabled: false
    audit-cleanup:
      enabled: false

logging:
  level:
    com.princely.shopmanager: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE