spring:
  datasource:
    # URL, username, password, and driver are set dynamically by @DynamicPropertySource in AbstractIntegrationTest
    hikari:
      maximum-pool-size: 5        # Reduced from 10 for test environment
      minimum-idle: 1             # Reduced from 2
      max-lifetime: 300000        # 5 minutes
      connection-timeout: 10000   # 10 seconds
      leak-detection-threshold: 60000  # 60 seconds - detect connection leaks

  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: false
    validate-on-migrate: false  # Disable validation to avoid Flyway 10.x cleanOnValidationError issue

  # OAuth2 JWT validation disabled for tests - TestSecurityConfig permits all requests
  # security:
  #   oauth2:
  #     resourceserver:
  #       jwt:
  #         issuer-uri: http://localhost:8080/realms/test
  #         jwk-set-uri: http://localhost:8080/realms/test/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: localhost:9092

# Application-specific configuration
app:
  features:
    analytics:
      enabled: true
    investment:
      enabled: true
    fraud:
      enabled: true

  security:
    tenant-isolation: false  # Disable for testing flexibility

  bootstrap:
    superadmin:
      enabled: false  # Disable bootstrap in tests - test-data.sql handles user creation

  keycloak:
    enabled: false  # Disable Keycloak for tests
    realm: test
    auth-server-url: http://localhost:8080
    client-id: test-client
    client-secret: test-secret

# Logging - Minimal verbosity for test execution
logging:
  level:
    root: WARN
    com.princely.shopmanager: WARN
    org.springframework: ERROR
    org.springframework.security: ERROR
    org.springframework.web: ERROR
    org.hibernate: ERROR
    org.hibernate.SQL: ERROR
    org.testcontainers: ERROR
    com.github.dockerjava: ERROR
    org.flywaydb: ERROR
    org.springframework.jdbc: ERROR
    org.springframework.test: ERROR
