spring:
  datasource:
    # URL, username, password, and driver are set dynamically by @DynamicPropertySource in AbstractIntegrationTest
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/test
          jwk-set-uri: http://localhost:8080/realms/test/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: localhost:9092

# Application-specific configuration
app:
  features:
    analytics:
      enabled: true
    investment:
      enabled: true
    fraud:
      enabled: true

  security:
    tenant-isolation: false  # Disable for testing flexibility

  bootstrap:
    superadmin:
      enabled: false  # Disable bootstrap in tests - test-data.sql handles user creation

  keycloak:
    enabled: false  # Disable Keycloak for tests
    realm: test
    auth-server-url: http://localhost:8080
    client-id: test-client
    client-secret: test-secret

# Logging
logging:
  level:
    root: INFO
    com.princely.shopmanager: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.testcontainers: INFO
    com.github.dockerjava: WARN
    org.flywaydb: INFO
