# ============================================================================
# Shop Manager Backend - SonarQube Configuration
# ============================================================================

# Project identification
sonar.projectKey=princely-org_retail-manager_backend
sonar.projectName=Retail Manager - Backend
sonar.projectVersion=0.0.46
# Organization will be provided via GitHub Actions secrets or command line
# sonar.organization=${SONAR_ORGANIZATION}

# Source and test directories
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports

# Exclusions - Configuration and generated code
sonar.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/domain/**,\
  **/constants/**,\
  **/*Application.java,\
  **/generated/**

# Test exclusions
sonar.test.exclusions=\
  **/*IT.java,\
  **/*Test.java

# Coverage exclusions - Don't require coverage for DTOs, config, etc.
sonar.coverage.exclusions=\
  **/config/**,\
  **/dto/**,\
  **/domain/**,\
  **/constants/**,\
  **/*Application.java,\
  **/generated/**

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Analysis parameters
sonar.java.source=21
sonar.java.target=21
sonar.sourceEncoding=UTF-8

# Disable SCM provider (git) for faster analysis
sonar.scm.disabled=false
sonar.scm.provider=git

# Verbose logging for debugging (can be removed in production)
sonar.verbose=false

# Additional settings for better analysis
sonar.java.coveragePlugin=jacoco
sonar.dynamicAnalysis=reuseReports
