global:
  appName: "retail"
  domain: "gomco.com"

# Image pull secrets for private GitHub Container Registry
imagePullSecrets:
  - name: regcred

# Backend configuration
backend:
  image:
    repository: princely/shop-manager
    tag: backend-v0.0.42
    pullPolicy: Always
  podAnnotations:
    configVersion: "29"  # Add getUserByEmail, explicit JWT mappers, require shopId, permanent passwords
  env:
    SWAGGER_SECURITY_ENABLED: "false"  # Disable Swagger authentication for public access

# Frontend configuration
frontend:
  enabled: true
  image:
    repository: princely/shop-manager
    tag: frontend-v0.0.7
    pullPolicy: Always

branding:
  platformName: "GOMCO Retail Pro"
  companyName: "GOMCO Corporation"
  platformDescription: "Advanced Retail Management System"
  colors:
    primary: "#2E7D32"
    secondary: "#FF6F00"

# Application configuration
application:
  testUsers:
    enabled: true  # Set to false to disable test user creation in Keycloak

# TLS Configuration
tls:
  enabled: true
  issuer: "local-ca-issuer"  # Use local-ca-issuer for local development
  email: "admin@gomco.com"
  localCertInstallation:
    enabled: true

# Disable existingSecret - let Helm create secrets
postgresql:
  auth:
    existingSecret: ""

minio:
  enabled: false
  auth:
    existingSecret: ""

kafka:
  enabled: false
  