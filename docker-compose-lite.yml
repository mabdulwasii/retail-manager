version: '3.8'

# ============================================================================
# RetailHQ Docker Compose Lite
# ============================================================================
# Lightweight deployment for local development and testing
# Runs RetailHQ in embedded mode without Keycloak, Kafka, or external dependencies
#
# Features:
# - Embedded PostgreSQL (no separate database container needed)
# - Local JWT authentication
# - Lightweight and fast startup
# - Perfect for Docker Desktop on Windows/macOS
#
# Usage:
#   docker-compose -f docker-compose-lite.yml up -d
#   docker-compose -f docker-compose-lite.yml logs -f retailhq
#   docker-compose -f docker-compose-lite.yml down
#
# Access:
#   Application: http://localhost:8081
#   Health: http://localhost:8081/actuator/health
#
# Default Credentials:
#   Username: superadmin
#   Password: changeme (customize with SUPERADMIN_PASSWORD env var)
# ============================================================================

services:
  # RetailHQ Backend (Embedded Mode)
  retailhq:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: retailhq-desktop
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: embedded

      # Application Branding
      APP_VERSION: 1.0.0
      APP_ENVIRONMENT: docker-lite

      # Cloud Sync Configuration
      CLOUD_REGISTRATION_URL: https://api.retailhq.app
      CLOUD_SYNC_REQUIRED: "false"
      CLOUD_ALLOW_OFFLINE: "true"

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-changeThisToASecureRandomGeneratedSecretKeyForProductionUseAtLeast256BitsLong}

      # Bootstrap Configuration
      BOOTSTRAP_TENANT_ENABLED: "true"
      DEFAULT_TENANT_NAME: ${TENANT_NAME:-My Retail Business}
      DEFAULT_TENANT_EMAIL: ${TENANT_EMAIL:-contact@retailhq.local}

      BOOTSTRAP_SHOP_ENABLED: "true"
      DEFAULT_SHOP_NAME: ${SHOP_NAME:-Main Store}
      DEFAULT_SHOP_EMAIL: ${SHOP_EMAIL:-shop@retailhq.local}

      BOOTSTRAP_SUPERADMIN_ENABLED: "true"
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-changeme}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@retailhq.local}

      # Server Configuration
      SERVER_PORT: 8081

    ports:
      - "8081:8081"

    volumes:
      # Persistent data for embedded PostgreSQL
      - retailhq_data:/app/data
      # Persistent logs
      - retailhq_logs:/app/logs
      # Persistent uploads/receipts
      - retailhq_uploads:/app/uploads

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    restart: unless-stopped

    networks:
      - retailhq-network

    labels:
      com.retailhq.app: "desktop"
      com.retailhq.version: "1.0.0"
      com.retailhq.mode: "embedded"

volumes:
  retailhq_data:
    driver: local
    labels:
      com.retailhq.description: "RetailHQ embedded PostgreSQL data"

  retailhq_logs:
    driver: local
    labels:
      com.retailhq.description: "RetailHQ application logs"

  retailhq_uploads:
    driver: local
    labels:
      com.retailhq.description: "RetailHQ file uploads and receipts"

networks:
  retailhq-network:
    driver: bridge
    labels:
      com.retailhq.description: "RetailHQ internal network"

# ============================================================================
# Environment Variables (create .env file or export)
# ============================================================================
# JWT_SECRET=your-secure-256-bit-secret-key-here
# SUPERADMIN_PASSWORD=YourSecurePassword123!
# TENANT_NAME=Your Business Name
# TENANT_EMAIL=contact@yourbusiness.com
# SHOP_NAME=Your Shop Name
# SHOP_EMAIL=shop@yourbusiness.com
# ============================================================================
