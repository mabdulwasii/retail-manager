version: '3.8'

# ============================================================================
# Docker Compose Lite - Lightweight Standalone Deployment
# ============================================================================
# Memory footprint: ~1-1.5 GB (vs 2-3 GB for full cloud version)
# Use case: Customer laptops, low-memory environments, offline stores
# ============================================================================

services:
  # ==========================================================================
  # PostgreSQL Database (Lightweight)
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: shop-manager-postgres-lite
    environment:
      POSTGRES_DB: shopmanager
      POSTGRES_USER: shopmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop-network-lite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Backend Service (Embedded Mode)
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.lite
      args:
        JAR_FILE: target/shop-manager-*-embedded.jar
    container_name: shop-manager-backend-lite
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    environment:
      # Application Mode
      SPRING_PROFILES_ACTIVE: embedded

      # Server Configuration
      SERVER_PORT: 8081

      # Disable embedded PostgreSQL (use external container instead)
      EMBEDDED_POSTGRES_ENABLED: false

      # PostgreSQL Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopmanager
      SPRING_DATASOURCE_USERNAME: shopmanager
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shopmanager}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # JWT Authentication
      APPLICATION_JWT_SECRET: ${JWT_SECRET}
      APPLICATION_JWT_EXPIRATION_MS: 86400000
      APPLICATION_JWT_REFRESH_EXPIRATION_MS: 604800000

      # File Storage
      APPLICATION_STORAGE_TYPE: filesystem
      APPLICATION_STORAGE_LOCATION: /app/data/uploads
      APPLICATION_STORAGE_MAX_FILE_SIZE: 10485760

      # Cloud Sync (optional)
      APPLICATION_SYNC_ENABLED: ${CLOUD_SYNC_ENABLED:-false}
      APPLICATION_SYNC_CLOUD_ENDPOINT: ${CLOUD_API_URL:-}
      APPLICATION_SYNC_API_KEY: ${CLOUD_API_KEY:-}
      APPLICATION_SYNC_STORE_ID: ${STORE_ID:-}
      APPLICATION_SYNC_SCHEDULE_CRON: ${SYNC_CRON:-0 0 * * * ?}
      APPLICATION_SYNC_PRIVACY_ANONYMIZE_PII: ${ANONYMIZE_PII:-false}

      # JVM Memory Settings (optimized for low memory)
      JAVA_OPTS: >-
        -Xms256m
        -Xmx512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
    volumes:
      - uploads_data:/app/data/uploads
      - logs_data:/app/logs
    networks:
      - shop-network-lite
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ==========================================================================
  # Frontend Service (Static Build)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.lite
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8081}/api
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
        VITE_APP_ENVIRONMENT: standalone
    container_name: shop-manager-frontend-lite
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8081}/api
      VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
      VITE_APP_ENVIRONMENT: standalone
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shop-network-lite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  shop-network-lite:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local
