version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shop-manager-postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shopdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: shop-manager-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: shop
      KC_DB_PASSWORD: shop
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8443
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/localhost.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/localhost.key
      KC_HEALTH_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /
      KC_PROXY: edge
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8443:8443"
      - "8080:8080"
    volumes:
      - ./docker/keycloak-realm.json:/tmp/keycloak-realm.json:ro
      - ./docker/certs/localhost.crt:/opt/keycloak/conf/localhost.crt:ro
      - ./docker/certs/localhost.key:/opt/keycloak/conf/localhost.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloak-init:
    image: curlimages/curl:8.5.0
    container_name: shop-manager-keycloak-init
    volumes:
      - ./docker/keycloak-realm.json:/tmp/keycloak-realm.json:ro
      - ./docker/keycloak-init.sh:/tmp/keycloak-init.sh:ro
    command: ["/bin/sh", "/tmp/keycloak-init.sh"]
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - shop-network
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: shop-manager-kafka
    user: root  # Fix permission issues
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'  # Use standard directory
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # Format storage on startup
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9093:9093"
      - "9102:9101"
    networks:
      - shop-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: shop-manager-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shop-manager-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopdb
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: shop
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_FLYWAY_ENABLED: false
      KEYCLOAK_AUTH_SERVER_URL: https://keycloak:8443
      KEYCLOAK_ISSUER_URI: https://keycloak:8443/realms/shop-manager
      KEYCLOAK_JWK_SET_URI: https://keycloak:8443/realms/shop-manager/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - shop-network

  # Frontend service - now enabled with TypeScript errors resolved
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8081/api
        VITE_KEYCLOAK_URL: https://localhost:8443
        VITE_KEYCLOAK_REALM: shop-manager
        VITE_KEYCLOAK_CLIENT_ID: shop-manager-frontend
    container_name: shop-manager-frontend
    ports:
      - "3001:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8081/api
      VITE_KEYCLOAK_URL: https://localhost:8443
      VITE_KEYCLOAK_REALM: shop-manager
      VITE_KEYCLOAK_CLIENT_ID: shop-manager-frontend
      VITE_APP_VERSION: "1.0.0"
      VITE_APP_ENVIRONMENT: development
    depends_on:
      backend:
        condition: service_started
    networks:
      - shop-network
    restart: unless-stopped

  # SonarQube for code quality analysis
  sonarqube:
    image: sonarqube:10.4-community
    container_name: shop-manager-sonarqube
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "9090:9000"
    networks:
      - shop-network
    restart: unless-stopped
    profiles:
      - sonar

  sonarqube-db:
    image: postgres:15-alpine
    container_name: shop-manager-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_postgresql_data:/var/lib/postgresql/data
    networks:
      - shop-network
    restart: unless-stopped
    profiles:
      - sonar

networks:
  shop-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  minio_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_postgresql_data: