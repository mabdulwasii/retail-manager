spec:
  template:
    spec:
      volumes:
      - name: theme-properties
        configMap:
          name: shop-manager-keycloak-theme
          items:
          - key: theme.properties
            path: theme.properties
      - name: theme-login-ftl
        configMap:
          name: shop-manager-keycloak-theme
          items:
          - key: login.ftl
            path: login.ftl
      - name: theme-css
        configMap:
          name: shop-manager-keycloak-theme
          items:
          - key: shop-manager.css
            path: shop-manager.css
      containers:
      - name: keycloak
        volumeMounts:
        - name: theme-properties
          mountPath: /opt/keycloak/themes/shop-manager/login/theme.properties
          subPath: theme.properties
        - name: theme-login-ftl
          mountPath: /opt/keycloak/themes/shop-manager/login/login.ftl
          subPath: login.ftl
        - name: theme-css
          mountPath: /opt/keycloak/themes/shop-manager/login/resources/css/shop-manager.css
          subPath: shop-manager.css