# ============================================================================
# Shop Manager - Customer Installation Values
# ============================================================================
#
# This file contains all customizable settings for your Shop Manager
# installation. Copy this file and modify the values below to match your
# organization's requirements.
#
# Quick Start:
#   1. Copy this file: cp customer-values.yaml my-company-values.yaml
#   2. Edit the values below (at minimum: global.domain and branding section)
#   3. Install: helm install retail oci://registry-1.docker.io/princely/shop-manager \
#               --version 0.0.45 -n gomco --create-namespace -f my-company-values.yaml
#
# Documentation: https://github.com/yourorg/shop-manager
# Support: https://github.com/yourorg/shop-manager/issues
# ============================================================================

# ============================================================================
# GLOBAL SETTINGS (Required)
# ============================================================================
global:
  # Application name - used as subdomain prefix
  # Example: If domain is "mycompany.com" and appName is "retail"
  # URLs will be: retail.mycompany.com, api.retail.mycompany.com
  appName: "retail"

  # Your company domain name
  # This will be used for all service URLs
  # IMPORTANT: For local installation, use a fake domain and add to /etc/hosts
  # Example: "mycompany.com" → Add "127.0.0.1 retail.mycompany.com" to /etc/hosts
  domain: "mycompany.com"

# ============================================================================
# IMAGE PULL SECRETS (Optional)
# ============================================================================
# Only needed if using private Docker registry
# For public images on Docker Hub, comment out this section
imagePullSecrets:
  - name: regcred

# To create regcred secret:
# kubectl create secret docker-registry regcred \
#   --docker-server=https://index.docker.io/v1/ \
#   --docker-username=<your-username> \
#   --docker-password=<your-password> \
#   --docker-email=<your-email> \
#   -n gomco

# ============================================================================
# BACKEND CONFIGURATION
# ============================================================================
backend:
  image:
    repository: princely/shop-manager
    # Backend version - update this when upgrading
    tag: backend-latest
    pullPolicy: Always

  # Pod annotations for configuration tracking
  podAnnotations:
    configVersion: "32"  # PATCH endpoints for all PUT endpoints

  # Environment-specific settings
  env:
    # Set to "false" for public Swagger access, "true" to require authentication
    SWAGGER_SECURITY_ENABLED: "false"

  # Resource limits (adjust based on your server capacity)
  # Uncomment and modify if needed:
  # resources:
  #   requests:
  #     memory: "1Gi"
  #     cpu: "500m"
  #   limits:
  #     memory: "2Gi"
  #     cpu: "1000m"

  # Autoscaling (for production deployments)
  # Uncomment to enable:
  # autoscaling:
  #   enabled: true
  #   minReplicas: 2
  #   maxReplicas: 10
  #   targetCPUUtilizationPercentage: 70

# ============================================================================
# FRONTEND CONFIGURATION
# ============================================================================
frontend:
  enabled: true
  image:
    repository: princely/shop-manager
    # Frontend version - update this when upgrading
    tag: frontend-latest
    pullPolicy: Always

  # Resource limits (adjust based on your needs)
  # Uncomment and modify if needed:
  # resources:
  #   requests:
  #     memory: "256Mi"
  #     cpu: "100m"
  #   limits:
  #     memory: "512Mi"
  #     cpu: "200m"

# ============================================================================
# BRANDING & CUSTOMIZATION
# ============================================================================
branding:
  # Platform name shown in UI (e.g., "Acme Retail Pro")
  platformName: "My Retail Platform"

  # Your company name
  companyName: "My Company Inc"

  # Platform description (shown on login page)
  platformDescription: "Advanced Retail Management System"

  # Brand colors (hex format)
  colors:
    # Primary brand color (buttons, headers)
    primary: "#2E7D32"

    # Secondary brand color (accents)
    secondary: "#FF6F00"

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================
application:
  # Test users - Set to false in production
  # When enabled, creates demo users in Keycloak on first install
  testUsers:
    enabled: true

# ============================================================================
# TLS/SSL CONFIGURATION
# ============================================================================
tls:
  # Enable HTTPS (recommended for production)
  enabled: true

  # Certificate issuer
  # Options:
  #   - "local-ca-issuer" (for local/development - uses self-signed certs)
  #   - "letsencrypt-prod" (for production - free SSL from Let's Encrypt)
  #   - "letsencrypt-staging" (for testing Let's Encrypt)
  issuer: "local-ca-issuer"

  # Email for Let's Encrypt notifications (required if using letsencrypt-*)
  email: "admin@mycompany.com"

  # Local certificate installation (for local-ca-issuer)
  # Automatically installs CA certificate to your system
  localCertInstallation:
    enabled: true

# ============================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# ============================================================================
# Uses Bitnami PostgreSQL chart
postgresql:
  # For production, use external PostgreSQL and disable this
  # enabled: false

  # Authentication (change these passwords!)
  auth:
    # Don't use existingSecret for automatic password generation
    existingSecret: ""

    # Or specify custom passwords:
    # postgresPassword: "change-me-super-secret-password"
    # password: "change-me-database-password"

  # Persistence
  # persistence:
  #   enabled: true
  #   size: 20Gi
  #   # Storage class (depends on your Kubernetes cluster)
  #   # storageClass: "standard"

# ============================================================================
# OBJECT STORAGE (MinIO)
# ============================================================================
minio:
  # Disable if using external S3/storage
  enabled: false

  auth:
    existingSecret: ""
    # rootUser: "admin"
    # rootPassword: "change-me-minio-password"

# ============================================================================
# MESSAGE QUEUE (Kafka)
# ============================================================================
kafka:
  # Disable if using external Kafka
  enabled: false

  # For production, enable and configure:
  # enabled: true
  # replicaCount: 3
  # persistence:
  #   size: 10Gi

# ============================================================================
# KEYCLOAK (Authentication)
# ============================================================================
# Keycloak configuration is managed by the chart
# Advanced customization available in main values.yaml

# ============================================================================
# ADVANCED OPTIONS
# ============================================================================

# Ingress customization
# ingress:
#   className: "nginx"
#   annotations:
#     cert-manager.io/cluster-issuer: "letsencrypt-prod"
#     nginx.ingress.kubernetes.io/proxy-body-size: "50m"

# Service type (for cloud load balancers)
# service:
#   type: LoadBalancer
#   annotations:
#     service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# Network policies (for enhanced security)
# networkPolicy:
#   enabled: true

# Pod security context
# podSecurityContext:
#   runAsNonRoot: true
#   runAsUser: 1000
#   fsGroup: 1000

# ============================================================================
# MONITORING & OBSERVABILITY
# ============================================================================

# Prometheus monitoring
# serviceMonitor:
#   enabled: true
#   interval: 30s

# Logging
# logging:
#   level: INFO
#   format: JSON

# ============================================================================
# BACKUP CONFIGURATION
# ============================================================================

# Automated database backups
# backup:
#   enabled: true
#   schedule: "0 2 * * *"  # Daily at 2 AM
#   retention: 7  # Keep 7 days
#   storage:
#     type: s3
#     s3:
#       bucket: "my-backups"
#       region: "us-east-1"

