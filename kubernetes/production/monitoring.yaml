apiVersion: v1
kind: ServiceMonitor
metadata:
  name: shop-manager-backend
  namespace: shop-manager-prod
  labels:
    app: shop-manager
    component: backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-manager
      app.kubernetes.io/component: backend
  endpoints:
  - port: http
    interval: 30s
    scrapeTimeout: 10s
    path: /actuator/prometheus
    scheme: http
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_label_version]
      targetLabel: version
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-manager-alerts
  namespace: shop-manager-prod
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: shop-manager.rules
    interval: 30s
    rules:
    # High Error Rate
    - alert: HighErrorRate
      expr: |
        sum(rate(http_server_requests_seconds_count{status=~"5..",namespace="shop-manager-prod"}[5m]))
        /
        sum(rate(http_server_requests_seconds_count{namespace="shop-manager-prod"}[5m])) > 0.05
      for: 5m
      labels:
        severity: warning
        component: backend
      annotations:
        summary: High error rate detected
        description: "Error rate is above 5% (current value: {{ $value | humanizePercentage }})"

    # High Response Time
    - alert: HighResponseTime
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_server_requests_seconds_bucket{namespace="shop-manager-prod"}[5m]))
          by (le, method, uri)
        ) > 2
      for: 5m
      labels:
        severity: warning
        component: backend
      annotations:
        summary: High response time detected
        description: "95th percentile response time is above 2s for {{ $labels.method }} {{ $labels.uri }}"

    # Pod Memory Usage
    - alert: HighMemoryUsage
      expr: |
        container_memory_usage_bytes{namespace="shop-manager-prod",container!=""}
        /
        container_spec_memory_limit_bytes{namespace="shop-manager-prod",container!=""} > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High memory usage detected
        description: "Pod {{ $labels.pod }} memory usage is above 90%"

    # Pod CPU Usage
    - alert: HighCPUUsage
      expr: |
        rate(container_cpu_usage_seconds_total{namespace="shop-manager-prod",container!=""}[5m]) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: High CPU usage detected
        description: "Pod {{ $labels.pod }} CPU usage is above 90%"

    # Database Connection Pool
    - alert: DatabaseConnectionPoolExhausted
      expr: |
        hikaricp_connections_active{namespace="shop-manager-prod"}
        /
        hikaricp_connections_max{namespace="shop-manager-prod"} > 0.9
      for: 5m
      labels:
        severity: critical
        component: database
      annotations:
        summary: Database connection pool nearly exhausted
        description: "Connection pool usage is above 90% ({{ $value | humanizePercentage }})"

    # Pod Restart
    - alert: PodRestartingTooOften
      expr: |
        rate(kube_pod_container_status_restarts_total{namespace="shop-manager-prod"}[15m]) > 0.5
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Pod restarting frequently
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

    # Keycloak Availability
    - alert: KeycloakDown
      expr: |
        up{job="shop-manager-keycloak",namespace="shop-manager-prod"} == 0
      for: 5m
      labels:
        severity: critical
        component: auth
      annotations:
        summary: Keycloak is down
        description: "Keycloak authentication service is not responding"

    # Kafka Lag
    - alert: KafkaConsumerLag
      expr: |
        kafka_consumer_lag_sum{namespace="shop-manager-prod"} > 1000
      for: 5m
      labels:
        severity: warning
        component: kafka
      annotations:
        summary: Kafka consumer lag detected
        description: "Kafka consumer lag is {{ $value }} for topic {{ $labels.topic }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: shop-manager-prod
  labels:
    grafana_dashboard: "1"
data:
  shop-manager-dashboard.json: |
    {
      "dashboard": {
        "title": "Shop Manager Production Dashboard",
        "panels": [
          {
            "title": "Request Rate",
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"shop-manager-prod\"}[5m])) by (status)"
              }
            ]
          },
          {
            "title": "Response Time (p95)",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=\"shop-manager-prod\"}[5m])) by (le))"
              }
            ]
          },
          {
            "title": "Active Users",
            "targets": [
              {
                "expr": "shop_manager_active_users{namespace=\"shop-manager-prod\"}"
              }
            ]
          },
          {
            "title": "Database Connections",
            "targets": [
              {
                "expr": "hikaricp_connections_active{namespace=\"shop-manager-prod\"}"
              }
            ]
          },
          {
            "title": "JVM Memory",
            "targets": [
              {
                "expr": "jvm_memory_used_bytes{namespace=\"shop-manager-prod\"}"
              }
            ]
          },
          {
            "title": "Pod CPU Usage",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"shop-manager-prod\"}[5m])"
              }
            ]
          }
        ]
      }
    }