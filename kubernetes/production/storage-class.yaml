apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: shop-manager-ssd
  labels:
    app: shop-manager
provisioner: kubernetes.io/gce-pd  # Change based on cloud provider
parameters:
  type: pd-ssd  # GKE: pd-ssd, EKS: gp3, AKS: managed-premium
  replication-type: regional-pd
  fstype: ext4
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: shop-manager-standard
  labels:
    app: shop-manager
provisioner: kubernetes.io/gce-pd  # Change based on cloud provider
parameters:
  type: pd-standard  # GKE: pd-standard, EKS: gp2, AKS: managed
  replication-type: regional-pd
  fstype: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer