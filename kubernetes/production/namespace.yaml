apiVersion: v1
kind: Namespace
metadata:
  name: shop-manager-prod
  labels:
    name: shop-manager-prod
    environment: production
    app: shop-manager
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-manager-quota
  namespace: shop-manager-prod
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-manager-limits
  namespace: shop-manager-prod
spec:
  limits:
  - max:
      cpu: "4"
      memory: 8Gi
    min:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 200m
      memory: 256Mi
    type: Container
  - max:
      storage: 100Gi
    min:
      storage: 1Gi
    type: PersistentVolumeClaim