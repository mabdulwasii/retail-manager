# Production Values for Shop Manager Helm Chart
# This file contains production-ready configurations for Kubernetes Engine deployment

# Global settings
global:
  environment: production
  domain: shop-manager.example.com  # CHANGE THIS to your domain
  cloudProvider: gcp  # Options: gcp, aws, azure

# Backend application configuration
replicaCount: 3

image:
  repository: gcr.io/your-project/shop-manager  # CHANGE THIS to your registry
  tag: 1.0.0  # Use specific version tags in production
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: gcr-secret  # For private registry authentication

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 3
  image:
    repository: gcr.io/your-project/shop-manager-frontend  # CHANGE THIS
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  config:
    environment: production
    apiBaseUrl: "https://api.shop-manager.example.com/api"  # CHANGE THIS
    keycloakUrl: "https://auth.shop-manager.example.com"  # CHANGE THIS
    keycloakRealm: shop-manager
    keycloakClientId: shop-manager-frontend
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Service configuration
service:
  type: ClusterIP
  port: 8081
  targetPort: 8081
  annotations:
    cloud.google.com/neg: '{"ingress": true}'  # For GKE
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For EKS

# Ingress configuration for production
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
  hosts:
    - host: api.shop-manager.example.com  # CHANGE THIS
      paths:
        - path: /
          pathType: Prefix
    - host: shop-manager.example.com  # CHANGE THIS (frontend)
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: shop-manager-tls
      hosts:
        - api.shop-manager.example.com  # CHANGE THIS
        - shop-manager.example.com  # CHANGE THIS

# Resource configuration for production
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60

# Node affinity for production workloads
nodeSelector:
  workload: production
  node.kubernetes.io/instance-type: n2-standard-4  # GKE example

# Tolerations for dedicated nodes
tolerations:
  - key: production
    operator: Equal
    value: "true"
    effect: NoSchedule

# Pod Anti-Affinity for high availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - shop-manager
        topologyKey: kubernetes.io/hostname
    - weight: 50
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - shop-manager
        topologyKey: topology.kubernetes.io/zone

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# Health probes with production settings
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

# PostgreSQL configuration for production
postgresql:
  enabled: true
  auth:
    postgresPassword: ${POSTGRES_ADMIN_PASSWORD}  # Use sealed secret
    username: shopmanager
    password: ${POSTGRES_PASSWORD}  # Use sealed secret
    database: shopmanager_prod
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: shop-manager-ssd
    resources:
      limits:
        memory: 4Gi
        cpu: 2000m
      requests:
        memory: 2Gi
        cpu: 1000m
    nodeSelector:
      workload: database
    podAntiAffinityPreset: hard
    extraEnvVars:
      - name: POSTGRESQL_MAX_CONNECTIONS
        value: "200"
      - name: POSTGRESQL_SHARED_BUFFERS
        value: "1GB"
      - name: POSTGRESQL_EFFECTIVE_CACHE_SIZE
        value: "3GB"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
      storage:
        size: 50Gi
        storageClass: shop-manager-standard

# Kafka configuration for production
kafka:
  enabled: true
  replicaCount: 3
  auth:
    clientProtocol: SASL_PLAINTEXT
    sasl:
      jaas:
        clientUsers:
          - shopmanager
        clientPasswords:
          - ${KAFKA_PASSWORD}  # Use sealed secret
  persistence:
    enabled: true
    size: 50Gi
    storageClass: shop-manager-ssd
  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 500m
  metrics:
    kafka:
      enabled: true
    jmx:
      enabled: true
    serviceMonitor:
      enabled: true
  zookeeper:
    enabled: true
    replicaCount: 3
    persistence:
      enabled: true
      size: 10Gi
      storageClass: shop-manager-ssd

# Keycloak configuration for production
keycloak:
  enabled: true
  production: true
  proxy: edge
  auth:
    adminUser: ${KEYCLOAK_ADMIN_USER}  # Use sealed secret
    adminPassword: ${KEYCLOAK_ADMIN_PASSWORD}  # Use sealed secret
  replicaCount: 2
  postgresql:
    enabled: true
    auth:
      postgresPassword: ${KEYCLOAK_DB_PASSWORD}  # Use sealed secret
      username: keycloak
      password: ${KEYCLOAK_DB_PASSWORD}  # Use sealed secret
      database: keycloak_prod
    primary:
      persistence:
        enabled: true
        size: 20Gi
        storageClass: shop-manager-ssd
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    hostname: auth.shop-manager.example.com  # CHANGE THIS
    tls: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
  resources:
    limits:
      memory: 2Gi
      cpu: 1000m
    requests:
      memory: 1Gi
      cpu: 500m
  nodeSelector:
    workload: production
  cache:
    enabled: true
    stackName: kubernetes
    stackFile: default

# Redis for caching (production)
redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true
    password: ${REDIS_PASSWORD}  # Use sealed secret
  master:
    persistence:
      enabled: true
      size: 10Gi
      storageClass: shop-manager-ssd
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m
  sentinel:
    enabled: true
    quorum: 2
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Application configuration for production
config:
  # Spring profile
  springProfile: "prod"

  # Database settings
  database:
    showSql: false
    formatSql: false
    poolSize: 50
    minIdle: 10
    connectionTimeout: 30000
    maxLifetime: 1800000
    leakDetectionThreshold: 60000

  # Timezone and locale
  timezone: "UTC"
  locale: "en_US"

  # Business rules
  business:
    defaultCurrency: "USD"
    defaultTaxRate: "0.075"
    maxReturnDays: 30
    minReorderPoint: 10

  # Security settings
  security:
    tenantIsolation: true
    permissionCaching: true
    sessionTimeoutMinutes: 30
    maxLoginAttempts: 5
    accountLockDurationMinutes: 30
    passwordMinLength: 12
    jwtExpirationHours: 8
    corsAllowedOrigins:
      - "https://shop-manager.example.com"
      - "https://api.shop-manager.example.com"

  # Audit configuration
  audit:
    enabled: true
    retentionDays: 365
    logEntityChanges: true
    logSecurityEvents: true
    logApiRequests: true

  # Backup configuration
  backup:
    enabled: true
    provider: gcs  # Options: gcs, s3, azure
    bucket: shop-manager-backups-prod
    path: "/backups"
    retentionDays: 90
    compressionEnabled: true
    encryptionEnabled: true
    scheduleCron: "0 2 * * *"

  # Cache settings
  cache:
    provider: redis
    defaultTtlMinutes: 60
    analyticsTtlHours: 1

  # Monitoring
  monitoring:
    exposedEndpoints: "health,info,metrics,prometheus"
    showHealthDetails: "when-authorized"
    prometheusEnabled: true
    datadogEnabled: false
    newRelicEnabled: false

  # Logging configuration
  logging:
    rootLevel: "WARN"
    appLevel: "INFO"
    securityLevel: "INFO"
    webLevel: "WARN"
    pattern: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

  # Keycloak settings
  keycloak:
    realm: "shop-manager"
    clientId: "shop-manager-backend"
    clientSecret: ${KEYCLOAK_CLIENT_SECRET}  # Use sealed secret
    authServerUrl: "https://auth.shop-manager.example.com"  # CHANGE THIS
    issuerUri: "https://auth.shop-manager.example.com/realms/shop-manager"  # CHANGE THIS
    jwkSetUri: "https://auth.shop-manager.example.com/realms/shop-manager/protocol/openid-connect/certs"  # CHANGE THIS

# Feature flags for production
features:
  investment:
    enabled: true
  analytics:
    enabled: true
  fraud:
    enabled: true
    mlModelEndpoint: "https://ml.shop-manager.example.com/fraud"
  multiCurrency: true
  barcodeScanning: true
  loyaltyProgram: true
  mobileApp: true
  apiRateLimiting: true

# Secrets configuration (use Sealed Secrets or External Secrets)
secrets:
  database:
    url: "jdbc:postgresql://shop-manager-postgresql:5432/shopmanager_prod"
    username: shopmanager
    password: ${POSTGRES_PASSWORD}  # Injected from secret

  keycloak:
    clientSecret: ${KEYCLOAK_CLIENT_SECRET}  # Injected from secret
    adminUsername: ${KEYCLOAK_ADMIN_USER}  # Injected from secret
    adminPassword: ${KEYCLOAK_ADMIN_PASSWORD}  # Injected from secret

  redis:
    enabled: true
    host: shop-manager-redis-master
    port: 6379
    password: ${REDIS_PASSWORD}  # Injected from secret

  backup:
    encryptionKey: ${BACKUP_ENCRYPTION_KEY}  # Injected from secret
    encryptionSalt: ${BACKUP_ENCRYPTION_SALT}  # Injected from secret

  jwt:
    secret: ${JWT_SECRET}  # Injected from secret
    refreshSecret: ${JWT_REFRESH_SECRET}  # Injected from secret

  monitoring:
    enabled: true
    datadogApiKey: ${DATADOG_API_KEY}  # Injected from secret
    newRelicLicenseKey: ${NEW_RELIC_LICENSE_KEY}  # Injected from secret
    sentryDsn: ${SENTRY_DSN}  # Injected from secret

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

# Pod Monitor for custom metrics
podMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  labels:
    release: prometheus

# Priority Class for production workloads
priorityClassName: high-priority

# Topology Spread Constraints for even distribution
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: shop-manager
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: shop-manager