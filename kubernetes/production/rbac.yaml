apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-manager-backend
  namespace: shop-manager-prod
  labels:
    app.kubernetes.io/name: shop-manager
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-manager-frontend
  namespace: shop-manager-prod
  labels:
    app.kubernetes.io/name: shop-manager
    app.kubernetes.io/component: frontend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shop-manager-backend-role
  namespace: shop-manager-prod
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shop-manager-backend-binding
  namespace: shop-manager-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shop-manager-backend-role
subjects:
- kind: ServiceAccount
  name: shop-manager-backend
  namespace: shop-manager-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shop-manager-monitoring
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shop-manager-monitoring-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shop-manager-monitoring
subjects:
- kind: ServiceAccount
  name: shop-manager-backend
  namespace: shop-manager-prod