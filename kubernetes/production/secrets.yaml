# Secret Management for Production
# NOTE: DO NOT commit actual secrets to version control!
# Use one of these approaches:
# 1. Sealed Secrets (Bitnami)
# 2. External Secrets Operator
# 3. Cloud Provider Secret Management (GCP Secret Manager, AWS Secrets Manager, Azure Key Vault)
# 4. HashiCorp Vault

---
# Example using Sealed Secrets (encrypted secrets safe to commit)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: shop-manager-secrets
  namespace: shop-manager-prod
spec:
  encryptedData:
    # These values should be encrypted using kubeseal
    # kubeseal --format=yaml < secrets.yaml > sealed-secrets.yaml
    POSTGRES_PASSWORD: "ENCRYPTED_VALUE_HERE"
    POSTGRES_ADMIN_PASSWORD: "ENCRYPTED_VALUE_HERE"
    KEYCLOAK_ADMIN_USER: "ENCRYPTED_VALUE_HERE"
    KEYCLOAK_ADMIN_PASSWORD: "ENCRYPTED_VALUE_HERE"
    KEYCLOAK_CLIENT_SECRET: "ENCRYPTED_VALUE_HERE"
    KEYCLOAK_DB_PASSWORD: "ENCRYPTED_VALUE_HERE"
    KAFKA_PASSWORD: "ENCRYPTED_VALUE_HERE"
    REDIS_PASSWORD: "ENCRYPTED_VALUE_HERE"
    JWT_SECRET: "ENCRYPTED_VALUE_HERE"
    JWT_REFRESH_SECRET: "ENCRYPTED_VALUE_HERE"
    BACKUP_ENCRYPTION_KEY: "ENCRYPTED_VALUE_HERE"
    BACKUP_ENCRYPTION_SALT: "ENCRYPTED_VALUE_HERE"
  template:
    metadata:
      name: shop-manager-secrets
      namespace: shop-manager-prod
    type: Opaque
---
# Example using External Secrets Operator
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: shop-manager-secret-store
  namespace: shop-manager-prod
spec:
  provider:
    # Google Secret Manager
    gcpsm:
      projectID: "your-gcp-project"  # CHANGE THIS
      auth:
        secretRef:
          secretAccessKey:
            name: gcpsm-secret
            key: secret-access-credentials
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: shop-manager-secrets
  namespace: shop-manager-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: shop-manager-secret-store
    kind: SecretStore
  target:
    name: shop-manager-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: shop-manager/production
---
# Image Pull Secret for Private Registry
apiVersion: v1
kind: Secret
metadata:
  name: gcr-secret
  namespace: shop-manager-prod
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: |
    {
      "auths": {
        "gcr.io": {
          "username": "_json_key",
          "password": "BASE64_ENCODED_SERVICE_ACCOUNT_KEY",
          "email": "not-used@example.com",
          "auth": "BASE64_ENCODED_AUTH_STRING"
        }
      }
    }
---
# TLS Certificate Secret (if not using cert-manager)
apiVersion: v1
kind: Secret
metadata:
  name: shop-manager-tls-manual
  namespace: shop-manager-prod
type: kubernetes.io/tls
data:
  tls.crt: |
    BASE64_ENCODED_TLS_CERTIFICATE
  tls.key: |
    BASE64_ENCODED_TLS_PRIVATE_KEY
---
# Backup Storage Credentials
apiVersion: v1
kind: Secret
metadata:
  name: backup-storage-credentials
  namespace: shop-manager-prod
type: Opaque
stringData:
  # For GCS
  gcs-service-account.json: |
    {
      "type": "service_account",
      "project_id": "your-project",
      "private_key_id": "key-id",
      "private_key": "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n",
      "client_email": "backup-sa@project.iam.gserviceaccount.com",
      "client_id": "1234567890",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/backup-sa%40project.iam.gserviceaccount.com"
    }
  # For AWS S3
  aws-credentials: |
    [default]
    aws_access_key_id = YOUR_ACCESS_KEY_ID
    aws_secret_access_key = YOUR_SECRET_ACCESS_KEY
  # For Azure Blob Storage
  azure-storage-account: YOUR_STORAGE_ACCOUNT_NAME
  azure-storage-key: YOUR_STORAGE_ACCOUNT_KEY